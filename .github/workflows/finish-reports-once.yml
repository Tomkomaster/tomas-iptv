name: One-off finish reports
on:
  push:
    branches: [agent/finish-reports]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/finish-reports
          fetch-depth: 0
      - run: python3 tools/_finish_reports_once.py
      - run: python3 -m py_compile iptv/reports.py iptv/build_core.py build.py
      - run: python3 run_tests.py
      - run: |
          rm tools/_finish_reports_once.py
          rm .github/workflows/finish-reports-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Finish reports extraction"
          git push origin HEAD:agent/finish-reports
