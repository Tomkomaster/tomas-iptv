name: Temporary canonical published-name patch

on:
  push:
    branches:
      - agent/canonical-published-names

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-names-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-published-names

      - name: Patch canonical publication naming
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('build.py')
          text = path.read_text(encoding='utf-8')

          old = '''def strip_display_annotations(name: str) -> str:\n    value = " ".join((name or "").split()).strip()\n    old = None\n    while value and value != old:\n        old = value\n        value = QUALITY_SUFFIX_RE.sub("", value).strip()\n    return value or "Unnamed channel"\n\n\ndef normalize_text(value: str) -> str:\n'''
          new = '''def split_display_annotations(name: str) -> tuple[str, list[str]]:\n    """Split recognized trailing quality/status annotations from a name."""\n    value = " ".join(str(name or "").split()).strip()\n    annotations: list[str] = []\n\n    while value:\n        match = QUALITY_SUFFIX_RE.search(value)\n        if not match or match.end() != len(value):\n            break\n\n        annotation = " ".join(match.group(0).split()).strip()\n        if annotation:\n            annotations.append(annotation)\n\n        value = value[:match.start()].strip()\n\n    annotations.reverse()\n    return (value or "Unnamed channel", annotations)\n\n\ndef deduplicate_identical_annotations(annotations: list[str]) -> list[str]:\n    """Collapse only adjacent identical recognized annotations."""\n    result: list[str] = []\n\n    for annotation in annotations:\n        if (\n            result\n            and annotation.casefold() == result[-1].casefold()\n        ):\n            continue\n        result.append(annotation)\n\n    return result\n\n\ndef collapse_duplicate_quality_suffixes(name: str) -> str:\n    """Collapse repeated identical trailing quality/status suffixes safely."""\n    base, annotations = split_display_annotations(name)\n    annotations = deduplicate_identical_annotations(annotations)\n    return " ".join([base, *annotations]).strip()\n\n\ndef published_display_from_canonical(\n    canonical_name: str,\n    research_display_name: str,\n) -> str:\n    """Build a published name from canonical identity plus safe annotations.\n\n    Research/provider wording stays out of the base identity. Only the\n    already-recognized trailing quality/status annotations are carried over.\n    """\n    cleaned_display = strip_internal_candidate_annotations(\n        strip_custom_prefix(research_display_name)\n    )\n    _, annotations = split_display_annotations(cleaned_display)\n    annotations = deduplicate_identical_annotations(annotations)\n    return " ".join([canonical_name, *annotations]).strip()\n\n\ndef strip_display_annotations(name: str) -> str:\n    base, _ = split_display_annotations(name)\n    return base\n\n\ndef normalize_text(value: str) -> str:\n'''
          if text.count(old) != 1:
              raise SystemExit('strip_display_annotations anchor changed')
          text = text.replace(old, new, 1)

          old = '''            candidate_name = str(\n                candidate.get("tvg_name")\n                or candidate.get("channel_name")\n                or candidate.get("display_name")\n                or ""\n            ).strip()\n'''
          new = '''            candidate_name = str(\n                candidate.get("channel_name")\n                or candidate.get("tvg_name")\n                or candidate.get("display_name")\n                or ""\n            ).strip()\n'''
          if text.count(old) != 1:
              raise SystemExit('canonical-name priority anchor changed')
          text = text.replace(old, new, 1)

          old = '''            else:\n                # Single-feed channels keep their original\n                # quality/status annotations.\n                original_display = (\n                    strip_internal_candidate_annotations(\n                        strip_custom_prefix(\n                            entry.get(\n                                "display_name",\n                                "",\n                            )\n                        )\n                    )\n                )\n'''
          new = '''            else:\n                # The published base name always comes from canonical channel\n                # identity. Preserve only recognized quality/status suffixes\n                # from the research display name, collapsing exact repeats.\n                original_display = published_display_from_canonical(\n                    canonical_name,\n                    str(entry.get("display_name") or ""),\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit('single-feed publication anchor changed')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_canonical_published_names.py')
          tests.write_text('''import unittest\n\nfrom build import (\n    collapse_duplicate_quality_suffixes,\n    prepare_published_entries,\n    published_display_from_canonical,\n)\n\n\nclass CanonicalPublishedNameTests(unittest.TestCase):\n    def test_duplicate_identical_quality_suffix_is_collapsed(self):\n        self.assertEqual(\n            collapse_duplicate_quality_suffixes("Minimax (576p) (576p)"),\n            "Minimax (576p)",\n        )\n        self.assertEqual(\n            collapse_duplicate_quality_suffixes("Demo TV (1080p) (1080p)"),\n            "Demo TV (1080p)",\n        )\n        self.assertEqual(\n            collapse_duplicate_quality_suffixes("Demo TV [720p] [720P]"),\n            "Demo TV [720p]",\n        )\n\n    def test_different_annotations_are_preserved(self):\n        self.assertEqual(\n            collapse_duplicate_quality_suffixes("Demo TV (1080p) [Geo-blocked]"),\n            "Demo TV (1080p) [Geo-blocked]",\n        )\n\n    def test_candidate_and_test_words_are_not_generically_deleted(self):\n        self.assertEqual(\n            published_display_from_canonical(\n                "Candidate Test Television",\n                "Candidate Test Television (720p)",\n            ),\n            "Candidate Test Television (720p)",\n        )\n\n    def test_single_feed_publication_uses_canonical_identity(self):\n        entries = prepare_published_entries(\n            [\n                {\n                    "channel_name": "Minimax",\n                    "tvg_name": "Minimax (576p)",\n                    "display_name": "Minimax research candidate (576p) (576p)",\n                    "tvg_id": "Minimax.cz",\n                    "language_code": "CZ",\n                    "country_name": "Czechia",\n                    "content_group": "Kids",\n                    "source_group_title": "Kids",\n                    "group_title": "Kids",\n                    "source": "Research source",\n                    "classification": "Base channel",\n                    "source_flags": [],\n                    "url": "https://example.test/minimax.m3u8",\n                    "lines": [\n                        '#EXTINF:-1 tvg-id="Minimax.cz",Minimax research candidate (576p) (576p)',\n                        "https://example.test/minimax.m3u8",\n                    ],\n                    "_decision": "Verified",\n                    "_source_order": 0,\n                }\n            ],\n            {\n                "default_language_code": "HU",\n                "country_names": {"CZ": "Czechia"},\n            },\n        )\n\n        self.assertEqual(len(entries), 1)\n        self.assertEqual(entries[0]["published_name"], "[CZ OK] Minimax (576p)")\n        self.assertNotIn("research candidate", entries[0]["published_name"].casefold())\n        self.assertNotIn("(576p) (576p)", entries[0]["published_name"] )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

          python3 -m unittest tests.test_canonical_published_names -v
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          git diff --check

      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "Tomkomaster"
          git config user.email "tomkomaster@freemail.hu"
          git add build.py tests/test_canonical_published_names.py
          git commit -m "Canonicalize published channel names [canonical-names-patched]"
          git push origin HEAD:agent/canonical-published-names
