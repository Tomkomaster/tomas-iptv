name: Temporary add hunted IPTV candidates

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hunt-candidates-2026-08-22-1
          fetch-depth: 0

      - name: Append fresh test candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          audit_text = Path('audit.json').read_text(encoding='utf-8')

          additions = {
              Path('extras/hu.m3u'): [
                  (
                      'https://sktv-forwarders.7m.pl/get.php?x=M4Plus',
                      '''\n# M4 Sport Plus — P2 fresh candidate from current maintained Hungary list\n# Forwarder candidate; test exact URL on VLC + Samsung before audit approval.\n#EXTINF:-1 tvg-id="M4SportPlus.hu" tvg-name="M4 Sport Plus",M4 Sport Plus [TEST] [Forwarder]\nhttps://sktv-forwarders.7m.pl/get.php?x=M4Plus\n'''
                  ),
              ],
              Path('extras/sk.m3u'): [
                  (
                      'https://live.cdn.joj.sk/live/andromeda/plus-720.m3u8',
                      '''\n# JOJ Plus — 720p alternate of current JOJ broadcaster CDN candidate\n# Exact 720p URL is new to our audit; test whether Samsung handles it better than 1080p.\n#EXTINF:-1 tvg-id="JOJPlus.sk" tvg-name="JOJ Plus",JOJ Plus [TEST] [720p alternate]\nhttps://live.cdn.joj.sk/live/andromeda/plus-720.m3u8\n'''
                  ),
                  (
                      'https://live.cdn.joj.sk/live/andromeda/wau-720.m3u8',
                      '''\n# JOJ Krimi — former WAU CDN path, 720p alternate\n# JOJ Krimi replaced WAU in 2026; test whether this lower-bitrate CDN variant is TV-safe.\n#EXTINF:-1 tvg-id="JOJWAU.sk" tvg-name="JOJ Krimi",JOJ Krimi [TEST] [720p alternate]\nhttps://live.cdn.joj.sk/live/andromeda/wau-720.m3u8\n'''
                  ),
                  (
                      'https://live.cdn.joj.sk/live/andromeda/joj_sport-720.m3u8',
                      '''\n# JOJ Šport — 720p alternate of current JOJ broadcaster CDN candidate\n# Exact 720p URL is new to our audit; test on VLC + Samsung.\n#EXTINF:-1 tvg-id="JOJSport.sk" tvg-name="JOJ Šport",JOJ Šport [TEST] [720p alternate]\nhttps://live.cdn.joj.sk/live/andromeda/joj_sport-720.m3u8\n'''
                  ),
                  (
                      'https://live.cdn.joj.sk/live/andromeda/cinema-720.m3u8',
                      '''\n# JOJ Cinema — 720p JOJ CDN alternate\n# Current audit has other JOJ Cinema candidates; this exact 720p broadcaster-CDN URL is new.\n#EXTINF:-1 tvg-id="JOJCinema.sk" tvg-name="JOJ Cinema",JOJ Cinema [TEST] [720p alternate]\nhttps://live.cdn.joj.sk/live/andromeda/cinema-720.m3u8\n'''
                  ),
                  (
                      'http://tvh.cyn.cz/stream/channelid/1406456571?profile=pass',
                      '''\n# Nova International — current external pass-through candidate\n# Recent maintained playlist source; exact URL is new to our audit.\n#EXTINF:-1 tvg-name="Nova International",Nova International [TEST] [Pass-through]\nhttp://tvh.cyn.cz/stream/channelid/1406456571?profile=pass\n'''
                  ),
              ],
          }

          changed = []
          for path, candidates in additions.items():
              text = path.read_text(encoding='utf-8')
              new_blocks = []
              for url, block in candidates:
                  if url in audit_text:
                      raise SystemExit(f'Candidate already exists in audit.json: {url}')
                  if url in text:
                      continue
                  new_blocks.append(block)
              if new_blocks:
                  marker = '\n# ============================================================\n# HUNT BATCH 2026-08-22 — FRESH UNTESTED CANDIDATES\n# ============================================================\n'
                  if 'HUNT BATCH 2026-08-22 — FRESH UNTESTED CANDIDATES' not in text:
                      text = text.rstrip() + marker
                  text = text.rstrip() + ''.join(new_blocks) + '\n'
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if set(changed) != {'extras/hu.m3u', 'extras/sk.m3u'}:
              raise SystemExit(f'Unexpected changed files: {changed!r}')
          print('Added fresh hunt candidates:', ', '.join(changed))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/hu.m3u extras/sk.m3u
          git commit -m "Add fresh channel hunt candidates"
          git push origin HEAD:hunt-candidates-2026-08-22-1
