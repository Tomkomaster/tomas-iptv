name: Temporary add hunt batch 6

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-five-sk-successes-2026-08-22
          fetch-depth: 0

      - name: Append fresh candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = {
              Path('extras/sk.m3u'): [
                  (
                      'http://185.188.188.235/live/premiersport/playlist.m3u8',
                      '# Premier Sport 1 SK — current community-listed HLS candidate\n# Fresh exact URL; manual PC + Samsung test required.\n#EXTINF:-1 tvg-name="PREMIER SPORT 1 SK",PREMIER SPORT 1 SK [TEST] [185.188.188.235]\nhttp://185.188.188.235/live/premiersport/playlist.m3u8\n'
                  ),
                  (
                      'http://82.202.173.201:25461/okverd/123456/16117',
                      '# Premier Sport 3 — alternate direct IPTV candidate\n# Fresh exact URL from a separate source family; manual PC + Samsung test required.\n#EXTINF:-1 tvg-name="PREMIER SPORT 3",PREMIER SPORT 3 [TEST] [82.202.173.201]\nhttp://82.202.173.201:25461/okverd/123456/16117\n'
                  ),
                  (
                      'http://78.130.250.2:8023/play/a02v/index.m3u8',
                      '# CANAL+ SPORT SK — direct HLS candidate\n# Endpoint is publicly identified as CANAL+ Sport; verify playback and channel identity/audio suitability for the SK target.\n#EXTINF:-1 tvg-name="CANAL+ SPORT SK",CANAL+ SPORT SK [TEST] [78.130.250.2]\nhttp://78.130.250.2:8023/play/a02v/index.m3u8\n'
                  ),
              ],
              Path('extras/hu.m3u'): [
                  (
                      'http://78.130.250.2:8023/play/a018/index.m3u8',
                      '# Auto Motor Sport — direct HLS candidate\n# Endpoint is publicly identified as AutoMotorSport HD; verify playback and Hungarian-audio suitability.\n#EXTINF:-1 tvg-name="Auto Motor Sport",Auto Motor Sport [TEST] [78.130.250.2]\nhttp://78.130.250.2:8023/play/a018/index.m3u8\n'
                  ),
              ],
          }

          audit = Path('audit.json').read_text(encoding='utf-8')
          added = 0
          for path, entries in candidates.items():
              text = path.read_text(encoding='utf-8')
              blocks = []
              for url, block in entries:
                  if url in audit:
                      raise SystemExit(f'Candidate already present in audit.json: {url}')
                  if url in text:
                      raise SystemExit(f'Candidate already present in {path}: {url}')
                  blocks.append(block)
                  added += 1
              marker = '\n# ============================================================\n# HUNT BATCH 6 — 2026-08-22 — FRESH UNTESTED CANDIDATES\n# ============================================================\n'
              text = text.rstrip() + marker + '\n'.join(blocks) + '\n'
              path.write_text(text, encoding='utf-8')

          if added != 4:
              raise SystemExit(f'Expected 4 fresh candidates, got {added}')
          print('Added 4 fresh hunt candidates')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/sk.m3u extras/hu.m3u
          git commit -m "Add next channel hunt candidates"
          git push origin HEAD:record-five-sk-successes-2026-08-22
