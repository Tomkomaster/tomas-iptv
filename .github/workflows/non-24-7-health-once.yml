name: One-time non-24-7 health policy implementation

on:
  push:
    branches:
      - "agent/non-24-7-health-policy"
    paths:
      - ".github/workflows/non-24-7-health-once.yml"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/non-24-7-health-policy
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 .apply_non247_patch.py

      - name: Run validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile health_policy.py healthcheck.py attention.py build.py
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthcheck.py attention.py build.py
          git commit -m "Handle event-based stream inactivity"
          git push origin HEAD:agent/non-24-7-health-policy
