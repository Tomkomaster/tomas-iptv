name: Temporary record JOJ Plus and Krimi results

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-joj-plus-krimi-results-2026-08-22
          fetch-depth: 0

      - name: Record exact manual playback results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          tests = [
              {
                  'channel': 'JOJ Plus',
                  'tvg_id': 'JOJPlus.sk',
                  'url': 'https://sktv.mxnticek.eu/new/stream.php?ch=JOJ%20Plus',
                  'works': True,
                  'identity_note': None,
              },
              {
                  'channel': 'JOJ Krimi',
                  'tvg_id': 'JOJWAU.sk',
                  'url': 'https://sktv.mxnticek.eu/new/stream.php?ch=Wau',
                  'works': True,
                  'identity_note': 'Playback identity manually confirmed: the channel displays JOJ KRIMI, not legacy WAU branding.',
              },
              {
                  'channel': 'JOJ Šport',
                  'tvg_id': 'JOJSport.sk',
                  'url': 'https://sktv.mxnticek.eu/new/stream.php?ch=JOJ%20%C5%A0port',
                  'works': False,
                  'identity_note': None,
              },
              {
                  'channel': 'Nova International',
                  'tvg_id': None,
                  'url': 'http://88.212.7.10/live/test_nova_int_25p/playlist.m3u8',
                  'works': False,
                  'identity_note': None,
              },
          ]

          audit_path = Path('audit.json')
          payload = json.loads(audit_path.read_text(encoding='utf-8'))
          rows = payload['channels']
          by_url = {}
          for row in rows:
              url = str(row.get('stream_url') or '').strip()
              if url:
                  if url in by_url:
                      raise SystemExit(f'Duplicate audit URL before update: {url}')
                  by_url[url] = row

          added = updated = 0
          for test in tests:
              row = by_url.get(test['url'])
              if row is None:
                  row = {'channel': test['channel'], 'stream_url': test['url']}
                  rows.append(row)
                  by_url[test['url']] = row
                  added += 1
              else:
                  updated += 1

              row['channel'] = test['channel']
              row['stream_url'] = test['url']
              if test['tvg_id']:
                  row['tvg_id'] = test['tvg_id']
              row['playlist_country_code'] = 'SK'
              row['output_country_code'] = 'SK'
              row['expected_language_codes'] = ['slk']
              row['observed_language_codes'] = ['slk']
              row['language_match'] = 'yes'
              row['tested_on'] = '2026-08-22'
              row['provenance'] = 'User-provided manual playback result'
              row['discovery'] = 'Manual PC + Samsung test supplied 2026-08-22'

              if test['works']:
                  row['vlc'] = 'works'
                  row['samsung'] = 'works'
                  row['vlc_note'] = 'ok'
                  row['samsung_note'] = 'ok'
                  row.pop('decision', None)
                  row.pop('reason', None)
                  notes = ['Passed both manual playback tests.']
                  if test['identity_note']:
                      notes.append(test['identity_note'])
                  row['notes'] = ' '.join(notes)
                  row['exclude_from_playlist'] = False
              else:
                  row['vlc'] = 'generic_error'
                  row['samsung'] = 'generic_error'
                  row['vlc_note'] = 'User reported no playback on PC.'
                  row['samsung_note'] = 'User reported no playback on Samsung.'
                  row['decision'] = 'rejected'
                  row['reason'] = 'This exact feed failed on both tested devices.'
                  row['notes'] = 'Reject this exact URL only; continue searching for a different source.'
                  row['exclude_from_playlist'] = True

          audit_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          wanted_path = Path('data/wanted_channels_sk.json')
          wanted = json.loads(wanted_path.read_text(encoding='utf-8'))
          before = len(wanted['channels'])
          solved = {'JOJ Plus', 'JOJ Krimi'}
          wanted['channels'] = [r for r in wanted['channels'] if r.get('channel') not in solved]
          removed = before - len(wanted['channels'])
          if removed != 2:
              raise SystemExit(f'Expected to remove 2 solved wanted rows, removed {removed}')
          wanted_path.write_text(json.dumps(wanted, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Guard the four exact results and the two solved wanted identities.
          check = json.loads(audit_path.read_text(encoding='utf-8'))['channels']
          lookup = {r.get('stream_url'): r for r in check}
          for test in tests:
              row = lookup[test['url']]
              expected_exclude = not test['works']
              if row.get('exclude_from_playlist') is not expected_exclude:
                  raise SystemExit(f'Wrong exclude flag for {test["url"]}')
              if test['works'] and (row.get('vlc') != 'works' or row.get('samsung') != 'works'):
                  raise SystemExit(f'Working result not preserved for {test["url"]}')
              if not test['works'] and row.get('decision') != 'rejected':
                  raise SystemExit(f'Failed result not rejected for {test["url"]}')

          remaining = {r.get('channel') for r in json.loads(wanted_path.read_text(encoding='utf-8'))['channels']}
          if 'JOJ Plus' in remaining or 'JOJ Krimi' in remaining:
              raise SystemExit('Solved JOJ channels still remain in wanted list')
          if 'JOJ ŠPORT' not in remaining and 'JOJ Šport' not in remaining:
              raise SystemExit('JOJ Šport should remain wanted')
          if 'Nova International' not in remaining:
              raise SystemExit('Nova International should remain wanted')

          print(f'Recorded 4 results: {added} new audit rows, {updated} updated; removed JOJ Plus and JOJ Krimi from wanted.')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json data/wanted_channels_sk.json
          git commit -m "Record JOJ Plus and Krimi playback results"
          git push origin HEAD:record-joj-plus-krimi-results-2026-08-22
