name: Temporary EPG pin integration and validation

on:
  push:
    branches:
      - agent/pin-epg-builder

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[epg-pin-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pin-epg-builder

      - name: Pin IPTV-org EPG revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-and-publish.yml')
          text = path.read_text(encoding='utf-8')

          concurrency = '''concurrency:\n  group: "pages"\n  cancel-in-progress: true\n\n'''
          env_block = '''concurrency:\n  group: "pages"\n  cancel-in-progress: true\n\nenv:\n  # Pin the IPTV-org EPG repository itself; npm ci only pins its npm tree.\n  IPTV_ORG_EPG_REV: "15965406e3d950433788a085a15ab256a8e0035d"\n\n'''
          if text.count(concurrency) != 1:
              raise SystemExit('workflow concurrency anchor changed')
          text = text.replace(concurrency, env_block, 1)

          old = '''          git clone \\\n            --depth 1 \\\n            --branch master \\\n            https://github.com/iptv-org/epg.git \\\n            .epg-builder\n\n          cd .epg-builder\n          npm ci\n          cd "$GITHUB_WORKSPACE"\n'''
          new = '''          mkdir .epg-builder\n          git -C .epg-builder init\n          git -C .epg-builder remote add origin https://github.com/iptv-org/epg.git\n          git -C .epg-builder fetch --depth 1 origin "$IPTV_ORG_EPG_REV"\n          git -C .epg-builder checkout --detach FETCH_HEAD\n\n          EPG_ACTUAL_REV="$(git -C .epg-builder rev-parse HEAD)"\n          if [ "$EPG_ACTUAL_REV" != "$IPTV_ORG_EPG_REV" ]; then\n            echo "ERROR: expected IPTV-org/epg $IPTV_ORG_EPG_REV but checked out $EPG_ACTUAL_REV" >&2\n            exit 1\n          fi\n          echo "Using pinned IPTV-org/epg revision: $EPG_ACTUAL_REV"\n\n          cd .epg-builder\n          npm ci\n          cd "$GITHUB_WORKSPACE"\n'''
          if text.count(old) != 1:
              raise SystemExit('moving EPG clone block anchor changed')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate exact pinned EPG builder
        shell: bash
        env:
          IPTV_ORG_EPG_REV: "15965406e3d950433788a085a15ab256a8e0035d"
        run: |
          set -euo pipefail
          rm -rf .epg-builder
          rm -f .epg.channels.xml .epg-iptv.xml .epg-iptv-coverage.json

          mkdir .epg-builder
          git -C .epg-builder init
          git -C .epg-builder remote add origin https://github.com/iptv-org/epg.git
          git -C .epg-builder fetch --depth 1 origin "$IPTV_ORG_EPG_REV"
          git -C .epg-builder checkout --detach FETCH_HEAD

          ACTUAL="$(git -C .epg-builder rev-parse HEAD)"
          test "$ACTUAL" = "$IPTV_ORG_EPG_REV"
          echo "Validated checkout: $ACTUAL"

          cd .epg-builder
          npm ci
          cd "$GITHUB_WORKSPACE"

          python3 epg_country_prepare.py \
            --config config.json \
            --epg-root .epg-builder \
            --output .epg.channels.xml \
            --report .epg-iptv-coverage.json

          cd .epg-builder
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.epg-iptv.xml" \
            --maxConnections=3
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('.epg-iptv.xml')
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('Pinned EPG builder produced no XMLTV output')
          root = ET.parse(path).getroot()
          if root.tag != 'tv':
              raise SystemExit(f'Unexpected XMLTV root: {root.tag!r}')
          channels = root.findall('channel')
          programmes = root.findall('programme')
          if not channels or not programmes:
              raise SystemExit(
                  f'Pinned EPG builder output incomplete: {len(channels)} channels, {len(programmes)} programmes'
              )
          print(
              f'Pinned EPG builder OK: {len(channels)} channels, '
              f'{len(programmes)} programmes, {path.stat().st_size:,} bytes.'
          )
          PY

      - name: Commit permanent workflow change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-and-publish.yml
          git commit -m "Pin IPTV-org EPG builder revision [epg-pin-patched]"
          git push origin HEAD:agent/pin-epg-builder
