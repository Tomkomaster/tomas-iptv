name: Temporary feed quality refinement patch

on:
  push:
    branches:
      - agent/feed-quality-scoring

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[feed-quality-refined]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/feed-quality-scoring

      - name: Refine scoring implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feed_quality.py')
          text = path.read_text(encoding='utf-8')
          old = '''DEFAULT_OFFICIAL_SOURCE_TERMS = (\n    "official broadcaster",\n    "current broadcaster stream",\n    "direct broadcaster",\n    "broadcaster stream",\n)\n'''
          new = '''DEFAULT_OFFICIAL_SOURCE_TERMS = (\n    "official broadcaster",\n    "current broadcaster stream",\n    "direct broadcaster",\n    "broadcaster stream",\n    "broadcaster cdn",\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('official source terms anchor changed')
          text = text.replace(old, new, 1)

          old = '''    source_flags = {\n        str(value).strip().casefold()\n        for value in (entry.get("source_flags") or audit.get("source_flags") or [])\n        if str(value).strip()\n    }\n'''
          new = '''    source_flags = {\n        str(value).strip().casefold()\n        for raw_flags in (\n            entry.get("source_flags") or [],\n            audit.get("source_flags") or [],\n        )\n        for value in raw_flags\n        if str(value).strip()\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('source flags anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('config.json')
          text = path.read_text(encoding='utf-8')
          old = '''        "direct broadcaster",\n        "broadcaster stream"\n'''
          new = '''        "direct broadcaster",\n        "broadcaster stream",\n        "broadcaster cdn"\n'''
          if text.count(old) != 1:
              raise SystemExit('config official source terms anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_feed_quality.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"quality_flags": ["official_broadcaster"],\n                "output_language_code"',
              '"provenance": "Current broadcaster stream",\n                "output_language_code"',
              1,
          )
          text = text.replace(
              '"quality_flags": ["provider_relay"],\n                "output_language_code"',
              '"provenance": "Panaccess provider relay",\n                "output_language_code"',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile feed_quality.py
          python3 -m json.tool config.json >/dev/null
          git diff --check

      - name: Commit refinements
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Tomkomaster"
          git config user.email "tomkomaster@freemail.hu"
          git add feed_quality.py config.json tests/test_feed_quality.py
          git commit -m "Refine feed quality evidence handling [feed-quality-refined]"
          git push origin HEAD:agent/feed-quality-scoring
