name: Finalize dashboard operations

on:
  push:
    branches:
      - agent/dashboard-country-operations

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply refinement
        run: python3 tools/agent_refine_dashboard_identity.py
      - name: Validate
        run: |
          node --check static/dashboard.js
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          python3 research_exports.py --public-dir public --priority-policy research_priority.json
          git diff --check
          grep -q 'Same-URL identity conflicts' public/index.html
          grep -q 'Candidate streams to test' public/index.html
          grep -q 'Health by country' public/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py templates/dashboard.html static/dashboard.js tests/test_dashboard_operational_features.py
          git commit -m "Refine dashboard identity conflict detection"
          git push
