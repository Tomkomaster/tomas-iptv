name: Refine dashboard identity conflicts

on:
  push:
    branches:
      - agent/dashboard-country-operations

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "static/dashboard.js",
              "const SUPPORTED_COUNTRIES = ['HU', 'SK', 'CZ'];",
              '''const SUPPORTED_COUNTRIES = Array.from(document.querySelectorAll('[data-country-tab]'))
  .map(button => String(button.dataset.countryTab || '').toUpperCase())
  .filter(code => code && code !== 'ALL');''',
          )
          replace_once(
              "static/dashboard.js",
              "const testedStatuses = new Set(['works', 'works_with_warning', 'loads', 'mrl_error', 'format_error', 'generic_error', 'wrong_language', 'needs_review']);",
              "const testedStatuses = new Set(['works', 'works_with_warning', 'loads', 'mrl_error', 'format_error', 'generic_error', 'wrong_language']);",
          )

          replace_once(
              "dashboard.py",
              '''    reroute_count = 0\n    for a in audit_rows:\n''',
              '''    url_identity_conflicts = 0\n    url_identities: dict[str, list[dict]] = {}\n    for a in audit_rows:\n        url = str(a.get("stream_url") or "").strip()\n        if url:\n            url_identities.setdefault(url, []).append(a)\n\n    for url, rows_for_url in url_identities.items():\n        identities = {\n            (\n                str(row.get("channel") or "").strip().casefold(),\n                normalized_country_code(row.get("playlist_language_code")),\n            )\n            for row in rows_for_url\n        }\n        if len(identities) <= 1:\n            continue\n\n        url_identity_conflicts += 1\n        channels = sorted({\n            str(row.get("channel") or "Unnamed channel").strip()\n            for row in rows_for_url\n        }, key=str.casefold)\n        source_scopes = sorted({\n            normalized_country_code(row.get("playlist_language_code"))\n            for row in rows_for_url\n            if normalized_country_code(row.get("playlist_language_code")) != "UNKNOWN"\n        })\n        output_scopes = sorted({\n            normalized_country_code(row.get("output_language_code"))\n            for row in rows_for_url\n            if normalized_country_code(row.get("output_language_code")) != "UNKNOWN"\n        })\n        identity_rows.append(\n            f"""\n            <tr data-country="ALL">\n              <td><span class="badge rejected">URL conflict</span></td>\n              <td class="channel">{esc(" / ".join(channels))}</td>\n              <td>{esc(", ".join(source_scopes) or "—")}</td>\n              <td>{esc(", ".join(output_scopes) or "—")}</td>\n              <td>—</td>\n              <td><div class="detail">The same saved stream URL appears under multiple channel/source-scope identities. Verification is not transferred automatically. <a href="{esc(url)}" target="_blank" rel="noopener">stream</a></div></td>\n            </tr>\n            """\n        )\n\n    reroute_count = 0\n    for a in audit_rows:\n''',
          )
          replace_once(
              "dashboard.py",
              '''        "IDENTITY_UNRESOLVED": str(len(audit_ambiguity_warnings)),\n        "IDENTITY_REROUTED": str(reroute_count),''',
              '''        "IDENTITY_UNRESOLVED": str(len(audit_ambiguity_warnings)),\n        "IDENTITY_URL_CONFLICTS": str(url_identity_conflicts),\n        "IDENTITY_REROUTED": str(reroute_count),''',
          )
          replace_once(
              "templates/dashboard.html",
              '''    <div class="card"><div class="value">@@IDENTITY_UNRESOLVED@@</div><div class="label">Unresolved identity warnings</div></div>\n    <div class="card"><div class="value">@@IDENTITY_REROUTED@@</div><div class="label">Verified cross-country routings</div></div>''',
              '''    <div class="card"><div class="value">@@IDENTITY_UNRESOLVED@@</div><div class="label">Unresolved identity warnings</div></div>\n    <div class="card"><div class="value">@@IDENTITY_URL_CONFLICTS@@</div><div class="label">Same-URL identity conflicts</div></div>\n    <div class="card"><div class="value">@@IDENTITY_REROUTED@@</div><div class="label">Verified cross-country routings</div></div>''',
          )
          replace_once(
              "tests/test_dashboard_operational_features.py",
              '''        self.assertIn("Conflicting identities", page)\n        self.assertIn("Candidate streams to test", page)''',
              '''        self.assertIn("Conflicting identities", page)\n        self.assertIn("Same-URL identity conflicts", page)\n        self.assertIn("Candidate streams to test", page)''',
          )
          PY

      - name: Validate
        run: |
          node --check static/dashboard.js
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          python3 research_exports.py --public-dir public --priority-policy research_priority.json
          git diff --check
          grep -q 'Same-URL identity conflicts' public/index.html

      - name: Commit refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py templates/dashboard.html static/dashboard.js tests/test_dashboard_operational_features.py
          git commit -m "Refine dashboard identity conflict detection"
          git push
