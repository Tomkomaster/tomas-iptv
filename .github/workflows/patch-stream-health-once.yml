name: One-time integrate stream health

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/patch-stream-health-once.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Patch dashboard and production workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 patch_stream_health_integration.py
          git diff --check
          git diff -- build.py .github/workflows/build-and-publish.yml

      - name: Run tests and strict build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Live-check all stable streams
        shell: bash
        run: |
          set -euo pipefail
          python3 healthcheck.py --no-previous
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('public/health.json').read_text(
                  encoding='utf-8'
              )
          )
          summary = data['summary']
          print('=== AUTOMATED STREAM HEALTH ===')
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          print('Needs manual retest:', [
              item['channel']
              for item in data['streams']
              if item.get('manual_retest_recommended')
          ])

          if summary['total'] != 104:
              raise SystemExit(
                  f"Expected 104 stable streams, got {summary['total']}"
              )
          PY

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py .github/workflows/build-and-publish.yml
          git commit -m "Integrate automated stream health dashboard"
          git push
