name: One-time integrate stream health

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/patch-stream-health-once.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Patch health checker and dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('healthcheck.py')
          text = path.read_text(encoding='utf-8')
          old = 'prefix = data[:256].lstrip().casefold()'
          new = 'prefix = data[:256].lstrip().lower()'
          if old not in text:
              raise SystemExit('healthcheck bytes fix target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 patch_stream_health_integration.py
          git checkout -- .github/workflows/build-and-publish.yml
          git diff --check
          git diff -- healthcheck.py build.py

      - name: Run tests and strict build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Commit checker and dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthcheck.py build.py
          git commit -m "Integrate automated stream health dashboard"
          git push
