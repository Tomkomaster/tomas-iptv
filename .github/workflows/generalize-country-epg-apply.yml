name: Apply country and EPG generalization

on:
  push:
    branches:
      - agent/generalize-country-language-external-epg

permissions:
  contents: write

concurrency:
  group: generalize-country-epg-apply
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/generalize-country-language-external-epg

      - name: Apply deterministic patch
        run: python3 .github/remaining_generalization_patch.py

      - name: Compile changed Python modules
        run: python3 -m py_compile build.py country_language.py epg_multi_merge.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict playlist build
        run: python3 build.py --strict

      - name: Commit validated patch and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py .github/workflows/build-and-publish.yml
          git rm .github/remaining_generalization_patch.py
          git rm .github/workflows/generalize-country-epg-apply.yml
          git commit -m "Generalize country attribution and external EPG"
          git push origin HEAD:agent/generalize-country-language-external-epg
