name: One-time Nicktoons audit fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-nicktoons-audit.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Link legacy Nicktoons audit to exact feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("audit.json")
          text = path.read_text(encoding="utf-8")

          old = '''    {
                "channel": "Nicktoons",
                "vlc": "works",'''.replace("                ", "      ")

          new = '''    {
                "channel": "Nicktoons",
                "stream_url": "http://88.212.15.19/live/nicktoons_hungary/index.m3u8",
                "tvg_id": "Nicktoons.hu@SD",
                "protocol": "HLS",
                "vlc": "works",'''.replace("                ", "      ")

          matches = text.count(old)
          if matches == 0:
              already = (
                  '"channel": "Nicktoons"' in text
                  and '"stream_url": "http://88.212.15.19/live/nicktoons_hungary/index.m3u8"' in text
                  and '"tvg_id": "Nicktoons.hu@SD"' in text
              )
              if already:
                  print("Nicktoons audit mapping is already present.")
                  raise SystemExit(0)
              raise SystemExit("Expected legacy Nicktoons audit block was not found.")

          if matches != 1:
              raise SystemExit(f"Expected exactly one Nicktoons legacy block, found {matches}.")

          updated = text.replace(old, new, 1)
          json.loads(updated)
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit exact audit mapping
        run: |
          if git diff --quiet -- audit.json; then
            echo "No audit change needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git commit -m "Link Nicktoons audit to exact feed"
          git push
