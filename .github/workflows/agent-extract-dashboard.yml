name: Extract dashboard presentation

on:
  push:
    branches:
      - agent/dashboard-presentation-extraction

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract dashboard presentation
        run: |
          python3 tools/agent_extract_dashboard.py
          python3 tools/agent_patch_dashboard_tests.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict playlist build
        run: python3 build.py --strict

      - name: Check diff
        run: |
          git diff --check
          test -f templates/dashboard.html
          test -f static/dashboard.css
          test -f static/dashboard.js
          test -f dashboard.py
          grep -q 'static/dashboard.css' public/index.html
          grep -q 'static/dashboard.js' public/index.html
          test -f public/static/dashboard.css
          test -f public/static/dashboard.js
          ! grep -qi '<style>' build.py
          ! grep -q 'function renderEpgCountryCoverage' build.py

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build.py \
            dashboard.py \
            templates/dashboard.html \
            static/dashboard.css \
            static/dashboard.js \
            tests/test_dashboard_presentation.py \
            tests/test_dashboard_attention.py \
            tests/test_dashboard_health.py \
            tests/test_non_24_7_health.py
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "Extract dashboard presentation layer"
          git push
