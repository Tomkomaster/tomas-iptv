name: Update Czech README

on:
  push:
    branches:
      - agent/readme-czech-first-class

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update README
        run: python3 .github/scripts/agent_update_readme_czech.py

      - name: Verify documentation consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          required = [
              "🇨🇿 Czechia (`CZ`)",
              "extras/cz.m3u",
              "public/cz.m3u",
              "[CZ ?] Example Czech TV",
              "tv.m3u -> [CZ] Example Czech TV",
              "cz.m3u -> Example Czech TV",
              "IPTV-org Czech language",
              "observed_language_codes",
          ]
          for marker in required:
              if marker not in text:
                  raise RuntimeError(f"Missing expected README marker: {marker}")
          forbidden = [
              "Czechia (`CZ`) is already known by the builder and is a planned future expansion",
              "Czechia, when enabled later",
              "Czech channel support;",
              "This split is **not implemented yet**",
          ]
          for marker in forbidden:
              if marker in text:
                  raise RuntimeError(f"Stale README text remains: {marker}")
          print("README Czech support documentation is consistent.")
          PY
          git diff --check
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Document Czechia as a first-class country"
          git push origin HEAD:agent/readme-czech-first-class
