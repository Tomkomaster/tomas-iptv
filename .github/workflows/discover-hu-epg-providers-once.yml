name: One-time discover Hungarian EPG providers

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/discover-hu-epg-providers-once.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build playlist
        run: python3 build.py --strict
      - name: Clone IPTV-org EPG
        run: git clone --depth 1 --branch master https://github.com/iptv-org/epg.git .epg-builder
      - name: Rank provider overlap
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          from epg_prepare import read_playlist_tvg_ids, quality_base_id

          ids = read_playlist_tvg_ids(Path('public/tv.m3u'))
          exact = {x.casefold(): x for x in ids}
          base = defaultdict(list)
          for x in ids:
              base[quality_base_id(x)].append(x)

          rows = []
          for p in Path('.epg-builder/sites').glob('*/*.channels.xml'):
              site = p.parent.name
              matched = set()
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  continue
              for ch in root.findall('.//channel'):
                  xid = (ch.get('xmltv_id') or '').strip()
                  if not xid:
                      continue
                  k = xid.casefold()
                  if k in exact:
                      matched.add(exact[k])
                  else:
                      matched.update(base.get(quality_base_id(xid), []))
              if matched:
                  rows.append((len(matched), site, sorted(matched)))

          rows.sort(key=lambda x: (-x[0], x[1]))
          print(f'Playlist tvg IDs: {len(ids)}')
          for count, site, matched in rows[:60]:
              print(f'{count:3d} {site}: ' + ', '.join(matched))
          PY
