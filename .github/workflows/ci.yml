name: Validate pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-manual-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/manual-playback-2026-08-22'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout manual audit branch
        uses: actions/checkout@v7
        with:
          ref: audit/manual-playback-2026-08-22

      - name: Apply guarded manual audit patch
        shell: bash
        run: |
          python3 - <<'RUNNER'
          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/manual-audit-patch-2026-08-22.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in source:
              raise SystemExit('Could not locate embedded audit patch.')
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<manual-audit-patch>', 'exec'))
          RUNNER

      - name: Validate patched audit
        shell: bash
        run: |
          python3 -m json.tool audit.json >/dev/null
          python3 run_tests.py
          git diff --check

      - name: Commit audit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Record manual VLC and Samsung playback tests"
          git push origin HEAD:audit/manual-playback-2026-08-22

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run unit tests
        run: python3 run_tests.py

      - name: Validate repository health policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from health_policy import compile_health_policy

          payload = json.loads(
              Path("data/health_policy.json").read_text(encoding="utf-8")
          )
          compile_health_policy(payload)
          print("data/health_policy.json is valid.")
          PY

      - name: Run reliable strict playlist build
        run: python3 -m tools.reliable_build --strict

      - name: Validate same-build failover report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/same-build-health.json")
          if not path.is_file():
              raise SystemExit("same-build-health.json was not generated.")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("selection_only") is not True:
              raise SystemExit("same-build-health.json must remain selection_only=true.")
          unsafe = [
              row for row in (data.get("streams") or [])
              if row.get("decision") not in {"Verified", "TV verified"}
          ]
          if unsafe:
              raise SystemExit("Same-build probe included a feed without manual TV-safe verification.")
          print(
              "Same-build failover report OK: "
              f"{(data.get('summary') or {}).get('redundant_channels', 0)} redundant channels."
          )
          PY

      - name: Validate research exports
        run: >-
          python3 -m tools.research_exports
          --public-dir public
          --priority-policy data/research_priority.json
          --wanted-channels data/wanted_channels.json
