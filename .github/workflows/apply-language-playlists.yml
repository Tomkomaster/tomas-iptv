name: Validate and apply language playlists

on:
  push:
    branches:
      - agent/add-language-playlists

permissions:
  contents: write

concurrency:
  group: apply-language-playlists
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-language-playlists

      - name: Apply deterministic feature patch
        run: python3 .github/language_playlists_patch.py

      - name: Compile changed Python modules
        run: python3 -m py_compile build.py country_language.py tests/test_language_playlists.py

      - name: Run full unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run strict live build
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --strict 2>&1 | tee /tmp/language-playlists-build.log
          if grep -F "saved audit belongs to" /tmp/language-playlists-build.log; then
            echo "ERROR: audit country-scope warnings were introduced." >&2
            exit 1
          fi

      - name: Validate generated language playlists
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('config.json').read_text(encoding='utf-8'))
          expected = {
              'hun': Path('public/by-language/hun.m3u'),
              'slk': Path('public/by-language/slk.m3u'),
              'ces': Path('public/by-language/ces.m3u'),
          }
          assert cfg.get('language_outputs') == {
              key: str(path).replace('\\', '/')
              for key, path in expected.items()
          }
          for code, path in expected.items():
              assert path.is_file(), f'missing {path}'
              text = path.read_text(encoding='utf-8')
              assert text.startswith('#EXTM3U'), path
              assert f'Playlist: Stable ' in text, path

          report = json.loads(Path('public/report.json').read_text(encoding='utf-8'))
          counts = report.get('playlists', {}).get('language_stream_urls') or {}
          assert set(counts) == {'hun', 'slk', 'ces'}, counts
          assert report.get('schema_version') == 23
          print('Language playlist counts:', counts)
          PY

      - name: Confirm existing public country paths are unchanged
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config.json').read_text(encoding='utf-8'))
          assert cfg['output'] == 'public/tv.m3u'
          assert cfg['test_output'] == 'public/test.m3u'
          assert cfg['country_outputs'] == {
              'HU': 'public/hu.m3u',
              'SK': 'public/sk.m3u',
              'CZ': 'public/cz.m3u',
          }
          PY

      - name: Check formatting
        run: git diff --check

      - name: Commit validated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build.py \
            config.json \
            country_language.py \
            README.md \
            docs/country-language-model.md \
            tests/test_language_playlists.py
          git commit -m "Add spoken-language playlists"
          git push origin HEAD:agent/add-language-playlists
