name: One-time apply and validate EPG fixes

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/apply-epg-fixes-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply audited aliases and canonical IDs
        run: |
          set -euo pipefail
          # The temporary helper embeds a generated test file. Fix the two
          # nested triple-quote delimiters before executing the helper.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patch_epg_aliases_once.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "                '''<tv>\n",
              '                """<tv>\n',
              1,
          )
          text = text.replace(
              "                </tv>''',\n",
              '                </tv>""",\n',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
          python3 patch_epg_aliases_once.py
          git diff --check

      - name: Run full tests and strict build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Check current stable streams
        run: python3 healthcheck.py --no-previous

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build live merged EPG with explicit aliases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epg-builder
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git .epg-builder
          cd .epg-builder
          npm ci
          cd "$GITHUB_WORKSPACE"

          python3 epg_prepare.py \
            --playlist public/tv.m3u \
            --epg-root .epg-builder \
            --sites "mediaklikk.hu,horizon.tv" \
            --output .epg.channels.xml \
            --report .epg-iptv-coverage.json

          cd .epg-builder
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.epg-iptv.xml" \
            --maxConnections=3 \
            2>&1 | tee "$GITHUB_WORKSPACE/.epg-grab.log"
          cd "$GITHUB_WORKSPACE"

          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz \
            -o .epg-external.download

          python3 epg_merge.py \
            --playlist public/tv.m3u \
            --iptv-guide .epg-iptv.xml \
            --iptv-coverage .epg-iptv-coverage.json \
            --external .epg-external.download \
            --external-provider epgshare01.online \
            --preferred-iptv-provider mediaklikk.hu \
            --future-days 7 \
            --output public/guide.xml \
            --report public/epg-coverage.json

          python3 epg_health.py \
            --coverage public/epg-coverage.json \
            --guide public/guide.xml \
            --grab-log .epg-grab.log \
            --output public/epg-health.json

          python3 attention.py

      - name: Inspect improved coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('public/epg-coverage.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/epg-health.json').read_text(encoding='utf-8'))
          attention = json.loads(Path('public/attention.json').read_text(encoding='utf-8'))

          print('=== EPG COVERAGE ===')
          print(json.dumps({
              'playlist_tvg_ids': coverage.get('playlist_tvg_ids'),
              'matched_tvg_ids': coverage.get('matched_tvg_ids'),
              'mapping_coverage_percent': coverage.get('mapping_coverage_percent'),
              'unmatched_count': len(coverage.get('unmatched_tvg_ids') or []),
              'external': coverage.get('external'),
          }, indent=2, ensure_ascii=False))
          print('=== EPG HEALTH ===')
          print(json.dumps(health, indent=2, ensure_ascii=False))
          print('=== ATTENTION ===')
          print(json.dumps(attention.get('summary'), indent=2, ensure_ascii=False))
          print('=== EXPLICIT ALIAS MATCHES ===')
          for item in coverage.get('matched') or []:
              if item.get('match_type') == 'external_explicit_alias':
                  print(json.dumps(item, ensure_ascii=False))
          print('=== REMAINING UNMATCHED ===')
          for item in coverage.get('unmatched_tvg_ids') or []:
              print(item)

          if coverage.get('matched_tvg_ids', 0) < 60:
              raise SystemExit('Expected explicit aliases to improve mapped EPG coverage beyond 59 channels.')
          if health.get('channels_with_programmes', 0) < 57:
              raise SystemExit('Expected explicit aliases to improve actual programme coverage beyond 56 channels.')
          PY

      - name: Commit permanent fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg_merge.py epg_aliases.json extras/hu.m3u audit.json tests/test_epg_aliases.py
          git commit -m "Improve Hungarian EPG identity coverage"
          git push
