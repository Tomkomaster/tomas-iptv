name: Apply stream health and audit follow-up

on:
  push:
    branches:
      - agent/generalize-country-language-external-epg

permissions:
  contents: write

concurrency:
  group: followup-health-audit-apply
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/generalize-country-language-external-epg

      - name: Apply deterministic follow-up patch
        run: python3 .github/followup_health_audit_patch.py

      - name: Compile changed Python modules
        run: python3 -m py_compile health_policy.py healthcheck.py migrate_audit.py

      - name: Run unit tests before bulk audit modernization
        run: python3 -m unittest discover -s tests -v

      - name: Run strict build and verify Nicktoons warning is gone
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --strict 2>&1 | tee /tmp/strict-before-modernize.log
          if grep -F "Nicktoons" /tmp/strict-before-modernize.log | grep -F "saved audit belongs"; then
            echo "ERROR: stale Nicktoons country-scope warning still exists." >&2
            exit 1
          fi

      - name: Modernize audit country and spoken-language metadata
        run: |
          python3 migrate_audit.py \
            --audit audit.json \
            --current public/audit.csv \
            --config config.json \
            --modernize-only \
            --write

      - name: Re-run tests after audit modernization
        run: python3 -m unittest discover -s tests -v

      - name: Re-run strict build against modernized audit
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --strict 2>&1 | tee /tmp/strict-after-modernize.log
          if grep -F "Nicktoons" /tmp/strict-after-modernize.log | grep -F "saved audit belongs"; then
            echo "ERROR: Nicktoons warning returned after bulk modernization." >&2
            exit 1
          fi

      - name: Check patch formatting
        run: git diff --check

      - name: Commit validated follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            health_policy.py \
            health_policy.json \
            healthcheck.py \
            docs/health-policy.md \
            migrate_audit.py \
            audit.json \
            tests/test_health_audit_followup.py
          git commit -m "Handle TV-only health exceptions and modernize audit metadata"
          git push origin HEAD:agent/generalize-country-language-external-epg
