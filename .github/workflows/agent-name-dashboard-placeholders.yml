name: Name dashboard template placeholders

on:
  push:
    branches:
      - agent/dashboard-presentation-extraction

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rename mechanical template tokens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          names = [
              "TITLE",
              "GENERATED",
              "EPG_LINKS",
              "TOTAL_CHANNELS",
              "TOTAL_STREAMS",
              "ADDED_FROM_NONBASE",
              "TOTAL_ALTERNATIVES",
              "TOTAL_DUPLICATES",
              "AUDIT_WARNINGS",
              "AUDIT_CURRENT_COUNT",
              "AUDIT_BOTH_TESTED",
              "AUDIT_VLC_PENDING",
              "AUDIT_SAMSUNG_PENDING",
              "AUDIT_VERIFIED",
              "AUDIT_TV_VERIFIED",
              "AUDIT_PC_ONLY",
              "AUDIT_REVIEW",
              "AUDIT_CROSS_LANGUAGE",
              "AUDIT_REJECTED",
              "AUDIT_TABLE_ROWS",
              "LANGUAGE_ROWS",
              "SOURCE_ROWS",
              "CHANGE_HTML",
              "SOURCE_OPTIONS",
              "CHANNEL_ROWS",
          ]

          template = Path("templates/dashboard.html")
          text = template.read_text(encoding="utf-8")
          for index, name in enumerate(names):
              text = text.replace(f"@@V{index:03d}@@", f"@@{name}@@")
          template.write_text(text, encoding="utf-8")

          renderer = Path("dashboard.py")
          text = renderer.read_text(encoding="utf-8")
          for index, name in enumerate(names):
              text = text.replace(f'"V{index:03d}":', f'"{name}":')
          text = text.replace(
              '    if "@@V" in rendered:\n'
              '        raise RuntimeError("Dashboard template still contains an unresolved value token.")\n',
              '    if any(f"@@{key}@@" in rendered for key in context):\n'
              '        raise RuntimeError("Dashboard template still contains an unresolved value token.")\n',
          )
          renderer.write_text(text, encoding="utf-8")
          PY

      - name: Validate refactor
        run: |
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          git diff --check
          grep -q '@@TITLE@@' templates/dashboard.html
          grep -q '@@AUDIT_TABLE_ROWS@@' templates/dashboard.html
          ! grep -q '@@V[0-9]' templates/dashboard.html

      - name: Commit semantic placeholders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py templates/dashboard.html
          git commit -m "Name dashboard template placeholders"
          git push
