name: One-time clean PR 4 sync

on:
  push:
    branches:
      - agent/audit-epg-health

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove generated files and minimize audit diff
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Restore today's main audit byte-for-byte, then add only the three
          # exact DTV identity fields proven by PR #4's earlier migration.
          git checkout origin/main -- audit.json

          python3 - <<'PY'
          from pathlib import Path

          path = Path('audit.json')
          text = path.read_text(encoding='utf-8')

          marker = '''    {
      "channel": "DTV",
      "vlc": "works",
      "samsung": "works",
      "vlc_note": "ok",
      "samsung_note": "ok",
      "language": "Hungarian",
      "decision": "auto",
      "exclude_from_playlist": false,
      "notes": "Passed both manual playback tests. IPTV-org currently marks at least one source Not 24/7; re-test while the station is scheduled to broadcast.",
      "tested_on": "2026-08-09",
      "language_code": "HU",
      "provenance": "IPTV-org source (manual playback review)",
      "discovery": "Current IPTV-org Hungary playlist/manual test"
    },'''

          replacement = '''    {
      "channel": "DTV",
      "vlc": "works",
      "samsung": "works",
      "vlc_note": "ok",
      "samsung_note": "ok",
      "language": "Hungarian",
      "decision": "auto",
      "exclude_from_playlist": false,
      "notes": "Passed both manual playback tests. IPTV-org currently marks at least one source Not 24/7; re-test while the station is scheduled to broadcast.",
      "tested_on": "2026-08-09",
      "language_code": "HU",
      "provenance": "IPTV-org source (manual playback review)",
      "discovery": "Current IPTV-org Hungary playlist/manual test",
      "stream_url": "http://cloudfront44.lexanetwork.com:1732/hlsrelay003/hls/livestream.sdp.m3u8",
      "tvg_id": "DTV.hu@SD",
      "protocol": "HLS"
    },'''

          if text.count(marker) != 1:
              raise SystemExit(
                  f'Expected one exact legacy DTV block in main audit; found {text.count(marker)}.'
              )

          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

          git add audit.json

          # Unit-test execution in the previous one-time sync accidentally
          # staged Python bytecode. Remove it from the branch completely.
          git rm -r --ignore-unmatch __pycache__ tests/__pycache__

          git diff --check

          # Verify the cleaned audit still passes strict validation against
          # current live HU/SK sources before pushing it.
          python3 build.py --strict

          # Do not stage anything created by validation.
          rm -rf __pycache__ tests/__pycache__ public
          git reset -- public 2>/dev/null || true

          git add audit.json
          git add -u __pycache__ tests/__pycache__ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi

          git commit -m "Clean PR #4 sync artifacts and minimize audit diff"
          git push origin HEAD:agent/audit-epg-health
