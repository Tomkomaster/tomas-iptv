name: One-time clean PR 4 sync

on:
  push:
    branches:
      - agent/audit-epg-health

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clean synchronized branch
        run: python3 cleanup_pr4_sync.py
