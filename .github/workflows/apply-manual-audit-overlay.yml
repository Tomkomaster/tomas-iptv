name: Apply manual audit overlay

on:
  push:
    branches:
      - agent/manual-audit-132-channels
    paths:
      - .manual-audit-overlay.json
      - .manual-audit-source-fixes.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply manual audit records and source fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path('audit.json')
          overlay_path = Path('.manual-audit-overlay.json')

          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))
          channels = audit.setdefault('channels', [])

          by_stream = {
              str(item.get('stream_url', '')).strip(): item
              for item in channels
              if str(item.get('stream_url', '')).strip()
          }

          for incoming in overlay.get('channels', []):
              stream_url = str(incoming.get('stream_url', '')).strip()
              target = by_stream.get(stream_url) if stream_url else None

              if target is None:
                  target = dict(incoming)
                  channels.append(target)
                  if stream_url:
                      by_stream[stream_url] = target
              else:
                  target.update(incoming)

          audit_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          fixes_path = Path('.manual-audit-source-fixes.json')
          if fixes_path.is_file():
              fixes = json.loads(fixes_path.read_text(encoding='utf-8'))
              for item in fixes.get('m3u_entries', []):
                  path = Path(str(item['path']))
                  url = str(item['url']).strip()
                  text = path.read_text(encoding='utf-8')
                  if url in text:
                      continue

                  block = '\n'.join([
                      '',
                      str(item.get('comment') or '').strip(),
                      str(item['extinf']).strip(),
                      url,
                      '',
                  ])
                  if not text.endswith('\n'):
                      text += '\n'
                  path.write_text(text + block, encoding='utf-8')
          PY

      - name: Validate and commit changes
        shell: bash
        run: |
          python -m json.tool audit.json > /dev/null
          if git diff --quiet -- audit.json extras/hu.m3u; then
            echo "Audit and retained test candidates already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json extras/hu.m3u
          git commit -m "Apply manual IPTV audit batch"
          git push
