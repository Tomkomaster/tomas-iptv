name: One-time minimal audit diff cleanup

on:
  push:
    branches:
      - "agent/migrate-safe-legacy-audits"
    paths:
      - ".github/workflows/minimize-audit-diff-once.yml"

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/migrate-safe-legacy-audits
          fetch-depth: 0

      - name: Rebuild migrated audit from original text
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("audit.json")
          target_payload = json.loads(path.read_text(encoding="utf-8"))
          target_items = target_payload.get("channels")
          if not isinstance(target_items, list):
              raise SystemExit("Target audit does not contain a channels list.")

          base_text = subprocess.check_output(
              ["git", "show", "origin/main:audit.json"],
              text=True,
              encoding="utf-8",
          )
          base_payload = json.loads(base_text)
          base_items = base_payload.get("channels")
          if not isinstance(base_items, list):
              raise SystemExit("Main audit does not contain a channels list.")

          marker_at = base_text.find('"channels"')
          colon_at = base_text.find(":", marker_at)
          array_start = base_text.find("[", colon_at)
          if marker_at < 0 or colon_at < 0 or array_start < 0:
              raise SystemExit("Could not locate channels array in main audit text.")

          decoder = json.JSONDecoder()
          raw_items = []
          pos = array_start + 1
          while True:
              while pos < len(base_text) and base_text[pos].isspace():
                  pos += 1
              if pos >= len(base_text):
                  raise SystemExit("Unexpected EOF while parsing channels array.")
              if base_text[pos] == "]":
                  array_end = pos
                  break
              parsed, end = decoder.raw_decode(base_text, pos)
              if not isinstance(parsed, dict):
                  raise SystemExit(f"Expected audit object at character {pos}.")
              raw_items.append(base_text[pos:end])
              pos = end
              while pos < len(base_text) and base_text[pos].isspace():
                  pos += 1
              if pos < len(base_text) and base_text[pos] == ",":
                  pos += 1
                  continue
              if pos < len(base_text) and base_text[pos] == "]":
                  array_end = pos
                  break
              raise SystemExit(f"Unexpected token after audit object at character {pos}.")

          if len(raw_items) != len(base_items):
              raise SystemExit(
                  f"Parsed {len(raw_items)} raw objects but JSON has {len(base_items)} rows."
              )

          allowed = ("stream_url", "tvg_id", "protocol")
          allowed_set = set(allowed)

          def relation(base, target):
              if not isinstance(base, dict) or not isinstance(target, dict):
                  return None
              if set(base) - set(target):
                  return None
              if (set(target) - set(base)) - allowed_set:
                  return None

              changes = {}
              for key, value in base.items():
                  target_value = target[key]
                  if target_value == value:
                      continue
                  if key not in allowed_set or value not in ("", None):
                      return None
                  changes[key] = target_value

              for key in set(target) - set(base):
                  changes[key] = target[key]
              return changes

          def rewrite_raw(raw, base, target, changes):
              if not changes:
                  return raw

              lines = raw.splitlines()
              for key in allowed:
                  if key not in changes or key not in base:
                      continue
                  matches = [
                      index for index, line in enumerate(lines)
                      if line.lstrip().startswith(f'"{key}":')
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"Expected exactly one existing {key} line; found {len(matches)}."
                      )
                  index = matches[0]
                  old_line = lines[index]
                  indent = old_line[: len(old_line) - len(old_line.lstrip())]
                  comma = "," if old_line.rstrip().endswith(",") else ""
                  lines[index] = (
                      f'{indent}"{key}": '
                      + json.dumps(target[key], ensure_ascii=False)
                      + comma
                  )

              raw = "\n".join(lines)
              additions = [
                  key for key in allowed
                  if key in changes and key not in base
              ]
              if not additions:
                  return raw

              newline = raw.rfind("\n")
              if newline < 0 or raw[newline + 1 :].strip() != "}":
                  raise SystemExit("Unexpected audit object formatting; refusing rewrite.")
              body = raw[:newline] + ","
              closing = raw[newline:]
              for position, key in enumerate(additions):
                  comma = "," if position < len(additions) - 1 else ""
                  body += (
                      f'\n      "{key}": '
                      + json.dumps(target[key], ensure_ascii=False)
                      + comma
                  )
              return body + closing

          rebuilt_raw = []
          target_index = 0
          migrated = 0
          removed = 0
          unchanged = 0

          for base_index, (base_item, raw) in enumerate(
              zip(base_items, raw_items), start=1
          ):
              changes = None
              if target_index < len(target_items):
                  changes = relation(base_item, target_items[target_index])

              if changes is not None:
                  rebuilt_raw.append(
                      rewrite_raw(
                          raw,
                          base_item,
                          target_items[target_index],
                          changes,
                      )
                  )
                  if changes:
                      migrated += 1
                  else:
                      unchanged += 1
                  target_index += 1
                  continue

              removed += 1
              print(
                  "TEXT-PRESERVING REMOVE: "
                  f"#{base_index} {base_item.get('channel', '<unnamed>')}"
              )

          if target_index != len(target_items):
              raise SystemExit(
                  f"Alignment stopped at target row {target_index}/{len(target_items)}."
              )
          if migrated != 78 or removed != 6:
              raise SystemExit(
                  f"Expected 78 migrated and 6 removed rows, got "
                  f"{migrated} migrated and {removed} removed."
              )

          array_body = "\n    " + ",\n    ".join(rebuilt_raw) + "\n  "
          minimized_text = (
              base_text[: array_start + 1]
              + array_body
              + base_text[array_end:]
          )
          minimized_payload = json.loads(minimized_text)
          if minimized_payload != target_payload:
              raise SystemExit(
                  "Text-preserving audit does not exactly match validated migrated data."
              )

          print(
              f"Rebuilt audit with {migrated} exact migrations, "
              f"{removed} removals, {unchanged} unchanged rows."
          )
          path.write_text(minimized_text, encoding="utf-8")
          PY

      - name: Validate minimal migrated audit
        run: |
          set -euo pipefail
          python3 build.py --strict
          python3 -m unittest discover -s tests -v
          git diff --check -- audit.json
          git diff --stat origin/main -- audit.json

      - name: Commit minimal audit text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git commit -m "Minimize legacy audit migration diff"
          git push origin HEAD:agent/migrate-safe-legacy-audits
