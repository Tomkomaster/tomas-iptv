name: Agent priority logo identity validation

on:
  push:
    branches:
      - agent/p2-logo-canonical-scorecard

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply identity join fix
        run: python3 tools/_agent_fix_priority_logo_join.py
      - name: Run tests
        run: python3 run_tests.py
      - name: Check dashboard JavaScript
        run: node --check static/dashboard.js
      - name: Run real playlist build
        run: python3 -m tools.reliable_build --strict
      - name: Verify priority logo score
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('public/priority-coverage.json').read_text(encoding='utf-8'))
          summary = data['logo_summary']
          assert summary['stable_targets'] == 61, summary
          assert summary['with_logo'] == 61, summary
          assert summary['missing_logo'] == 0, summary
          assert summary['logo_availability_percent'] == 100.0, summary
          assert summary['canonical_logo'] >= 30, summary
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          for code, country in data['countries'].items():
              for priority, block in country['priorities'].items():
                  print(code, priority, json.dumps(block.get('logo_coverage') or {}, sort_keys=True))
          PY
      - name: Commit tested source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/priority_coverage.py tests/test_priority_coverage.py
          git rm tools/_agent_fix_priority_logo_join.py .github/workflows/agent-priority-logo-fix.yml .github/workflows/agent-priority-logo-diagnostic.yml
          git commit -m "Fix priority logo identity matching"
          git push origin HEAD:agent/p2-logo-canonical-scorecard
