name: Clean provider test channel names

on:
  push:
    branches:
      - agent/clean-provider-test-channel-names

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply cleanup
        run: python3 tools/agent_clean_provider_test_names_v3.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict playlist build
        run: python3 build.py --strict

      - name: Verify published names
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -Eqi 'ANTIK TEST|PANACCESS TEST|KABELKO TEST|REBIT TEST|STREAMLOCK TEST|JOJ CDN TEST|ZSTV DIRECT TEST|LEGACY TEST' public/tv.m3u public/sk.m3u; then
            echo 'Internal provider/research TEST label leaked into stable playlist output.'
            exit 1
          fi
          grep -Fq ',[SK] Televízia Turiec' public/tv.m3u
          grep -Fq ',[SK] Televízia ZEMPLÍN' public/tv.m3u
          grep -Fq ',[SK] TV Bratislava' public/tv.m3u
          grep -Fq ',[SK] TV Sen' public/tv.m3u

      - name: Commit permanent cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py extras/sk.m3u tests/test_provider_test_channel_names.py
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
            exit 0
          fi
          git commit -m "Clean provider test labels from channel names"
          git push
