name: Apply country-aware EPG update

on:
  push:
    branches:
      - agent/country-aware-epg

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply EPG changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/agent_country_epg_update.py')
          text = path.read_text(encoding='utf-8')
          old = 'if count != 2:\n    raise RuntimeError(f"workflow external config: expected 2 matches, found {count}")'
          new = 'if count != 3:\n    raise RuntimeError(f"workflow external config: expected 3 matches, found {count}")'
          if old not in text:
              raise SystemExit('Expected helper assumption was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/agent_country_epg_update.py

      - name: Validate code and data
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          from epg_policy import compile_epg_policy
          from health_policy import compile_health_policy

          compile_epg_policy(json.loads(Path('epg_policy.json').read_text(encoding='utf-8')))
          compile_health_policy(json.loads(Path('health_policy.json').read_text(encoding='utf-8')))
          print('EPG and health policies valid.')
          PY
          python3 build.py --strict

      - name: Verify generated playlist EPG IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('public/sk.m3u').read_text(encoding='utf-8')
          required = {
              'Dajto': 'MarkizaDajto.sk',
              'Doma': 'MarkizaDoma.sk',
              'Jojko': 'Jojko.sk',
              'LALA TV': 'LalaTV.sk',
              'Markíza Klasik': 'MarkizaKlasik.sk',
              'Markíza Krimi': 'MarkizaKrimi.sk',
          }
          for channel, tvg_id in required.items():
              if f'tvg-id="{tvg_id}"' not in text:
                  raise SystemExit(f'{channel}: expected {tvg_id} in stable SK playlist')
          print('Authoritative Slovak tvg-id fixes are present in the stable output.')
          PY

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/build-and-publish.yml .github/scripts/build-and-publish.country-aware.yml.txt
          git add \
            config.json \
            extras/sk.m3u \
            epg_policy.json \
            epg_policy.py \
            epg_health.py \
            build.py \
            .github/scripts/build-and-publish.country-aware.yml.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make EPG coverage country-aware"
          git push origin HEAD:agent/country-aware-epg
