name: Clean EPG policy diff

on:
  push:
    branches:
      - agent/country-aware-epg

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore compact policy formatting
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:epg_policy.json > epg_policy.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path('epg_policy.json')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  "schema_version": 1,', '  "schema_version": 2,', 1)
          marker = '  "default": "expected",\n'
          addition = '''  "default": "expected",\n  "country_defaults": {\n    "HU": "expected",\n    "SK": "expected",\n    "CZ": "expected"\n  },\n'''
          if marker not in text:
              raise SystemExit('EPG policy default marker not found')
          path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          from epg_policy import compile_epg_policy
          compile_epg_policy(json.loads(Path('epg_policy.json').read_text(encoding='utf-8')))
          print('Country-aware policy remains valid.')
          PY
          git diff --check
          git add epg_policy.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep EPG policy diff compact"
          git push origin HEAD:agent/country-aware-epg
