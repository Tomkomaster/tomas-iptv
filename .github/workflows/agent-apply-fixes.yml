name: Apply requested repository fixes

on:
  push:
    branches:
      - agent/fix-audit-identity-and-ci

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply requested fixes
        run: python3 .github/scripts/apply_requested_fixes.py

      - name: Stage and validate diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit source changes locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix audit identity safety and CI"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict production build
        run: python3 build.py --strict

      - name: Push validated commit
        run: git push origin HEAD:agent/fix-audit-identity-and-ci
