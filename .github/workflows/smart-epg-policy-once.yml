name: One-time smart EPG attention policy

on:
  push:
    branches:
      - "agent/smart-epg-attention-policy"
    paths:
      - ".github/workflows/smart-epg-policy-once.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v7
        with:
          ref: agent/smart-epg-attention-policy
          fetch-depth: 0

      - name: Patch attention policy support
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("attention.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}.")
              text = text.replace(old, new, 1)

          replace_once(
              "from healthcheck import canonical_stream_url\n",
              "from healthcheck import canonical_stream_url\n"
              "from epg_policy import compile_epg_policy, resolve_epg_policy\n",
              "policy import",
          )

          replace_once(
              '        "epg_status": "Unknown",\n        "signals": [],\n',
              '        "epg_status": "Unknown",\n'
              '        "epg_policy": "unknown",\n'
              '        "epg_policy_reason": "",\n'
              '        "epg_policy_match": "",\n'
              '        "signals": [],\n',
              "base item policy fields",
          )

          replace_once(
              "    epg_health: dict | None = None,\n"
              "    config: dict | None = None,\n",
              "    epg_health: dict | None = None,\n"
              "    epg_policy: dict | None = None,\n"
              "    config: dict | None = None,\n",
              "build_attention signature",
          )

          replace_once(
              "    epg_health = epg_health or {}\n"
              "    config = config or {}\n",
              "    epg_health = epg_health or {}\n"
              "    epg_policy = epg_policy or {}\n"
              "    config = config or {}\n\n"
              "    epg_policy_default, epg_policy_indexes = compile_epg_policy(epg_policy)\n",
              "policy initialization",
          )

          start_marker = "    # 3) EPG gaps for current stable streams.\n"
          end_marker = "    # 4) Previously TV-safe verified URLs that no longer exist in any current\n"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Could not locate EPG attention block boundaries.")

          new_epg_block = '''    # 3) EPG gaps for current stable streams. The policy layer keeps\n    # genuinely actionable guide gaps in this queue while allowing local,\n    # web, event, and other schedule-light channels to opt out explicitly.\n    matched_ids = {\n        str(entry.get("tvg_id") or "").strip()\n        for entry in (epg_coverage.get("matched") or [])\n        if isinstance(entry, dict) and str(entry.get("tvg_id") or "").strip()\n    }\n    unmatched_ids = {\n        str(value).strip()\n        for value in (epg_coverage.get("unmatched_tvg_ids") or [])\n        if str(value).strip()\n    }\n    mapped_empty = {\n        str(entry.get("tvg_id") or "").strip(): str(entry.get("provider") or "").strip()\n        for entry in (epg_health.get("mapped_without_programmes") or [])\n        if isinstance(entry, dict) and str(entry.get("tvg_id") or "").strip()\n    }\n\n    epg_policy_counts = Counter()\n    epg_suppressed_gap_counts = Counter()\n\n    def apply_epg_policy(item: dict, policy: dict) -> None:\n        item["epg_policy"] = str(policy.get("status") or "expected")\n        item["epg_policy_reason"] = str(policy.get("reason") or "")\n        item["epg_policy_match"] = str(policy.get("matched_by") or "default")\n\n    for row in stable_rows:\n        policy = resolve_epg_policy(\n            row,\n            default=epg_policy_default,\n            indexes=epg_policy_indexes,\n        )\n        policy_status = str(policy.get("status") or epg_policy_default)\n        epg_policy_counts[policy_status] += 1\n\n        tvg_id = str(row.get("tvg_id") or "").strip()\n        row_key = item_key(\n            stream_url=str(row.get("stream_url") or ""),\n            tvg_id=tvg_id,\n            channel=str(row.get("channel") or ""),\n        )\n        existing_item = items.get(row_key)\n        if existing_item is not None:\n            apply_epg_policy(existing_item, policy)\n\n        category = ""\n        severity = "low"\n        priority = 0\n        label = ""\n        detail = ""\n        action = ""\n        gap_status = ""\n\n        if not tvg_id:\n            category = "epg_missing_id"\n            severity = "low"\n            priority = 30\n            label = CATEGORY_LABELS[category]\n            gap_status = "No tvg-id"\n            detail = (\n                "The stable stream has no tvg-id, so it cannot be matched to "\n                "the generated XMLTV guide."\n            )\n            action = "Find the correct channel tvg-id and add it to the source/extra entry."\n        elif tvg_id in mapped_empty:\n            provider = mapped_empty[tvg_id] or "selected EPG provider"\n            category = "epg_mapped_empty"\n            severity = "medium"\n            priority = 45\n            label = CATEGORY_LABELS[category]\n            gap_status = "Mapped, no programmes"\n            detail = (\n                f"{tvg_id} maps to {provider}, but no current/future programme "\n                "entries were produced."\n            )\n            action = "Check the provider mapping/data or add a working EPG fallback for this channel."\n        elif tvg_id in unmatched_ids:\n            category = "epg_unmapped"\n            severity = "low"\n            priority = 35\n            label = CATEGORY_LABELS[category]\n            gap_status = "Unmapped"\n            detail = f"No EPG source currently maps playlist id {tvg_id}."\n            action = "Find an exact deterministic EPG mapping or provider for this channel."\n        elif tvg_id in matched_ids:\n            if existing_item is not None:\n                existing_item["epg_status"] = "Programme data"\n            continue\n        else:\n            continue\n\n        if policy_status != "expected":\n            epg_suppressed_gap_counts[policy_status] += 1\n            if existing_item is not None:\n                if policy_status == "not_expected":\n                    existing_item["epg_status"] = "Not expected"\n                else:\n                    existing_item["epg_status"] = f"Optional: {gap_status}"\n            continue\n\n        item = get_item(row)\n        apply_epg_policy(item, policy)\n        item["epg_status"] = gap_status\n        add_signal(item, {\n            "category": category,\n            "severity": severity,\n            "priority": priority,\n            "label": label,\n            "detail": detail,\n            "action": action,\n        })\n\n'''
          text = text[:start] + new_epg_block + text[end:]

          replace_once(
              '        "schema_version": 1,\n',
              '        "schema_version": 2,\n',
              "attention schema version",
          )

          replace_once(
              '            "manual_very_stale_days": very_stale_days,\n',
              '            "manual_very_stale_days": very_stale_days,\n'
              '            "epg_policy_default": epg_policy_default,\n',
              "settings policy default",
          )

          replace_once(
              '            "category_counts": dict(sorted(category_counts.items())),\n',
              '            "category_counts": dict(sorted(category_counts.items())),\n'
              '            "epg_policy_counts": {\n'
              '                status: epg_policy_counts.get(status, 0)\n'
              '                for status in ("expected", "optional", "not_expected")\n'
              '            },\n'
              '            "epg_suppressed_gaps": sum(epg_suppressed_gap_counts.values()),\n'
              '            "epg_suppressed_gap_counts": {\n'
              '                status: epg_suppressed_gap_counts.get(status, 0)\n'
              '                for status in ("optional", "not_expected")\n'
              '            },\n',
              "summary policy counters",
          )

          replace_once(
              '    parser.add_argument("--epg-health", type=Path, default=Path("public/epg-health.json"))\n'
              '    parser.add_argument("--config", type=Path, default=Path("config.json"))\n',
              '    parser.add_argument("--epg-health", type=Path, default=Path("public/epg-health.json"))\n'
              '    parser.add_argument("--epg-policy", type=Path, default=Path("epg_policy.json"))\n'
              '    parser.add_argument("--config", type=Path, default=Path("config.json"))\n',
              "CLI policy argument",
          )

          replace_once(
              "        epg_health=load_json(args.epg_health),\n"
              "        config=load_json(args.config),\n",
              "        epg_health=load_json(args.epg_health),\n"
              "        epg_policy=load_json(args.epg_policy),\n"
              "        config=load_json(args.config),\n",
              "CLI policy loading",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run tests and strict build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          git diff --check

      - name: Validate against deployed production inputs
        run: |
          set -euo pipefail
          base="https://tomkomaster.github.io/tomas-iptv"
          for file in report health epg-coverage epg-health attention; do
            curl -fsS "$base/$file.json" -o "/tmp/$file.json"
          done
          python3 attention.py \
            --report /tmp/report.json \
            --health /tmp/health.json \
            --epg-coverage /tmp/epg-coverage.json \
            --epg-health /tmp/epg-health.json \
            --epg-policy epg_policy.json \
            --config config.json \
            --output /tmp/attention-new.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          from epg_policy import compile_epg_policy, resolve_epg_policy
          from healthcheck import canonical_stream_url

          old = json.loads(Path("/tmp/attention.json").read_text(encoding="utf-8"))
          new = json.loads(Path("/tmp/attention-new.json").read_text(encoding="utf-8"))
          report = json.loads(Path("/tmp/report.json").read_text(encoding="utf-8"))
          policy_payload = json.loads(Path("epg_policy.json").read_text(encoding="utf-8"))
          default, indexes = compile_epg_policy(policy_payload)

          def key(item):
              url = str(item.get("stream_url") or "").strip()
              if url:
                  return "url:" + canonical_stream_url(url)
              tvg_id = str(item.get("tvg_id") or "").strip()
              if tvg_id:
                  return "id:" + tvg_id.casefold()
              return "name:" + str(item.get("channel") or "").strip().casefold()

          old_non_epg = {
              (key(item), signal["category"])
              for item in old.get("items", [])
              for signal in item.get("signals", [])
              if not str(signal.get("category") or "").startswith("epg_")
          }
          new_signals = {
              (key(item), signal["category"])
              for item in new.get("items", [])
              for signal in item.get("signals", [])
          }
          missing_non_epg = old_non_epg - new_signals
          if missing_non_epg:
              raise SystemExit(f"Policy hid non-EPG attention signals: {sorted(missing_non_epg)}")

          stable_rows = [
              row for row in ((report.get("audit") or {}).get("channels") or [])
              if isinstance(row, dict) and bool(row.get("in_stable_playlist"))
          ]
          stable_lookup = {key(row): row for row in stable_rows}
          for item in old.get("items", []):
              row = stable_lookup.get(key(item))
              if not row:
                  continue
              resolved = resolve_epg_policy(row, default=default, indexes=indexes)
              if resolved["status"] != "expected":
                  continue
              for signal in item.get("signals", []):
                  category = str(signal.get("category") or "")
                  if category.startswith("epg_") and (key(item), category) not in new_signals:
                      raise SystemExit(
                          f"Expected EPG signal disappeared: {item.get('channel')} {category}"
                      )

          summary = new["summary"]
          if summary["items"] >= old["summary"]["items"]:
              raise SystemExit("EPG policy did not reduce Needs Attention noise.")
          if summary["epg_suppressed_gaps"] < 60:
              raise SystemExit(
                  f"Expected at least 60 policy-suppressed EPG gaps; got {summary['epg_suppressed_gaps']}."
              )
          if sum(summary["epg_policy_counts"].values()) != len(stable_rows):
              raise SystemExit("EPG policy counts do not cover every stable stream.")
          if summary["epg_policy_counts"]["optional"] < 50:
              raise SystemExit("Initial optional policy did not match the intended local/regional set.")
          if summary["epg_policy_counts"]["not_expected"] < 10:
              raise SystemExit("Initial not_expected policy did not match the intended live/web set.")

          print("Old attention summary:", old["summary"])
          print("New attention summary:", new["summary"])
          PY

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attention.py
          if git diff --cached --quiet; then
            echo "No attention.py changes to commit."
            exit 0
          fi
          git commit -m "Apply EPG policy to attention queue"
          git push origin HEAD:agent/smart-epg-attention-policy
