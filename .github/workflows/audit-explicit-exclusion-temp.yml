name: Temporary audit exclusion reconciliation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-explicit-exclusion-2026-08-22
          fetch-depth: 0

      - name: Finalize explicit exclusion decisions
        run: PYTHONPATH=. python3 tools/_audit_exclusion_finalize_temp.py

      - name: Commit finalized audit decisions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json iptv/audit.py tests/test_audit_storage.py audit_exclusion_reconciliation_report.json
          git commit -m "Complete explicit audit exclusion decisions"
          git push origin HEAD:audit-explicit-exclusion-2026-08-22
