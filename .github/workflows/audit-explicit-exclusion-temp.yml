name: Temporary audit exclusion reconciliation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-explicit-exclusion-2026-08-22
          fetch-depth: 0

      - name: Fill decisive audit exclusion booleans
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          from iptv.audit import calculate_audit_decision, normalize_audit_decision_token
          from iptv.playback_status import normalize_test_status

          path = Path('audit.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          rows = payload['channels']
          cfg = json.loads(Path('config.json').read_text(encoding='utf-8'))
          supported_languages = list((cfg.get('language_outputs') or {}).keys())

          changed = []
          unresolved = []
          already_true = 0
          already_false = 0

          for index, row in enumerate(rows, start=1):
              existing = row.get('exclude_from_playlist', None)
              if existing is True:
                  already_true += 1
                  continue
              if existing is False:
                  already_false += 1
                  continue

              token = normalize_audit_decision_token(str(row.get('decision') or 'auto'))
              label, derived_reason = calculate_audit_decision(row, supported_languages)
              samsung = normalize_test_status(str(row.get('samsung') or ''))

              value = None
              basis = None

              # Explicit manual decisions are strongest.
              if token == 'rejected':
                  value = True
                  basis = 'explicit decision=rejected'
              elif token in {'verified', 'tv_verified'}:
                  value = False
                  basis = f'explicit decision={token}'
              elif token in {'pc_only', 'needs_review'}:
                  # Keep explicit review/PC-only states untouched: adding true to an
                  # explicit pc_only row is a schema conflict, and needs_review is
                  # intentionally non-decisive.
                  value = None
              elif label in {'Verified', 'TV verified'}:
                  value = False
                  basis = f'derived {label}'
              elif label == 'Rejected':
                  value = True
                  basis = 'derived Rejected'
              elif label == 'PC only':
                  # Shared playlist requires Samsung-safe playback. An automatically
                  # derived PC-only feed is therefore decisively excluded.
                  value = True
                  basis = 'derived PC only / Samsung unsafe'
              elif label == 'Needs review' and samsung in {'format_error', 'generic_error', 'loads'}:
                  # Even when the overall row still needs review, these are decisive
                  # Samsung failures for the exact tested feed.
                  value = True
                  basis = f'decisive Samsung failure: {samsung}'

              if value is None:
                  unresolved.append({
                      'index': index,
                      'channel': row.get('channel'),
                      'stream_url': row.get('stream_url'),
                      'decision': row.get('decision'),
                      'derived_decision': label,
                      'vlc': row.get('vlc'),
                      'samsung': row.get('samsung'),
                      'language_match': row.get('language_match'),
                  })
                  continue

              row['exclude_from_playlist'] = value
              changed.append({
                  'index': index,
                  'channel': row.get('channel'),
                  'stream_url': row.get('stream_url'),
                  'value': value,
                  'basis': basis,
              })

          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          report = {
              'total_rows': len(rows),
              'already_true': already_true,
              'already_false': already_false,
              'filled_count': len(changed),
              'filled_true': sum(1 for x in changed if x['value'] is True),
              'filled_false': sum(1 for x in changed if x['value'] is False),
              'unresolved_count': len(unresolved),
              'changed': changed,
              'unresolved': unresolved,
          }
          Path('audit_exclusion_reconciliation_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({k: v for k, v in report.items() if k not in {'changed', 'unresolved'}}, ensure_ascii=False, indent=2))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json audit_exclusion_reconciliation_report.json
          git commit -m "Record explicit audit exclusion decisions"
          git push origin HEAD:audit-explicit-exclusion-2026-08-22
