name: Apply cross-language channel policy

on:
  push:
    branches:
      - agent/support-cross-language-channels

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decode and inspect migration section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path(
              ".github/scripts/apply_cross_language.py.gz.b64"
          ).read_text(encoding="utf-8").strip()
          source = gzip.decompress(base64.b64decode(encoded))
          Path("/tmp/apply_cross_language.py").write_bytes(source)
          PY
          nl -ba /tmp/apply_cross_language.py | sed -n '440,530p'
          exit 1
