name: One-time inspect tvmusor.hu API

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/inspect-tvmusor-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compare live tvmusor channel IDs
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'

          curl -fsS 'https://tvmusor.borsonline.hu/most/' -A "$UA" -o /tmp/page.html
          curl -fsS 'https://raw.githubusercontent.com/iptv-org/epg/master/sites/tvmusor.hu/tvmusor.hu.channels.xml' -o /tmp/channels.xml

          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          html = Path('/tmp/page.html').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'const CHANNEL_DATA = (.*);', html)
          if not match:
              raise SystemExit('CHANNEL_DATA not found')
          raw = match.group(1).replace('},}', '}}')
          raw = re.sub(r'(\d+):', r'"\1":', raw)
          live = json.loads(raw)
          live_by_name = {str(v.get('name','')).strip(): str(v.get('id','')) for v in live.values()}

          root = ET.parse('/tmp/channels.xml').getroot()
          static = []
          for ch in root.findall('channel'):
              name = (ch.text or '').strip()
              static.append((name, ch.get('site_id',''), ch.get('xmltv_id','')))

          changed = []
          missing = []
          for name, old_id, xmltv_id in static:
              new_id = live_by_name.get(name)
              if new_id is None:
                  missing.append((name, old_id, xmltv_id))
              elif str(new_id) != str(old_id):
                  changed.append((name, old_id, str(new_id), xmltv_id))

          print('live channels:', len(live_by_name))
          print('static channels:', len(static))
          print('changed IDs:', len(changed))
          for row in changed:
              print('CHANGED', *row, sep=' | ')
          print('missing names:', len(missing))
          for row in missing:
              print('MISSING', *row, sep=' | ')

          for target in ('TV2', 'RTL', 'Sport1', 'Nickelodeon', 'National Geographic'):
              print('LIVE', target, live_by_name.get(target))
          PY
