name: One-time inspect tvmusor.hu API

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/inspect-tvmusor-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Trace tvmusor request construction
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36'

          curl -fsS 'https://tvmusor.borsonline.hu/most/' -A "$UA" -o /tmp/page.html
          curl -fsS 'https://tvmusor.borsonline.hu/js/tv.js?v=1786090144' -A "$UA" -o /tmp/tv.js
          curl -fsS 'https://tvmusor.borsonline.hu/js/events.js?v=1786090144' -A "$UA" -o /tmp/events.js

          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/tv.js').read_text(encoding='utf-8', errors='replace') + '\n' + Path('/tmp/events.js').read_text(encoding='utf-8', errors='replace')
          for needle in ('const ajax', 'function ajax', 'ajax =', 'JSON.stringify', 'requiredBlocks.push', "+'|'", ' + "|" + ', 'getDayByTime'):
              print(f'=== {needle} ===')
              pos = 0
              hits = 0
              while hits < 12:
                  pos = text.find(needle, pos)
                  if pos < 0:
                      break
                  print(text[max(0,pos-900):min(len(text),pos+1800)].replace('\n',' ')[:2700])
                  print()
                  pos += len(needle)
                  hits += 1
              print('hits:', hits)
          PY
