name: One-time patch EPG quality variants

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/inspect-tvmusor-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve explicit SD/HD external ties
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('epg_merge.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if len(best) != 1:\n            ambiguous.append({\n                "tvg_id": target,\n                "candidates": best,\n            })\n            continue\n\n        item = best[0]\n'''
          new = '''        if len(best) != 1:\n            # When the playlist explicitly asks for @SD or @HD and the\n            # external guide contains otherwise-identical HD/non-HD entries,\n            # resolve only that declared quality variant. This is not fuzzy\n            # matching: all candidates already matched the same channel name.\n            variant = re.search(\n                r"@(SD|HD)(?:$|@)",\n                target,\n                re.IGNORECASE,\n            )\n            if variant:\n                wants_hd = (\n                    variant.group(1).upper() == "HD"\n                )\n                quality_matches = [\n                    candidate\n                    for candidate in best\n                    if bool(\n                        re.search(\n                            r"(?:^|[._-])HD(?:[._-]|$)",\n                            candidate["external_id"],\n                            re.IGNORECASE,\n                        )\n                    ) == wants_hd\n                ]\n                if len(quality_matches) == 1:\n                    best = quality_matches\n\n        if len(best) != 1:\n            ambiguous.append({\n                "tvg_id": target,\n                "candidates": best,\n            })\n            continue\n\n        item = best[0]\n'''
          if old not in text:
              raise SystemExit('Target epg_merge.py block not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- epg_merge.py

      - name: Run tests and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg_merge.py
          git commit -m "Resolve explicit EPG SD HD variants"
          git push
