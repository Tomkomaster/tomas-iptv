name: One-time run final unit tests

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/inspect-tvmusor-once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run all tests
        run: python3 -m unittest discover -s tests -v
      - name: Strict build
        run: python3 build.py --strict
