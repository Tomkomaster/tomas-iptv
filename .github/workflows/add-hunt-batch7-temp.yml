name: Temporary add hunt batch 7

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-four-failures-2026-08-23
          fetch-depth: 0

      - name: Append fresh Hungarian candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              (
                  'http://88.212.15.50/live/test_hbo_hd_hevc/playlist.m3u8',
                  '# HBO — current 88.212.15.50 HEVC candidate\n# Source playlist updated 2026-08-07; same host family has produced multiple dual-device winners.\n# Verify PC + Samsung playback and Hungarian audio availability.\n#EXTINF:-1 tvg-name="HBO",HBO [TEST] [88.212.15.50 HEVC]\nhttp://88.212.15.50/live/test_hbo_hd_hevc/playlist.m3u8\n'
              ),
              (
                  'http://88.212.15.50/live/test_cartoon_network_tizen/playlist.m3u8',
                  '# Cartoon Network — current 88.212.15.50 Tizen candidate\n# Source playlist updated 2026-08-07; verify PC + Samsung playback and Hungarian audio availability.\n#EXTINF:-1 tvg-name="Cartoon Network",Cartoon Network [TEST] [88.212.15.50 Tizen]\nhttp://88.212.15.50/live/test_cartoon_network_tizen/playlist.m3u8\n'
              ),
              (
                  'http://88.212.15.50/live/test_discovery_hd_hevc/playlist.m3u8',
                  '# Discovery Channel — current 88.212.15.50 HEVC candidate\n# Source playlist updated 2026-08-07; verify PC + Samsung playback and Hungarian audio availability.\n#EXTINF:-1 tvg-name="Discovery Channel",Discovery Channel [TEST] [88.212.15.50 HEVC]\nhttp://88.212.15.50/live/test_discovery_hd_hevc/playlist.m3u8\n'
              ),
              (
                  'http://88.212.15.50/live/test_tlc_1200_atk/playlist.m3u8',
                  '# TLC — current 88.212.15.50 candidate\n# Source playlist updated 2026-08-07; verify PC + Samsung playback and Hungarian audio availability.\n#EXTINF:-1 tvg-name="TLC",TLC [TEST] [88.212.15.50]\nhttp://88.212.15.50/live/test_tlc_1200_atk/playlist.m3u8\n'
              ),
              (
                  'http://88.212.15.50/live/test_animal_planet_hd_hevc/playlist.m3u8',
                  '# Animal Planet — current 88.212.15.50 HEVC candidate\n# Source playlist updated 2026-08-07; verify PC + Samsung playback and Hungarian audio availability.\n#EXTINF:-1 tvg-name="Animal Planet",Animal Planet [TEST] [88.212.15.50 HEVC]\nhttp://88.212.15.50/live/test_animal_planet_hd_hevc/playlist.m3u8\n'
              ),
          ]

          audit = Path('audit.json').read_text(encoding='utf-8')
          path = Path('extras/hu.m3u')
          text = path.read_text(encoding='utf-8')
          blocks = []
          for url, block in candidates:
              if url in audit:
                  raise SystemExit(f'Candidate already present in audit.json: {url}')
              if url in text:
                  raise SystemExit(f'Candidate already present in extras/hu.m3u: {url}')
              blocks.append(block)

          if len(blocks) != 5:
              raise SystemExit(f'Expected 5 fresh candidates, got {len(blocks)}')

          marker = '\n# ============================================================\n# HUNT BATCH 7 — 2026-08-23 — FRESH UNTESTED CANDIDATES\n# ============================================================\n'
          text = text.rstrip() + marker + '\n'.join(blocks) + '\n'
          path.write_text(text, encoding='utf-8')
          print('Added 5 fresh HU hunt candidates')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/hu.m3u
          git commit -m "Add next Hungarian channel hunt candidates"
          git push origin HEAD:record-four-failures-2026-08-23
