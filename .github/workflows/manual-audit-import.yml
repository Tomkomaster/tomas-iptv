name: Apply manual playback audit

on:
  push:
    branches:
      - agent/manual-audit-103-2026-08-13

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build current candidate catalog
        run: python3 build.py --strict

      - name: Upsert 103 manual playback results
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, csv, json
          from collections import Counter
          from pathlib import Path
          from iptv.channel_identity import canonical_stream_url

          audit_path = Path('audit.json')
          batch = json.loads(Path('data/manual-audit-2026-08-13.json').read_text(encoding='utf-8'))['rows']
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          manual = audit['channels']

          with Path('public/audit.csv').open(encoding='utf-8-sig', newline='') as f:
              catalog = list(csv.DictReader(f))

          def key(url): return canonical_stream_url(str(url or ''))
          def flags(value):
              try:
                  parsed = ast.literal_eval(str(value or '[]'))
                  return [str(x) for x in parsed] if isinstance(parsed, list) else []
              except Exception:
                  return []

          current = {}
          for row in catalog:
              if str(row.get('in_playlist')).casefold() != 'true':
                  continue
              k = key(row.get('stream_url'))
              if k in current:
                  raise SystemExit(f'Duplicate current catalog URL: {k}')
              current[k] = row

          by_url = {}
          for row in manual:
              k = key(row.get('stream_url'))
              if not k:
                  continue
              if k in by_url:
                  raise SystemExit(f'Duplicate manual audit URL: {k}')
              by_url[k] = row

          counts = Counter()
          added = updated = 0

          for lang, label, vlc, samsung, url, vlc_note, samsung_note in batch:
              k = key(url)
              candidate = current.get(k)
              if not candidate:
                  raise SystemExit(f'No unique current candidate: {label} -> {url}')

              row = by_url.get(k)
              if row is None:
                  row = {'channel': candidate['channel'], 'stream_url': url}
                  manual.append(row)
                  by_url[k] = row
                  added += 1
              else:
                  updated += 1

              source_flags = flags(candidate.get('source_flags'))
              pc_good = vlc in {'works', 'works_with_warning'}
              if samsung == 'works' and pc_good:
                  status = 'verified'
              elif samsung == 'works':
                  status = 'tv_verified'
              elif samsung == 'not_tested' or pc_good or 'Not 24/7' in source_flags:
                  status = 'needs_review'
              else:
                  status = 'rejected'
              counts[status] += 1

              row['channel'] = candidate['channel'] or label
              row['stream_url'] = url
              if candidate.get('tvg_id'): row['tvg_id'] = candidate['tvg_id']
              row['playlist_country_code'] = candidate['playlist_country_code']
              row['output_country_code'] = candidate.get('output_country_code') or candidate['playlist_country_code']
              row['expected_language_codes'] = [lang]
              if vlc == 'works' or samsung == 'works': row['observed_language_codes'] = [lang]
              row.pop('language_match', None)
              row['vlc'] = vlc
              row['vlc_note'] = vlc_note
              if samsung == 'not_tested':
                  row.pop('samsung', None)
                  row['samsung_note'] = 'Not retested on Samsung in the 2026-08-13 batch.'
              else:
                  row['samsung'] = samsung
                  row['samsung_note'] = samsung_note
              row['tested_on'] = '2026-08-13'
              if source_flags: row['source_flags'] = source_flags
              if not row.get('provenance'): row['provenance'] = candidate.get('provenance') or 'Current playlist candidate (manual playback review)'
              if not row.get('discovery'): row['discovery'] = candidate.get('discovery') or candidate.get('source') or 'Manual VLC + Samsung test'

              if status in {'verified', 'tv_verified'}:
                  row.pop('decision', None)
                  row.pop('exclude_from_playlist', None)
                  row['reason'] = 'Working on Samsung' if status == 'tv_verified' else 'Working on both VLC and Samsung in the 2026-08-13 manual test.'
                  row['notes'] = 'Samsung passed; VLC still needs investigation.' if status == 'tv_verified' else ('Samsung passed; VLC played with warning: ' + vlc_note if vlc == 'works_with_warning' else 'Passed both manual playback tests.')
              elif status == 'rejected':
                  row['decision'] = 'rejected'
                  row['exclude_from_playlist'] = True
                  row['reason'] = 'This exact feed failed on both tested devices in the 2026-08-13 manual test.'
                  row['notes'] = f'Failed both manual playback tests. VLC: {vlc_note}. Samsung: {samsung_note}.'
              else:
                  row['decision'] = 'needs_review'
                  row.pop('exclude_from_playlist', None)
                  if 'Not 24/7' in source_flags:
                      row['reason'] = 'Inconclusive manual result for a source flagged Not 24/7; retest during a confirmed broadcast.'
                  elif samsung == 'not_tested':
                      row['reason'] = 'Samsung was not tested in this batch, so the result is incomplete.'
                  else:
                      row['reason'] = 'VLC worked earlier, but Samsung was tested more than 2 hours later; retest both at approximately the same time.'
                  row['notes'] = f'VLC: {vlc_note}. Samsung: {samsung_note if samsung != "not_tested" else "not tested"}. Needs review.'

          expected = {'verified': 74, 'tv_verified': 2, 'needs_review': 22, 'rejected': 5}
          if dict(counts) != expected:
              raise SystemExit(f'Unexpected status counts: {dict(counts)}')
          if len(batch) != 103 or added + updated != 103:
              raise SystemExit(f'Unexpected import totals: batch={len(batch)} added={added} updated={updated}')

          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Applied 103 results: added={added}, updated={updated}, statuses={dict(counts)}')
          PY

      - name: Validate updated repository
        run: |
          python3 run_tests.py
          python3 -m tools.reliable_build --strict

      - name: Commit validated audit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git rm -f data/manual-audit-2026-08-13.json .github/workflows/manual-audit-import.yml data/.manual-audit-write-test.json
          git commit -m "Record August 13 manual playback tests"
          git push
