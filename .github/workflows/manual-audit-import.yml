name: Export manual audit workspace

on:
  push:
    branches:
      - agent/manual-audit-103-2026-08-13

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Build current candidate catalog
        run: python3 build.py --strict

      - name: Upload audit workspace
        uses: actions/upload-artifact@v4
        with:
          name: manual-audit-workspace
          path: |
            audit.json
            public/audit.csv
            data/manual-audit-2026-08-13.json
