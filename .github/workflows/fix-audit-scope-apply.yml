name: Validate corrected audit scope modernization

on:
  push:
    branches:
      - agent/generalize-country-language-external-epg

permissions:
  contents: write

concurrency:
  group: fix-audit-scope-apply
  cancel-in-progress: true

jobs:
  validate-and-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/generalize-country-language-external-epg

      - name: Compile corrected migrator
        run: python3 -m py_compile migrate_audit.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate authoritative current audit rows
        run: python3 build.py --strict

      - name: Repair and modernize audit metadata
        run: |
          python3 migrate_audit.py \
            --audit audit.json \
            --current public/audit.csv \
            --config config.json \
            --modernize-only \
            --write

      - name: Re-run unit tests after repair
        run: python3 -m unittest discover -s tests -v

      - name: Require a warning-free strict audit build
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --strict 2>&1 | tee /tmp/final-strict.log
          if grep -F "saved audit belongs to" /tmp/final-strict.log; then
            echo "ERROR: audit country-scope warnings remain after migration." >&2
            exit 1
          fi

      - name: Check formatting
        run: git diff --check

      - name: Commit repaired audit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          if git diff --cached --quiet; then
            echo "No audit repair was needed."
            exit 0
          fi
          git commit -m "Repair modern audit country scopes"
          git push origin HEAD:agent/generalize-country-language-external-epg
