name: One-off move logical channel key

on:
  push:
    branches:
      - agent/move-logical-channel-key

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: agent/move-logical-channel-key
          fetch-depth: 0

      - name: Move logical channel key
        run: python3 tools/_move_logical_channel_key_once.py

      - name: Compile modules
        run: python3 -m py_compile iptv/channel_identity.py iptv/build_core.py build.py

      - name: Run full unittest suite
        run: python3 run_tests.py

      - name: Remove one-off helpers
        run: |
          rm tools/_move_logical_channel_key_once.py
          rm .github/workflows/move-logical-channel-key-once.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Move logical channel key into identity module"
          git push origin HEAD:agent/move-logical-channel-key
