name: One-time migrate legacy audit

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - "migrate_audit.py"
      - "migrate_builder_warnings.py"
      - ".github/workflows/migrate-audit-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build current playlist inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py 2>&1 | tee .audit-build.log

      - name: Migrate safe legacy audit rows
        run: python3 migrate_audit.py --write

      - name: Migrate builder-confirmed legacy rows
        run: |
          python3 migrate_builder_warnings.py \
            --build-log .audit-build.log \
            --write

      - name: Validate migrated audit strictly
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --strict 2>&1 | tee .strict-build.log

          if grep -q "legacy channel-level audit still matches one current feed" .strict-build.log; then
            echo "Legacy one-feed audit warnings remain after migration."
            exit 1
          fi

      - name: Commit migrated audit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- audit.json; then
            echo "No safe legacy audit rows needed migration."
            exit 0
          fi

          echo "Migrated audit diff summary:"
          git diff --stat -- audit.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git commit -m "Finish legacy audit stream migration"
          git push
