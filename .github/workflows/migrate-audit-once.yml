name: One-time safe audit migration

on:
  push:
    branches:
      - "agent/migrate-safe-legacy-audits"
    paths:
      - ".github/workflows/migrate-audit-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/migrate-safe-legacy-audits
          fetch-depth: 0

      - name: Run unit tests before migration
        run: python3 -m unittest discover -s tests -v

      - name: Build current audit inventory
        run: python3 build.py --strict

      - name: Dry-run conservative migrator
        run: python3 migrate_audit.py

      - name: Apply conservative one-to-one migrations
        run: python3 migrate_audit.py --write

      - name: Rebuild after conservative migration
        run: python3 build.py --strict

      - name: Resolve remaining builder-confirmed legacy rows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import unicodedata
          from datetime import date
          from pathlib import Path

          from migrate_audit import canonical_stream_url

          audit_path = Path("audit.json")
          report_path = Path("public/report.json")

          payload = json.loads(audit_path.read_text(encoding="utf-8-sig"))
          items = payload.get("channels") if isinstance(payload, dict) else payload
          if not isinstance(items, list):
              raise SystemExit("audit.json does not contain a channels list")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          audit_report = report.get("audit") or {}
          ambiguous = audit_report.get("ambiguous_legacy_audits") or []
          if ambiguous:
              raise SystemExit(
                  "Refusing cleanup because ambiguous legacy audits exist."
              )

          warning_pattern = re.compile(
              r"^audit item #(?P<index>\d+) \((?P<channel>.*)\): "
              r"legacy channel-level audit still matches one current feed "
              r"\((?P<url>.+)\)\. Add stream_url when this row is next edited\.$"
          )
          quality_suffix = re.compile(
              r"\s*[\[(](?:2160p|1440p|1080p|720p|576p|540p|480p|440p|432p|406p|400p|396p|360p|240p|4k|uhd|fhd|hd|sd)[\])]\s*$",
              re.IGNORECASE,
          )

          def normalized_name(value: str) -> str:
              value = " ".join((value or "").split()).strip()
              old = None
              while value and value != old:
                  old = value
                  value = quality_suffix.sub("", value).strip()
              value = unicodedata.normalize("NFKD", value).casefold()
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              value = re.sub(r"[^\w]+", " ", value, flags=re.UNICODE)
              return " ".join(value.split())

          def parsed_date(value: str) -> date | None:
              text = str(value or "").strip()
              if not text:
                  return None
              try:
                  return date.fromisoformat(text[:10])
              except ValueError:
                  return None

          removals: list[int] = []
          direct_additions: list[tuple[int, str]] = []

          for warning in audit_report.get("warnings") or []:
              text = str(warning)
              match = warning_pattern.match(text)
              if not match:
                  continue

              legacy_index = int(match.group("index")) - 1
              warning_channel = match.group("channel").strip()
              warning_url = match.group("url").strip()

              if legacy_index < 0 or legacy_index >= len(items):
                  raise SystemExit(f"Invalid audit index in warning: {text}")

              legacy = items[legacy_index]
              if not isinstance(legacy, dict):
                  raise SystemExit(
                      f"Audit item #{legacy_index + 1} is not an object."
                  )
              if str(legacy.get("stream_url") or "").strip():
                  raise SystemExit(
                      f"Audit item #{legacy_index + 1} unexpectedly already has stream_url."
                  )

              legacy_channel = str(
                  legacy.get("channel") or legacy.get("channel_name") or ""
              ).strip()
              if legacy_channel != warning_channel:
                  raise SystemExit(
                      f"Warning/audit channel mismatch at item #{legacy_index + 1}: "
                      f"{warning_channel!r} != {legacy_channel!r}"
                  )

              if not warning_url.startswith(("http://", "https://")):
                  raise SystemExit(
                      f"Unexpected builder-confirmed URL for {legacy_channel}: {warning_url}"
                  )

              canonical = canonical_stream_url(warning_url)
              exact_matches = []
              for exact_index, candidate in enumerate(items):
                  if exact_index == legacy_index or not isinstance(candidate, dict):
                      continue
                  candidate_url = str(candidate.get("stream_url") or "").strip()
                  if candidate_url and canonical_stream_url(candidate_url) == canonical:
                      exact_matches.append((exact_index, candidate))

              if not exact_matches:
                  print(
                      f"BUILDER-CONFIRMED MIGRATE: {legacy_channel} -> {warning_url}"
                  )
                  direct_additions.append((legacy_index, warning_url))
                  continue

              if len(exact_matches) != 1:
                  raise SystemExit(
                      f"Refusing {legacy_channel}: builder says one current feed, "
                      f"but {len(exact_matches)} exact audit rows already use that URL."
                  )

              exact_index, exact = exact_matches[0]
              exact_channel = str(
                  exact.get("channel") or exact.get("channel_name") or ""
              ).strip()

              if normalized_name(legacy_channel) != normalized_name(exact_channel):
                  raise SystemExit(
                      f"Refusing duplicate cleanup for {legacy_channel}: exact URL row "
                      f"belongs to differently normalized channel {exact_channel!r}."
                  )

              legacy_language = str(legacy.get("language_code") or "").strip().upper()
              exact_language = str(exact.get("language_code") or "").strip().upper()
              if legacy_language and exact_language and legacy_language != exact_language:
                  raise SystemExit(
                      f"Refusing duplicate cleanup for {legacy_channel}: language scope "
                      f"differs ({legacy_language} vs {exact_language})."
                  )

              legacy_date = parsed_date(legacy.get("tested_on"))
              exact_date = parsed_date(exact.get("tested_on"))
              if legacy_date and exact_date and exact_date < legacy_date:
                  raise SystemExit(
                      f"Refusing duplicate cleanup for {legacy_channel}: exact URL row "
                      f"is older ({exact_date}) than legacy row ({legacy_date})."
                  )

              for required in ("vlc", "samsung", "decision", "tested_on"):
                  if not str(exact.get(required) or "").strip():
                      raise SystemExit(
                          f"Refusing duplicate cleanup for {legacy_channel}: exact URL row "
                          f"#{exact_index + 1} lacks {required}."
                      )

              print(
                  "REMOVE SUPERSEDED LEGACY: "
                  f"#{legacy_index + 1} {legacy_channel} "
                  f"({legacy.get('tested_on')}) -> exact row #{exact_index + 1} "
                  f"{exact_channel} ({exact.get('tested_on')}); URL={warning_url}"
              )
              removals.append(legacy_index)

          if not removals and not direct_additions:
              print("No remaining builder-confirmed legacy rows required cleanup.")
          else:
              for index, url in direct_additions:
                  items[index]["stream_url"] = url

              for index in sorted(set(removals), reverse=True):
                  del items[index]

              audit_path.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          print(
              f"Remaining cleanup: {len(direct_additions)} URL migrations, "
              f"{len(removals)} superseded legacy rows removed."
          )
          PY

      - name: Rebuild and verify zero legacy warnings
        run: |
          set -euo pipefail
          python3 build.py --strict
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("public/report.json").read_text(encoding="utf-8"))
          audit = report.get("audit") or {}
          warnings = [str(item) for item in (audit.get("warnings") or [])]
          legacy_warnings = [
              item for item in warnings
              if "legacy channel-level audit" in item.casefold()
          ]
          ambiguous = audit.get("ambiguous_legacy_audits") or []

          print(f"Remaining audit warnings: {len(warnings)}")
          print(f"Remaining legacy warnings: {len(legacy_warnings)}")
          print(f"Ambiguous legacy audits: {len(ambiguous)}")

          if ambiguous:
              raise SystemExit("Ambiguous legacy audits remain; refusing commit.")
          if legacy_warnings:
              raise SystemExit("Legacy channel-level warnings remain; refusing commit.")
          PY

      - name: Run unit tests after migration
        run: python3 -m unittest discover -s tests -v

      - name: Commit migrated audit only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check -- audit.json

          if git diff --quiet -- audit.json; then
            echo "No safe audit migrations were available."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git commit -m "Migrate safe legacy audits to exact streams"
          git push origin HEAD:agent/migrate-safe-legacy-audits
