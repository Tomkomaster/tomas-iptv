name: One-time final sync local EPG integration

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/probe-local-epg-once.yml"

permissions:
  contents: write

jobs:
  sync-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Validate permanent integration
        run: |
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
          grep -F '"local_epg.py"' .github/workflows/build-and-publish.yml
          grep -F 'python3 local_epg.py' .github/workflows/build-and-publish.yml
          grep -F -- '--report public/local-epg.json' .github/workflows/build-and-publish.yml

      - name: Push synced branch
        run: git push origin HEAD:agent/audit-epg-health
