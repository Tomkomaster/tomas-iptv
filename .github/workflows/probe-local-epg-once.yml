name: One-time validate local EPG overlay

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/probe-local-epg-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests and strict build
        run: |
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build base merged EPG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epg-builder
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git .epg-builder
          cd .epg-builder
          npm ci
          cd "$GITHUB_WORKSPACE"

          python3 epg_prepare.py \
            --playlist public/tv.m3u \
            --epg-root .epg-builder \
            --sites "mediaklikk.hu,horizon.tv" \
            --output .epg.channels.xml \
            --report .epg-iptv-coverage.json

          cd .epg-builder
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.epg-iptv.xml" \
            --maxConnections=3 \
            2>&1 | tee "$GITHUB_WORKSPACE/.epg-grab.log"
          cd "$GITHUB_WORKSPACE"

          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz \
            -o .epg-external.download

          python3 epg_merge.py \
            --playlist public/tv.m3u \
            --iptv-guide .epg-iptv.xml \
            --iptv-coverage .epg-iptv-coverage.json \
            --external .epg-external.download \
            --external-provider epgshare01.online \
            --preferred-iptv-provider mediaklikk.hu \
            --future-days 7 \
            --output public/guide.xml \
            --report public/epg-coverage.json

      - name: Apply live local EPG overlay
        run: |
          python3 local_epg.py --reference-date 2026-08-11
          python3 epg_health.py \
            --coverage public/epg-coverage.json \
            --guide public/guide.xml \
            --grab-log .epg-grab.log \
            --output public/epg-health.json
          python3 attention.py

      - name: Inspect coverage improvement
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage = json.loads(Path('public/epg-coverage.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/epg-health.json').read_text(encoding='utf-8'))
          local = json.loads(Path('public/local-epg.json').read_text(encoding='utf-8'))
          attention = json.loads(Path('public/attention.json').read_text(encoding='utf-8'))
          guide = ET.parse('public/guide.xml').getroot()

          print('LOCAL', json.dumps(local['summary'], ensure_ascii=False, indent=2))
          for item in local['sources']:
              print(item['tvg_id'], item['status'], item.get('programmes', 0), item.get('error', ''))
          print('COVERAGE', coverage['matched_tvg_ids'], '/', coverage['playlist_tvg_ids'], coverage['mapping_coverage_percent'])
          print('PROGRAMMES', health['channels_with_programmes'], '/', health['playlist_tvg_ids'], health['actual_programme_coverage_percent'])
          print('ENTRIES', health['programme_entries'])
          print('ATTENTION', json.dumps(attention['summary'], ensure_ascii=False))
          print('XML', len(guide.findall('channel')), 'channels', len(guide.findall('programme')), 'programmes')
          print('UNMATCHED', json.dumps(coverage['unmatched_tvg_ids'], ensure_ascii=False))

          if local['summary']['filled_channels'] < 10:
              raise SystemExit('Expected at least 10 local EPG channels to be filled.')
          if health['channels_with_programmes'] < 72:
              raise SystemExit('Expected actual EPG coverage to reach at least 72 channels.')
          PY
