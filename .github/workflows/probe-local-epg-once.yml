name: One-time probe local EPG sources

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/probe-local-epg-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe candidate schedule pages
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import re, html

          urls = {
            'nytv': 'https://nyiregyhazitv.hu/tv-musor',
            'cegled': 'https://ctv.hu/heti-tv-musor/',
            'baja': 'https://www.bajahangja.hu/bajai-tv/adasrend',
            'halom-today': 'https://www.halomtv.hu/tvmusor/2026-08-11',
            'kanizsa-home': 'https://kanizsamediahaz.hu/kanizsatv',
            'eger': 'https://www.tveger.hu/tv-musor/',
            'keszthely': 'https://tvkeszthely.hu/musor',
            'pannon-tue': 'https://pannonrtv.com/musor/pannon-tv-kedd',
            'ozd': 'https://www.ovtv.eu/index.php/tv-musor',
            'vasarhely': 'https://www.hodpress.hu/vtv-musor/',
            'ewtn': 'https://www.tvmustra.hu/tvmusor/EWTN/2026-08-11',
            'filmbox-comedy': 'https://www.tvmustra.hu/tvmusor/FILMBOX_PLUSZ_COMEDY/2026-08-11',
            'filmbox-emotion': 'https://www.tvmustra.hu/tvmusor/FILMBOX_PLUSZ_EMOTION/2026-08-11',
            'filmbox-hits': 'https://www.tvmustra.hu/tvmusor/FILMBOX_PLUSZ_HITS/2026-08-11',
            'filmbox-one': 'https://www.tvmustra.hu/tvmusor/FILMBOX_PLUSZ_ONE/2026-08-11',
          }

          for name, url in urls.items():
              print('\n===', name, url, '===')
              try:
                  req = Request(url, headers={'User-Agent': 'Mozilla/5.0 Tomas-IPTV-EPG/1.0'})
                  with urlopen(req, timeout=15) as response:
                      raw = response.read(400000)
                      charset = response.headers.get_content_charset() or 'utf-8'
                      text = raw.decode(charset, errors='replace')
                      print('status', response.status, 'final', response.geturl(), 'bytes', len(raw))
                      plain = re.sub(r'(?is)<script.*?</script>|<style.*?</style>', ' ', text)
                      plain = re.sub(r'(?i)<br\s*/?>|</(?:p|div|tr|li|h[1-6]|table|section|article|a|span)>', '\n', plain)
                      plain = re.sub(r'(?s)<[^>]+>', ' ', plain)
                      plain = html.unescape(plain)
                      lines = [' '.join(x.split()) for x in plain.splitlines()]
                      lines = [x for x in lines if x]
                      dateish = [x for x in lines if re.search(r'2026|auguszt|08\.11|2026\.08|2026-08', x, re.I)]
                      time_indexes = [i for i,x in enumerate(lines) if re.fullmatch(r'\d{1,2}:\d{2}(?::\d{2})?', x) or re.match(r'^\d{1,2}:\d{2}(?::\d{2})?\s+\S', x)]
                      print('date-ish:', dateish[:15])
                      print('time-count', len(time_indexes))
                      for i in time_indexes[:25]:
                          print('TIMECTX', i, lines[i:i+4])
              except (HTTPError, URLError, TimeoutError, OSError) as exc:
                  print('ERROR', type(exc).__name__, exc)
          PY
