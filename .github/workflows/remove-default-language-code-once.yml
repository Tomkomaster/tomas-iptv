name: One-off remove legacy language config

on:
  push:
    branches: [agent/remove-default-language-code]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-default-language-code
          fetch-depth: 0

      - name: Migrate legacy country fallbacks and config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}'
                  )
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'config.json',
              '  "default_language_code": "HU",\n',
              '',
          )

          replace_exact(
              'country_language.py',
              '        cfg.get("default_country_code"),\n        cfg.get("default_language_code"),\n',
              '        cfg.get("default_country_code"),\n',
          )
          replace_exact(
              'country_language.py',
              '        str(cfg.get("default_country_code") or cfg.get("default_language_code") or "")\n',
              '        str(cfg.get("default_country_code") or "")\n',
          )
          for path in (
              'iptv/language_routing.py',
              'iptv/playlist_writer.py',
              'iptv/publication.py',
          ):
              replace_exact(
                  path,
                  'or cfg.get("default_language_code")',
                  '',
              )

          fixture_counts = {
              'tests/test_build.py': 6,
              'tests/test_canonical_published_names.py': 1,
              'tests/test_country_language_model.py': 1,
              'tests/test_feed_quality.py': 1,
              'tests/test_provider_test_channel_names.py': 2,
              'tests/test_regressions.py': 3,
          }
          for path, expected in fixture_counts.items():
              replace_exact(
                  path,
                  '"default_language_code":',
                  '"default_country_code":',
                  expected=expected,
              )

          Path('tests/test_config_language_keys.py').write_text(
              '''import json\nimport unittest\nfrom pathlib import Path\n\n\nclass ConfigLanguageKeyTests(unittest.TestCase):\n    def test_country_and_language_defaults_use_distinct_code_systems(self):\n        cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))\n        legacy_key = "default_language_" + "code"\n\n        self.assertNotIn(legacy_key, cfg)\n        self.assertEqual(cfg["default_country_code"], "HU")\n        self.assertEqual(cfg["default_language_codes"], ["hun"])\n\n        configured_languages = set(cfg["language_outputs"])\n        for code in cfg["default_language_codes"]:\n            self.assertEqual(len(code), 3)\n            self.assertIn(code, configured_languages)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
              encoding='utf-8',
          )
          PY

      - name: Verify exact legacy field is gone from production and fixtures
        run: |
          needle="default_language_"'code'
          echo "Exact legacy references after migration:"
          git grep -n -w "$needle" -- ':!.github/workflows/remove-default-language-code-once.yml' || true
          refs="$(git grep -l -w "$needle" -- ':!tests/test_documentation_naming.py' ':!tests/test_config_language_keys.py' ':!.github/workflows/remove-default-language-code-once.yml' || true)"
          if [ -n "$refs" ]; then
            echo "Unexpected legacy-field reference remains:" >&2
            echo "$refs" >&2
            exit 1
          fi

          echo "Modern plural default-language references:"
          git grep -n -w 'default_language_codes' || true

      - name: Validate config JSON
        run: python3 -m json.tool config.json >/dev/null

      - name: Run full unittest suite
        run: python3 run_tests.py

      - name: Remove one-off workflow
        run: rm .github/workflows/remove-default-language-code-once.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached -- config.json country_language.py iptv/language_routing.py iptv/playlist_writer.py iptv/publication.py tests/test_config_language_keys.py
          git commit -m "Remove obsolete default language code"
          git push origin HEAD:agent/remove-default-language-code
