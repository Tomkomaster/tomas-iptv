name: Finalize country-language refactor

on:
  push:
    branches:
      - agent/country-language-separation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[country-language-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/country-language-separation

      - name: Apply refactor
        run: |
          python3 .tmp_harden_country_language_patcher.py
          python3 .tmp_country_language_refactor.py
          python3 .tmp_country_language_compat.py
          python3 .tmp_country_language_semantics.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict build
        run: python3 build.py --strict

      - name: Validate separated production metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('public/report.json').read_text(encoding='utf-8'))
          countries = {row['country_code']: row for row in report.get('countries', [])}
          languages = {row['language_code']: row for row in report.get('languages', [])}

          for code in ('HU', 'SK', 'CZ'):
              if countries.get(code, {}).get('unique_channels', 0) <= 0:
                  raise SystemExit(f'Expected non-empty country summary for {code}')

          for code in ('hun', 'slk', 'ces'):
              if languages.get(code, {}).get('unique_channels', 0) <= 0:
                  raise SystemExit(f'Expected non-empty spoken-language summary for {code}')

          print('Country summary:', {
              code: countries[code]['unique_channels']
              for code in ('HU', 'SK', 'CZ')
          })
          print('Spoken languages:', {
              code: languages[code]['unique_channels']
              for code in ('hun', 'slk', 'ces')
          })
          PY

      - name: Check diff
        run: git diff --check

      - name: Commit permanent changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .tmp_country_language_refactor.py \
            .tmp_country_language_compat.py \
            .tmp_country_language_semantics.py \
            .tmp_harden_country_language_patcher.py
          git add \
            build.py \
            country_language.py \
            identity_overrides.py \
            identity_overrides.json \
            config.json \
            dashboard.py \
            templates/dashboard.html \
            README.md \
            docs/country-language-model.md \
            tests
          git commit -m "Separate country from spoken language [country-language-applied]"
          git push origin HEAD:agent/country-language-separation
