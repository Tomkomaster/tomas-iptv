name: Minimize cross-language audit diff

on:
  push:
    branches:
      - agent/support-cross-language-channels

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebuild audit file with only semantic row changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("audit.json")
          current_text = path.read_text(encoding="utf-8")
          current_data = json.loads(current_text)

          main_text = subprocess.check_output(
              ["git", "show", "origin/main:audit.json"],
              text=True,
              encoding="utf-8",
          )
          main_data = json.loads(main_text)

          def keyed(rows):
              result = {}
              for row in rows:
                  url = str(row.get("stream_url") or "").strip()
                  if not url:
                      continue
                  if url in result:
                      raise RuntimeError(f"Duplicate audit URL while minimizing: {url}")
                  result[url] = row
              return result

          main_by_url = keyed(main_data.get("channels") or [])
          current_by_url = keyed(current_data.get("channels") or [])

          changed_urls = [
              url
              for url, row in current_by_url.items()
              if url in main_by_url and row != main_by_url[url]
          ]

          added_urls = sorted(set(current_by_url) - set(main_by_url))
          removed_urls = sorted(set(main_by_url) - set(current_by_url))

          if added_urls or removed_urls:
              raise RuntimeError(
                  "Cross-language migration unexpectedly added/removed audit URLs: "
                  f"added={added_urls}, removed={removed_urls}"
              )

          if len(changed_urls) != 22:
              raise RuntimeError(
                  f"Expected exactly 22 semantically changed audit rows, got {len(changed_urls)}"
              )

          decoder = json.JSONDecoder()
          marker = '"channels"'
          marker_pos = main_text.index(marker)
          array_start = main_text.index("[", marker_pos) + 1
          pos = array_start
          replacements = []
          seen_changed = set()

          while True:
              while pos < len(main_text) and main_text[pos] in " \t\r\n,":
                  pos += 1
              if pos >= len(main_text) or main_text[pos] == "]":
                  break

              row, end = decoder.raw_decode(main_text, pos)
              url = str(row.get("stream_url") or "").strip()

              if url in changed_urls:
                  replacement = json.dumps(
                      current_by_url[url],
                      ensure_ascii=False,
                      indent=2,
                  ).replace("\n", "\n    ")
                  replacements.append((pos, end, replacement))
                  seen_changed.add(url)

              pos = end

          missing = set(changed_urls) - seen_changed
          if missing:
              raise RuntimeError(f"Could not locate changed audit rows in main text: {sorted(missing)}")

          minimal_text = main_text
          for start, end, replacement in reversed(replacements):
              minimal_text = minimal_text[:start] + replacement + minimal_text[end:]

          minimal_data = json.loads(minimal_text)
          if minimal_data != current_data:
              raise RuntimeError("Minimal audit rewrite changed JSON semantics")

          path.write_text(minimal_text, encoding="utf-8")

          print(f"Preserved audit formatting; changed rows: {len(changed_urls)}")
          for url in changed_urls:
              row = current_by_url[url]
              print(
                  f"- {row.get('channel')}: "
                  f"{row.get('playlist_language_code')} playlist, "
                  f"observed={row.get('observed_language_codes')}"
              )
          PY

      - name: Validate minimal diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat origin/main -- audit.json
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Commit and push minimal audit file
        shell: bash
        run: |
          set -euo pipefail
          git add audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep cross-language audit migration diff focused"
          git push origin HEAD:agent/support-cross-language-channels
