name: Polish country-language refactor

on:
  push:
    branches:
      - agent/country-language-separation

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[country-language-polished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/country-language-separation

      - name: Apply compatibility polish
        run: python3 .tmp_country_language_polish.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict build
        run: python3 build.py --strict

      - name: Validate separated metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('public/report.json').read_text(encoding='utf-8'))
          countries = {row['country_code']: row for row in report.get('countries', [])}
          languages = {row['language_code']: row for row in report.get('languages', [])}

          for code in ('HU', 'SK', 'CZ'):
              if countries.get(code, {}).get('unique_channels', 0) <= 0:
                  raise SystemExit(f'Expected non-empty country summary for {code}')
          for code in ('hun', 'slk', 'ces'):
              if languages.get(code, {}).get('unique_channels', 0) <= 0:
                  raise SystemExit(f'Expected non-empty spoken-language summary for {code}')
          PY

      - name: Check diff
        run: git diff --check

      - name: Commit permanent polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .tmp_country_language_polish.py
          git add build.py tests/test_country_language_integration.py
          git commit -m "Polish country-language compatibility [country-language-polished]"
          git push origin HEAD:agent/country-language-separation
