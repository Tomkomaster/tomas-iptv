name: One-time test external Hungarian EPG

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/test-external-hu-epg-once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build playlist
        run: python3 build.py --strict
      - name: Inspect playlist vs EPGshare names
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS 'https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz' -o /tmp/hu.xml.gz
          gzip -dc /tmp/hu.xml.gz > /tmp/hu.xml

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path
          from migrate_audit import clean_channel_name

          ATTR_RE = re.compile(r'([\w-]+)="([^"]*)"')
          rows = []
          pending = None
          for raw in Path('public/tv.m3u').read_text(encoding='utf-8-sig').splitlines():
              line = raw.strip()
              if line.startswith('#EXTINF:'):
                  attrs = dict(ATTR_RE.findall(line))
                  tvg_id = (attrs.get('tvg-id') or '').strip()
                  name = line.rsplit(',', 1)[-1].strip() if ',' in line else ''
                  pending = (tvg_id, name)
              elif line and not line.startswith('#') and pending:
                  if pending[0]:
                      rows.append(pending)
                  pending = None

          by_id = {}
          for tvg_id, name in rows:
              by_id.setdefault(tvg_id, name)
          rows = list(by_id.items())

          root = ET.parse('/tmp/hu.xml').getroot()
          external_names = defaultdict(list)
          for c in root.findall('channel'):
              cid = (c.get('id') or '').strip()
              for d in c.findall('display-name'):
                  name = (d.text or '').strip()
                  if name:
                      external_names[clean_channel_name(name)].append((cid, name))

          print('=== PLAYLIST TVG-ID / NAME / NORMALIZED / EPGSHARE EXACT-NAME CANDIDATES ===')
          for tvg_id, name in sorted(rows, key=lambda x: x[1].casefold()):
              key = clean_channel_name(name)
              candidates = external_names.get(key, [])
              print(f'{tvg_id} | {name} | {key} | {candidates}')
          PY
