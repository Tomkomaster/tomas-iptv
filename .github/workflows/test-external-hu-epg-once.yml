name: One-time test external Hungarian EPG

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/test-external-hu-epg-once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build playlist
        run: python3 build.py --strict
      - name: Test EPGshare Hungary
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS 'https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz' -o /tmp/hu.download

          python3 - <<'PY'
          import gzip
          from pathlib import Path
          source = Path('/tmp/hu.download').read_bytes()
          print('download bytes:', len(source))
          if source.startswith(b'\x1f\x8b'):
              data = gzip.decompress(source)
              print('transport: gzip')
          else:
              data = source
              print('transport: plain')
          Path('/tmp/hu.xml').write_bytes(data)
          print('xml bytes:', len(data))
          print('xml prefix:', data[:120])
          PY

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from epg_prepare import read_playlist_tvg_ids, quality_base_id

          playlist = read_playlist_tvg_ids(Path('public/tv.m3u'))
          p_exact = {x.casefold(): x for x in playlist}
          p_base = {quality_base_id(x): x for x in playlist}

          root = ET.parse('/tmp/hu.xml').getroot()
          channels = root.findall('channel')
          programmes = root.findall('programme')
          ids = [(c.get('id') or '').strip() for c in channels]
          today = datetime.now(timezone.utc).strftime('%Y%m%d')

          def target(cid):
              if cid.casefold() in p_exact:
                  return p_exact[cid.casefold()]
              return p_base.get(quality_base_id(cid))

          exact_matched = {target(cid) for cid in ids if target(cid)}
          populated = set()
          today_populated = set()
          dates = Counter()
          for p in programmes:
              cid = (p.get('channel') or '').strip()
              t = target(cid)
              start = (p.get('start') or '').strip()
              m = re.match(r'(\d{8})', start)
              if m:
                  dates[m.group(1)] += 1
              if t:
                  populated.add(t)
                  if start.startswith(today):
                      today_populated.add(t)

          print('feed channels:', len(channels))
          print('feed programmes:', len(programmes))
          print('playlist ids:', len(playlist))
          print('exact/quality matched:', len(exact_matched))
          print('matched with any programmes:', len(populated))
          print('matched with TODAY programmes:', len(today_populated))
          print('today matched IDs:', ', '.join(sorted(today_populated)))
          print('programme date counts:', dict(sorted(dates.items())))
          print('current UTC date:', today)
          print('sample IDs:')
          for c in channels[:60]:
              cid = (c.get('id') or '').strip()
              names = [(d.text or '').strip() for d in c.findall('display-name') if (d.text or '').strip()]
              print(' ', cid, '|', ' / '.join(names))
          PY
