name: One-time test external Hungarian EPG

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/test-external-hu-epg-once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build playlist
        run: python3 build.py --strict
      - name: Test GlobeTV Hungary
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS 'https://raw.githubusercontent.com/globetvapp/epg/main/Hungary/hungary1.xml.gz' -o /tmp/hu.download

          python3 - <<'PY'
          import gzip
          from pathlib import Path

          source = Path('/tmp/hu.download').read_bytes()
          print('download bytes:', len(source))
          print('magic:', source[:16])
          if source.startswith(b'\x1f\x8b'):
              data = gzip.decompress(source)
              print('transport: gzip')
          else:
              data = source
              print('transport: plain')
          Path('/tmp/hu.xml').write_bytes(data)
          print('xml bytes:', len(data))
          print('xml prefix:', data[:120])
          PY

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from epg_prepare import read_playlist_tvg_ids, quality_base_id

          playlist = read_playlist_tvg_ids(Path('public/tv.m3u'))
          p_exact = {x.casefold(): x for x in playlist}
          p_base = {quality_base_id(x): x for x in playlist}

          root = ET.parse('/tmp/hu.xml').getroot()
          channel_ids = [(c.get('id') or '').strip() for c in root.findall('channel')]
          programmes = root.findall('programme')
          programme_ids = [(p.get('channel') or '').strip() for p in programmes]
          starts = [(p.get('start') or '').strip() for p in programmes]

          matched = set()
          for cid in channel_ids:
              if cid.casefold() in p_exact:
                  matched.add(p_exact[cid.casefold()])
              else:
                  q = quality_base_id(cid)
                  if q in p_base:
                      matched.add(p_base[q])

          populated = set()
          current_populated = set()
          today = datetime.now(timezone.utc).strftime('%Y%m%d')
          for p in programmes:
              cid = (p.get('channel') or '').strip()
              target = None
              if cid.casefold() in p_exact:
                  target = p_exact[cid.casefold()]
              else:
                  q = quality_base_id(cid)
                  target = p_base.get(q)
              if target:
                  populated.add(target)
                  start = (p.get('start') or '').strip()
                  if start.startswith(today):
                      current_populated.add(target)

          dates = Counter()
          for s in starts:
              m = re.match(r'(\d{8})', s)
              if m:
                  dates[m.group(1)] += 1

          display_names = {}
          for c in root.findall('channel'):
              cid = (c.get('id') or '').strip()
              names = [(d.text or '').strip() for d in c.findall('display-name') if (d.text or '').strip()]
              display_names[cid] = names

          print('feed channels:', len(channel_ids))
          print('feed programmes:', len(programme_ids))
          print('playlist ids:', len(playlist))
          print('exact/quality matched channels:', len(matched))
          print('matched with any programmes:', len(populated))
          print('matched with TODAY programmes:', len(current_populated))
          print('today matched IDs:', ', '.join(sorted(current_populated)))
          print('programme date counts:', dict(sorted(dates.items())))
          print('current UTC date:', today)
          print('sample channels:')
          for cid in channel_ids[:30]:
              print(' ', cid, '|', ' / '.join(display_names.get(cid, [])))
          PY
