name: Fix AT dual-fail exclusions 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-at-dual-fail-exclusions-20260815.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Mark Austrian dual-device failures rejected
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('audit.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          hard_fail = {'generic_error', 'format_error', 'loads', 'mrl_error'}
          changed = []

          for row in data.get('channels', []):
              if row.get('playlist_country_code') != 'AT' or row.get('tested_on') != '2026-08-15':
                  continue
              vlc = str(row.get('vlc') or '').strip()
              samsung = str(row.get('samsung') or '').strip()
              if vlc in hard_fail and samsung in hard_fail:
                  row['decision'] = 'rejected'
                  row['exclude_from_playlist'] = True
                  row['reason'] = 'This exact feed failed on both tested devices in the 2026-08-15 manual test.'
                  if not row.get('notes'):
                      vn = str(row.get('vlc_note') or vlc)
                      sn = str(row.get('samsung_note') or samsung)
                      row['notes'] = f'Failed both manual playback tests. VLC: {vn}. Samsung: {sn}.'
                  changed.append((row.get('channel'), row.get('stream_url'), vlc, samsung))

          if len(changed) != 23:
              raise SystemExit(f'Expected 23 Austrian dual-device failures, found {len(changed)}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Marked {len(changed)} Austrian dual-device failures as rejected/excluded.')
          for item in changed:
              print(' -', item)
          PY

      - name: Validate
        run: |
          python3 -m json.tool audit.json > /dev/null
          python3 run_tests.py
          python3 -m tools.reliable_build --strict

      - name: Commit fix and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git rm .github/workflows/fix-at-dual-fail-exclusions-20260815.yml
          git commit -m "Reject Austrian streams that failed both devices"
          git push origin HEAD:main
