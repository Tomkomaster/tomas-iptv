name: Route verified streams by spoken language

on:
  push:
    branches:
      - agent/route-verified-spoken-language

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decode and apply spoken-language routing correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path(
              ".github/scripts/route_verified_language.py.gz.b64"
          ).read_text(encoding="utf-8").strip()
          source = gzip.decompress(base64.b64decode(encoded))
          Path("/tmp/route_verified_language.py").write_bytes(source)
          PY
          python3 /tmp/route_verified_language.py

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Verify migrated Czech streams are published only in CZ
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("audit.json").read_text(encoding="utf-8"))
          targets = [
              row
              for row in audit.get("channels", [])
              if str(row.get("notes") or "").startswith(
                  "Verified Czech-speaking stream."
              )
          ]
          if len(targets) != 22:
              raise RuntimeError(f"Expected 22 routed Czech rows, got {len(targets)}")

          stable = Path("public/tv.m3u").read_text(encoding="utf-8")
          hu = Path("public/hu.m3u").read_text(encoding="utf-8")
          sk = Path("public/sk.m3u").read_text(encoding="utf-8")
          cz = Path("public/cz.m3u").read_text(encoding="utf-8")

          for row in targets:
              url = str(row.get("stream_url") or "").strip()
              if stable.count(url) != 1:
                  raise RuntimeError(
                      f"{row.get('channel')} should appear once in stable playlist"
                  )
              if cz.count(url) != 1:
                  raise RuntimeError(
                      f"{row.get('channel')} should appear once in CZ playlist"
                  )
              if url in hu or url in sk:
                  raise RuntimeError(
                      f"{row.get('channel')} leaked back into HU/SK"
                  )

          report = json.loads(
              Path("public/report.json").read_text(encoding="utf-8")
          )
          cz_count = int(
              report.get("playlists", {})
              .get("country_stream_urls", {})
              .get("CZ", 0)
          )
          if cz_count < 22:
              raise RuntimeError(
                  f"Expected at least 22 stable CZ streams, got {cz_count}"
              )

          print(
              "Verified 22 Czech-speaking streams are stable exactly once "
              f"under CZ; stable CZ count={cz_count}."
          )
          PY

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git add build.py tests/test_regressions.py audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Route verified streams by spoken language"
          git push origin HEAD:agent/route-verified-spoken-language
