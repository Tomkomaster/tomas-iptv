name: One-time integrate attention dashboard

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/patch-attention-dashboard-once.yml"

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Patch dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 patch_attention_dashboard.py
          git diff --check

      - name: Run full tests and strict build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 build.py --strict

      - name: Validate rendered dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline dashboard JavaScript found.')
          Path('/tmp/dashboard.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Generate advisory attention smoke report
        shell: bash
        run: |
          set -euo pipefail
          python3 healthcheck.py --no-previous
          python3 attention.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('public/attention.json').read_text(encoding='utf-8'))
          if data.get('advisory_only') is not True:
              raise SystemExit('Attention report must remain advisory only.')
          if 'items' not in data or 'summary' not in data:
              raise SystemExit('Attention report shape is incomplete.')
          print(json.dumps(data['summary'], indent=2, ensure_ascii=False))
          print('Top attention items:')
          for item in data['items'][:15]:
              print(
                  ' -', item['severity'], item['channel'],
                  '|', ', '.join(signal['category'] for signal in item['signals'])
              )
          PY

      - name: Commit dashboard integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py
          git commit -m "Add unified needs attention dashboard"
          git push
