name: One-off extract playback status

on:
  push:
    branches:
      - agent/extract-playback-status

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: agent/extract-playback-status
          fetch-depth: 0

      - name: Extract playback status subsystem
        run: python3 tools/_extract_playback_status_once.py

      - name: Compile extracted modules
        run: python3 -m py_compile iptv/playback_status.py iptv/build_core.py build.py

      - name: Run full unittest suite
        run: python3 run_tests.py

      - name: Remove one-off refactor helpers
        run: |
          rm tools/_extract_playback_status_once.py
          rm .github/workflows/refactor-playback-status-once.yml

      - name: Commit extracted subsystem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes were produced." >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m "Extract playback status from build core"
          git push origin HEAD:agent/extract-playback-status
