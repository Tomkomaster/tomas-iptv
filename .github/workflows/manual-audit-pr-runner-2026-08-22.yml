name: Temporary manual audit runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-audit:
    if: (github.event_name == 'push' && github.actor != 'github-actions[bot]') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/manual-playback-2026-08-22')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/manual-playback-2026-08-22

      - name: Run guarded audit patch from branch
        shell: bash
        run: |
          python - <<'RUNNER'
          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/manual-audit-patch-2026-08-22.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in source:
              raise SystemExit('Could not locate embedded audit patch.')
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<manual-audit-patch>', 'exec'))
          RUNNER

      - name: Validate JSON and project tests
        shell: bash
        run: |
          python -m json.tool audit.json >/dev/null
          python run_tests.py
          git diff --check
          git diff --stat

      - name: Commit audit update to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Record manual VLC and Samsung playback tests"
          git push origin HEAD:audit/manual-playback-2026-08-22
