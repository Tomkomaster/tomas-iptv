name: One-off audit storage refactor

on:
  push:
    branches: [agent/split-audit-telemetry]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/split-audit-telemetry
          fetch-depth: 0

      - name: Apply audit storage refactor
        run: |
          python3 tools/_refactor_audit_storage_once.py
          python3 tools/_fix_audit_storage_tests_once.py

      - name: Compile affected Python
        run: |
          python3 -m py_compile \
            iptv/audit_storage.py \
            iptv/audit.py \
            tools/compact_audit.py \
            tools/migrate_audit.py \
            tests/test_audit_storage.py

      - name: Verify compactor is idempotent
        run: |
          before="$(sha256sum audit.json | cut -d' ' -f1)"
          python3 tools/compact_audit.py --write
          after="$(sha256sum audit.json | cut -d' ' -f1)"
          test "$before" = "$after"

      - name: Run full unittest suite
        run: python3 run_tests.py

      - name: Verify storage contract and size
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from iptv.audit_storage import GENERATED_CONTEXT_FIELDS, machine_telemetry_fields

          path = Path('audit.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['schema_version'] == 2
          assert payload['storage'] == 'manual_only'
          failures = []
          for index, row in enumerate(payload['channels'], start=1):
              telemetry = machine_telemetry_fields(row)
              generated = sorted(set(row).intersection(GENERATED_CONTEXT_FIELDS))
              if telemetry or generated:
                  failures.append((index, telemetry, generated))
          assert not failures, failures[:10]
          print(f"Final audit.json: {path.stat().st_size:,} bytes, {len(payload['channels']):,} manual rows")
          PY

      - name: Remove one-off refactor helpers
        run: |
          rm tools/_refactor_audit_storage_once.py
          rm tools/_fix_audit_storage_tests_once.py
          rm .github/workflows/audit-inventory-once.yml
          rm .github/workflows/audit-storage-refactor-once.yml

      - name: Commit tested audit storage cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Separate manual audit from generated telemetry"
          git push origin HEAD:agent/split-audit-telemetry
