name: One-off EPG quality refactor

on:
  push:
    branches:
      - agent/epg-tvg-quality

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: agent/epg-tvg-quality
          fetch-depth: 0

      - name: Apply EPG quality refactor
        run: python3 tools/_epg_quality_refactor_once.py

      - name: Compile affected Python
        run: |
          python3 -m py_compile \
            epg/epg_quality.py \
            epg/epg_policy.py \
            tests/test_epg_quality.py

      - name: Run full unittest suite
        run: python3 run_tests.py

      - name: Validate workflow and dashboard contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/build-and-publish.yml').read_text(encoding='utf-8')
          template = Path('templates/dashboard.html').read_text(encoding='utf-8')
          script = Path('static/dashboard.js').read_text(encoding='utf-8')
          assert 'python3 -m epg.epg_quality' in workflow
          assert 'epg-quality.json' in script
          for label in ('Exact tvg-id', 'Alias', 'Guessed', 'Missing', 'EPG unavailable'):
              assert label in template + script
          assert 'Verified channels without EPG mapping' in template
          assert 'Unexpected tvg-id collisions' in template
          print('EPG quality dashboard/workflow contract OK.')
          PY

      - name: Remove one-off helpers
        run: |
          rm tools/_epg_quality_refactor_once.py
          rm .github/workflows/epg-quality-refactor-once.yml

      - name: Commit tested EPG quality implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add EPG identity quality reporting"
          git push origin HEAD:agent/epg-tvg-quality
