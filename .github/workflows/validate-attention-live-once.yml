name: One-time validate attention with live EPG

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/validate-attention-live-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build current stable playlist
        run: python3 build.py --strict

      - name: Check live stable streams
        run: python3 healthcheck.py --no-previous

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build live merged EPG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epg-builder
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git .epg-builder
          cd .epg-builder
          npm ci
          cd "$GITHUB_WORKSPACE"

          python3 epg_prepare.py \
            --playlist public/tv.m3u \
            --epg-root .epg-builder \
            --sites "mediaklikk.hu,horizon.tv" \
            --output .epg.channels.xml \
            --report .epg-iptv-coverage.json

          cd .epg-builder
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.epg-iptv.xml" \
            --maxConnections=3 \
            2>&1 | tee "$GITHUB_WORKSPACE/.epg-grab.log"
          cd "$GITHUB_WORKSPACE"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz" \
            -o .epg-external.download

          python3 epg_merge.py \
            --playlist public/tv.m3u \
            --iptv-guide .epg-iptv.xml \
            --iptv-coverage .epg-iptv-coverage.json \
            --external .epg-external.download \
            --external-provider epgshare01.online \
            --preferred-iptv-provider mediaklikk.hu \
            --future-days 7 \
            --output public/guide.xml \
            --report public/epg-coverage.json

          python3 epg_health.py \
            --coverage public/epg-coverage.json \
            --guide public/guide.xml \
            --grab-log .epg-grab.log \
            --output public/epg-health.json

      - name: Build and inspect unified attention queue
        shell: bash
        run: |
          set -euo pipefail
          python3 attention.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('public/attention.json').read_text(encoding='utf-8'))
          print('=== ATTENTION SUMMARY ===')
          print(json.dumps(data['summary'], indent=2, ensure_ascii=False))
          print('=== ATTENTION ITEMS ===')
          for item in data['items']:
              print(
                  item['severity'].upper(),
                  item['priority_score'],
                  item['channel'],
                  '| manual=', item['manual_status'],
                  '| auto=', item['auto_status'],
                  '| epg=', item['epg_status'],
                  '| reasons=', ','.join(signal['category'] for signal in item['signals']),
              )

          categories = data['summary']['category_counts']
          if categories.get('epg_unmapped', 0) == 0:
              raise SystemExit('Expected real unmatched EPG channels in attention queue.')
          if categories.get('epg_mapped_empty', 0) == 0:
              raise SystemExit('Expected mapped-but-empty EPG channels in attention queue.')
          if data.get('advisory_only') is not True:
              raise SystemExit('Attention queue must remain advisory only.')
          PY
