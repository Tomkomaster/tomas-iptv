name: One-time research priority queue

on:
  push:
    branches:
      - "agent/research-priority-queue"
    paths:
      - ".github/workflows/research-priority-once.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout priority branch
        uses: actions/checkout@v7
        with:
          ref: agent/research-priority-queue
          fetch-depth: 0

      - name: Build baseline research queue
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --strict
          cp public/audit.csv /tmp/audit.csv
          cp public/index.html /tmp/index-clean.html
          python3 research_exports.py --public-dir public
          cp public/missing.csv /tmp/missing-before.csv

      - name: Patch research exporter and publish workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("research_exports.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}.")
              text = text.replace(old, new, 1)

          replace_once(
              "import argparse\nimport csv\nimport re\n",
              "import argparse\nimport csv\nimport json\nimport re\nfrom collections import Counter\n",
              "imports",
          )
          replace_once(
              "from pathlib import Path\n\n\nTESTED_STATUSES",
              "from pathlib import Path\n\nfrom research_priority import (\n"
              "    PRIORITY_ORDER,\n"
              "    compile_research_priority_policy,\n"
              "    priority_rank,\n"
              "    resolve_research_priority,\n"
              ")\n\n\nTESTED_STATUSES",
              "priority imports",
          )

          derive_marker = '''def latest_test_date(rows: list[dict[str, str]]) -> str:\n'''
          work_type = '''def work_type_for_status(status: str) -> str:\n    return {\n        "PARTIAL": "Finish compatibility",\n        "CANDIDATES TO TEST": "Test candidates",\n        "NOT RESEARCHED": "Find first candidate",\n        "NO WORKING FEED": "Hunt new source",\n    }.get(status, "Review")\n\n\n'''
          if derive_marker not in text:
              raise SystemExit("Could not locate latest_test_date marker.")
          text = text.replace(derive_marker, work_type + derive_marker, 1)

          replace_once(
              "def make_missing_rows(\n"
              "    grouped: dict[str, list[dict[str, str]]],\n"
              ") -> list[dict[str, object]]:\n"
              "    output: list[dict[str, object]] = []\n",
              "def make_missing_rows(\n"
              "    grouped: dict[str, list[dict[str, str]]],\n"
              "    *,\n"
              "    priority_policy: dict | None = None,\n"
              ") -> list[dict[str, object]]:\n"
              "    output: list[dict[str, object]] = []\n"
              "    compiled_priority = compile_research_priority_policy(priority_policy)\n",
              "missing signature",
          )

          replace_once(
              "        if status == \"WORKING\":\n"
              "            continue\n\n"
              "        current = [row for row in rows if is_current(row)]\n",
              "        if status == \"WORKING\":\n"
              "            continue\n\n"
              "        country = row_country(rows[0]) if rows else \"UNKNOWN\"\n"
              "        channel = display_channel(rows)\n"
              "        tvg_id = display_tvg_id(rows)\n\n"
              "        current = [row for row in rows if is_current(row)]\n",
              "missing identity variables",
          )

          append_start = text.find(
              "        output.append(\n            {\n                \"country\": row_country(rows[0]) if rows else \"UNKNOWN\",\n",
              text.find("def make_missing_rows"),
          )
          sort_start = text.find("    output.sort(\n", append_start)
          if append_start < 0 or sort_start < 0:
              raise SystemExit("Could not locate missing-row append block.")

          new_append = '''        missing_row = {\n            "country": country,\n            "channel": channel,\n            "status": status,\n            "tvg_id": tvg_id,\n            "known_feeds": len(rows),\n            "current_candidates": len(current),\n            "tested_feeds": len(tested),\n            "fully_tested_feeds": len(fully_tested),\n            "followup_candidates": len(followup),\n            "rejected_feeds": len(rejected),\n            "unique_sources": len(sources),\n            "sources": " | ".join(sources),\n            "last_tested": latest_test_date(rows),\n            "next_action": next_action,\n            "work_type": work_type_for_status(status),\n        }\n        priority = resolve_research_priority(missing_row, compiled_priority)\n        missing_row.update({\n            "priority": priority["priority"],\n            "priority_label": priority["label"],\n            "priority_reason": priority["reason"],\n            "priority_match": priority["matched_by"],\n        })\n        output.append(missing_row)\n\n'''
          text = text[:append_start] + new_append + text[sort_start:]

          replace_once(
              "    output.sort(\n"
              "        key=lambda row: (\n"
              "            str(row[\"country\"]),\n"
              "            STATUS_ORDER.get(str(row[\"status\"]), 99),\n"
              "            normalize_name(row[\"channel\"]),\n"
              "        )\n"
              "    )\n",
              "    output.sort(\n"
              "        key=lambda row: (\n"
              "            priority_rank(row.get(\"priority\")),\n"
              "            STATUS_ORDER.get(str(row[\"status\"]), 99),\n"
              "            str(row[\"country\"]),\n"
              "            normalize_name(row[\"channel\"]),\n"
              "        )\n"
              "    )\n",
              "missing sort",
          )

          replace_once(
              "            '    <a href=\"missing.csv\">Channels needing attention (CSV)</a>',\n",
              "            '    <a href=\"missing.csv\">Prioritized research work queue (CSV)</a>',\n",
              "dashboard missing label",
          )

          generate_marker = "def generate_exports(public_dir: Path, generated_at: str | None = None) -> dict[str, int]:\n"
          loader = '''def load_priority_policy(path: Path | None) -> dict:\n    if path is None or not path.is_file():\n        return {}\n    return json.loads(path.read_text(encoding="utf-8-sig"))\n\n\n'''
          if generate_marker not in text:
              raise SystemExit("Could not locate generate_exports signature.")
          text = text.replace(
              generate_marker,
              loader
              + "def generate_exports(\n"
              + "    public_dir: Path,\n"
              + "    generated_at: str | None = None,\n"
              + "    *,\n"
              + "    priority_policy: dict | None = None,\n"
              + ") -> dict[str, object]:\n",
              1,
          )

          replace_once(
              "    missing_rows = make_missing_rows(grouped)\n",
              "    missing_rows = make_missing_rows(\n"
              "        grouped,\n"
              "        priority_policy=priority_policy,\n"
              "    )\n",
              "priority-aware missing rows",
          )

          replace_once(
              "            \"country\",\n"
              "            \"channel\",\n"
              "            \"status\",\n"
              "            \"tvg_id\",\n",
              "            \"country\",\n"
              "            \"channel\",\n"
              "            \"priority\",\n"
              "            \"work_type\",\n"
              "            \"status\",\n"
              "            \"priority_label\",\n"
              "            \"priority_reason\",\n"
              "            \"priority_match\",\n"
              "            \"tvg_id\",\n",
              "missing csv priority columns",
          )

          replace_once(
              "    return {\n"
              "        \"channels\": len(grouped),\n"
              "        \"research_rows\": len(research_rows),\n"
              "        \"missing_channels\": len(missing_rows),\n"
              "    }\n",
              "    priority_counts = Counter(str(row.get(\"priority\") or \"\") for row in missing_rows)\n"
              "    return {\n"
              "        \"channels\": len(grouped),\n"
              "        \"research_rows\": len(research_rows),\n"
              "        \"missing_channels\": len(missing_rows),\n"
              "        \"priority_counts\": {\n"
              "            priority: priority_counts.get(priority, 0)\n"
              "            for priority in PRIORITY_ORDER\n"
              "        },\n"
              "    }\n",
              "priority stats",
          )

          replace_once(
              "    parser.add_argument(\n"
              "        \"--public-dir\",\n"
              "        default=\"public\",\n"
              "        help=\"Generated public directory (default: public)\",\n"
              "    )\n"
              "    args = parser.parse_args()\n\n"
              "    stats = generate_exports(Path(args.public_dir))\n",
              "    parser.add_argument(\n"
              "        \"--public-dir\",\n"
              "        default=\"public\",\n"
              "        help=\"Generated public directory (default: public)\",\n"
              "    )\n"
              "    parser.add_argument(\n"
              "        \"--priority-policy\",\n"
              "        type=Path,\n"
              "        default=Path(\"research_priority.json\"),\n"
              "        help=\"Research priority policy JSON (default: research_priority.json)\",\n"
              "    )\n"
              "    args = parser.parse_args()\n\n"
              "    stats = generate_exports(\n"
              "        Path(args.public_dir),\n"
              "        priority_policy=load_priority_policy(args.priority_policy),\n"
              "    )\n",
              "priority cli",
          )

          replace_once(
              "        f\"{stats['missing_channels']} channels needing attention.\"\n"
              "    )\n",
              "        f\"{stats['missing_channels']} channels needing attention.\"\n"
              "    )\n"
              "    priorities = stats[\"priority_counts\"]\n"
              "    print(\n"
              "        \"Research priorities: \"\n"
              "        + \", \".join(f\"{priority} {priorities[priority]}\" for priority in PRIORITY_ORDER)\n"
              "    )\n",
              "priority cli summary",
          )

          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/build-and-publish.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          old = '      - "research_exports.py"\n      - "epg_prepare.py"\n'
          new = (
              '      - "research_exports.py"\n'
              '      - "research_priority.py"\n'
              '      - "research_priority.json"\n'
              '      - "epg_prepare.py"\n'
          )
          if workflow_text.count(old) != 1:
              raise SystemExit("Could not locate research_exports.py workflow path entry.")
          workflow.write_text(workflow_text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run tests and generate prioritized queue
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research_priority.py research_exports.py
          python3 -m unittest discover -s tests -v
          rm -rf public
          mkdir -p public
          cp /tmp/audit.csv public/audit.csv
          cp /tmp/index-clean.html public/index.html
          python3 research_exports.py \
            --public-dir public \
            --priority-policy research_priority.json
          git diff --check

      - name: Validate queue preservation and ranking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          from research_priority import PRIORITY_ORDER, priority_rank

          def read(path):
              with Path(path).open("r", encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          old = read("/tmp/missing-before.csv")
          new = read("public/missing.csv")

          def identity(row):
              return (
                  row.get("country", ""),
                  row.get("channel", ""),
                  row.get("status", ""),
                  row.get("tvg_id", ""),
              )

          if Counter(map(identity, old)) != Counter(map(identity, new)):
              raise SystemExit("Prioritization changed the underlying missing-channel work set.")

          priorities = Counter(row["priority"] for row in new)
          if set(priorities) - set(PRIORITY_ORDER):
              raise SystemExit(f"Unexpected priorities: {sorted(set(priorities) - set(PRIORITY_ORDER))}")
          if priorities["P1"] == 0 or priorities["P2"] == 0 or priorities["P5"] == 0:
              raise SystemExit(f"Priority policy did not produce useful high/low buckets: {priorities}")

          ranks = [priority_rank(row["priority"]) for row in new]
          if ranks != sorted(ranks):
              raise SystemExit("missing.csv is not sorted by research priority.")

          expected_work = {
              "PARTIAL": "Finish compatibility",
              "CANDIDATES TO TEST": "Test candidates",
              "NOT RESEARCHED": "Find first candidate",
              "NO WORKING FEED": "Hunt new source",
          }
          for row in new:
              if row["work_type"] != expected_work.get(row["status"], "Review"):
                  raise SystemExit(f"Wrong work_type for {row['channel']}: {row}")
              if not row["priority_reason"].strip():
                  raise SystemExit(f"Missing priority reason for {row['channel']}")

          print("Baseline rows:", len(old))
          print("Prioritized rows:", len(new))
          print("Priority counts:", dict(sorted(priorities.items())))
          print("Top 20 research tasks:")
          for row in new[:20]:
              print(
                  f"  {row['country']} | {row['channel']} | {row['priority']} | "
                  f"{row['work_type']} | {row['status']}"
              )
          PY

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_exports.py .github/workflows/build-and-publish.yml
          if git diff --cached --quiet; then
            echo "No exporter changes to commit."
            exit 0
          fi
          git commit -m "Prioritize missing channel research"
          git push origin HEAD:agent/research-priority-queue
