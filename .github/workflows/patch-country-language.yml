name: Temporary country-language refactor

on:
  push:
    branches:
      - agent/country-language-separation

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[country-language-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/country-language-separation

      - name: Harden patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.tmp_country_language_refactor.py')
          text = path.read_text(encoding='utf-8')

          old_once = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{label}: expected exactly one match, found {count}")
    return text.replace(old, new, 1)
'''
          new_once = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
    count = text.count(old)
    if count != 1:
        if label == "audit output row country fields" and count > 0:
            return text.replace(old, new, 1)
        raise SystemExit(f"{label}: expected exactly one match, found {count}")
    return text.replace(old, new, 1)
'''
          if text.count(old_once) != 1:
              raise SystemExit('replace_once helper anchor changed')
          text = text.replace(old_once, new_once, 1)

          old_region = '''def replace_region(text: str, start: str, end: str, new: str, label: str) -> str:
    start_i = text.find(start)
    if start_i < 0:
        raise SystemExit(f"{label}: start marker not found")
    end_i = text.find(end, start_i)
    if end_i < 0:
        raise SystemExit(f"{label}: end marker not found")
    return text[:start_i] + new.rstrip() + "\\n\\n" + text[end_i:]
'''
          new_region = '''def replace_region(text: str, start: str, end: str, new: str, label: str) -> str:
    start_i = text.find(start)
    if start_i < 0 and start.endswith("(\\n"):
        start_i = text.find(start[:-1])
    if start_i < 0:
        raise SystemExit(f"{label}: start marker not found")
    end_i = text.find(end, start_i)
    if end_i < 0 and end.endswith("(\\n"):
        end_i = text.find(end[:-1], start_i)
    if end_i < 0:
        raise SystemExit(f"{label}: end marker not found")
    return text[:start_i] + new.rstrip() + "\\n\\n" + text[end_i:]
'''
          if text.count(old_region) != 1:
              raise SystemExit('replace_region helper anchor changed')
          text = text.replace(old_region, new_region, 1)

          # Do not rename the legacy wrapper function itself when changing calls.
          text = text.replace(
              'text = text.replace("route_candidates_to_verified_languages(\\n", "route_candidates_to_verified_countries(\\n")',
              'text = text.replace("    route_candidates_to_verified_languages(\\n", "    route_candidates_to_verified_countries(\\n")',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply refactor
        run: python3 .tmp_country_language_refactor.py

      - name: Preserve compatibility edges
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build.py')
          text = path.read_text(encoding='utf-8')

          # The existing audit helper API keeps HU/SK/CZ-style values. The new
          # authoritative language_codes field uses ISO-639-3 separately.
          old = '''def normalize_language_codes(value) -> list[str]:
    """Normalize spoken-language lists to ISO-639-3 while accepting legacy values."""
    return normalize_spoken_language_codes(value)
'''
          new = '''def normalize_language_codes(value) -> list[str]:
    """Normalize legacy audit-language values while preserving their API."""
    if value is None:
        return []
    if isinstance(value, str):
        values = [
            part.strip()
            for part in re.split(r"[,;/+]", value)
            if part.strip()
        ]
    elif isinstance(value, (list, tuple, set)):
        values = list(value)
    else:
        values = [value]
    result: list[str] = []
    for raw in values:
        code = normalize_language_code(str(raw or ""))
        if code and code not in result:
            result.append(code)
    return result
'''
          if text.count(old) != 1:
              raise SystemExit('legacy normalize_language_codes anchor changed')
          text = text.replace(old, new, 1)

          # Modern language_codes are always normalized through the ISO layer.
          text = text.replace(
              'normalize_language_codes(entry.get("language_codes"))',
              'normalize_spoken_language_codes(entry.get("language_codes"))',
          )
          text = text.replace(
              'normalize_language_codes(source.get("language_codes"))',
              'normalize_spoken_language_codes(source.get("language_codes"))',
          )
          text = text.replace(
              'identity_languages = normalize_language_codes(raw_identity_languages)',
              'identity_languages = normalize_spoken_language_codes(raw_identity_languages)',
          )
          text = text.replace(
              '"language_codes": normalize_language_codes(\n                entry.get("language_codes") or expected_codes\n            ),',
              '"language_codes": normalize_spoken_language_codes(\n                entry.get("language_codes") or expected_codes\n            ),',
          )
          text = text.replace(
              'legacy_code = normalize_spoken_language_code(\n                str(item.get("language_code") or "")\n            )',
              'legacy_code = normalize_language_code(\n                str(item.get("language_code") or "")\n            )',
          )

          old_derive = '''    expected = set(expected_codes)
    observed = set(observed_codes)

    if not expected.intersection(observed):
'''
          new_derive = '''    expected = set(normalize_spoken_language_codes(expected_codes))
    observed = set(normalize_spoken_language_codes(observed_codes))

    if not expected.intersection(observed):
'''
          if text.count(old_derive) != 1:
              raise SystemExit('derive_language_match anchor changed')
          text = text.replace(old_derive, new_derive, 1)

          old_accept = '''    supported = normalize_language_codes(
        supported_language_codes
    )

    if language_match in {
'''
          new_accept = '''    supported = normalize_spoken_language_codes(
        supported_language_codes
    )
    observed_supported = normalize_spoken_language_codes(observed_codes)

    if language_match in {
'''
          if text.count(old_accept) != 1:
              raise SystemExit('language acceptance supported anchor changed')
          text = text.replace(old_accept, new_accept, 1)
          text = text.replace(
              'and set(observed_codes).intersection(\n                supported\n            )',
              'and set(observed_supported).intersection(\n                supported\n            )',
              1,
          )

          # Old isolated configs (without the new route table) retain the
          # historical HU/SK/CZ routing behavior. New configs use explicit rules.
          old_route = '''    routed = verified_country_route(
        cfg,
        source_code,
        audit_row.get("observed_language_codes"),
    )
'''
          new_route = '''    if "verified_country_routes" not in cfg:
        return verified_output_language_code(
            audit_row,
            source_code,
            configured_playlist_country_codes(cfg),
        )

    routed = verified_country_route(
        cfg,
        source_code,
        audit_row.get("observed_language_codes"),
    )
'''
          if text.count(old_route) != 1:
              raise SystemExit('verified country route anchor changed')
          text = text.replace(old_route, new_route, 1)
          text = text.replace(
              'observed = normalize_language_codes(audit_row.get("observed_language_codes"))',
              'observed = normalize_spoken_language_codes(audit_row.get("observed_language_codes"))',
              1,
          )

          # Preserve the old make_dashboard call signature; country_stats is an
          # optional new parameter and is derived when old callers omit it.
          old_sig = '''    source_stats: list[dict],
    country_stats: list[dict],
    language_stats: list[dict],
    duplicate_rows: list[dict],
    changes: dict,
    audit_rows: list[dict],
    audit_ambiguity_warnings: list[str],
) -> str:
    """Render the dashboard through the standalone presentation layer."""
    return render_dashboard(
'''
          new_sig = '''    source_stats: list[dict],
    language_stats: list[dict],
    duplicate_rows: list[dict],
    changes: dict,
    audit_rows: list[dict],
    audit_ambiguity_warnings: list[str],
    country_stats: list[dict] | None = None,
) -> str:
    """Render the dashboard through the standalone presentation layer."""
    if country_stats is None:
        country_stats = summarize_country_stats(final_entries, source_stats)
    return render_dashboard(
'''
          if text.count(old_sig) != 1:
              raise SystemExit('make_dashboard compatibility signature anchor changed')
          text = text.replace(old_sig, new_sig, 1)

          path.write_text(text, encoding='utf-8')

          # Keep the canonical identity legacy alias readable while making
          # country_code/language_codes authoritative.
          identity_path = Path('identity_overrides.json')
          identity_data = json.loads(identity_path.read_text(encoding='utf-8'))
          for identity in (identity_data.get('identities') or {}).values():
              if isinstance(identity, dict) and identity.get('country_code') and not identity.get('language_code'):
                  identity['language_code'] = identity['country_code']
          identity_path.write_text(
              json.dumps(identity_data, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Align report regression with separated dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_build.py')
          text = path.read_text(encoding='utf-8')
          old = '''            language_stats = {
                row["language_code"]: row
                for row in report["languages"]
            }

            self.assertEqual(
                language_stats["HU"][
                    "unique_channels"
                ],
                2,
            )

            self.assertEqual(
                language_stats["HU"][
                    "base_channels"
                ],
                1,
            )

            self.assertEqual(
                language_stats["HU"][
                    "added_channels"
                ],
                1,
            )

            self.assertEqual(
                language_stats["SK"][
                    "unique_channels"
                ],
                1,
            )

            self.assertEqual(
                language_stats["SK"][
                    "base_channels"
                ],
                1,
            )
'''
          new = '''            country_stats = {
                row["country_code"]: row
                for row in report["countries"]
            }
            language_stats = {
                row["language_code"]: row
                for row in report["languages"]
            }

            self.assertEqual(
                country_stats["HU"]["unique_channels"],
                2,
            )
            self.assertEqual(
                country_stats["HU"]["base_channels"],
                1,
            )
            self.assertEqual(
                country_stats["HU"]["added_channels"],
                1,
            )
            self.assertEqual(
                country_stats["SK"]["unique_channels"],
                1,
            )
            self.assertEqual(
                country_stats["SK"]["base_channels"],
                1,
            )

            self.assertEqual(
                language_stats["hun"]["unique_channels"],
                2,
            )
            self.assertEqual(
                language_stats["slk"]["unique_channels"],
                1,
            )
'''
          if text.count(old) != 1:
              raise SystemExit('report summary regression anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict build
        run: python3 build.py --strict

      - name: Check diff
        run: git diff --check

      - name: Commit permanent changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .tmp_country_language_refactor.py
          git add build.py country_language.py identity_overrides.py identity_overrides.json config.json dashboard.py templates/dashboard.html README.md docs/country-language-model.md tests
          git commit -m "Separate country from spoken language [country-language-applied]"
          git push origin HEAD:agent/country-language-separation
