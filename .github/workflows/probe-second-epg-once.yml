name: One-time inspect Makó EPG structure

on:
  push:
    branches:
      - agent/audit-epg-health
    paths:
      - ".github/workflows/probe-second-epg-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect Makó weekly schedule
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import html, re

          url = 'https://makotv.hu/heti-musor/'
          req = Request(url, headers={'User-Agent':'Mozilla/5.0 Tomas-IPTV-EPG/1.0'})
          with urlopen(req, timeout=20) as r:
              raw = r.read(600000)
              charset = r.headers.get_content_charset() or 'utf-8'
              text = raw.decode(charset, errors='replace')
          plain = re.sub(r'(?is)<script.*?</script>|<style.*?</style>', ' ', text)
          plain = re.sub(r'(?i)<br\s*/?>|</(?:p|div|tr|td|th|li|h[1-6]|a|span|section|article|button)>', '\n', plain)
          plain = re.sub(r'(?s)<[^>]+>', ' ', plain)
          lines = [' '.join(html.unescape(x).split()) for x in plain.splitlines()]
          lines = [x for x in lines if x]
          for i, line in enumerate(lines):
              if re.search(r'08\.1[0-7]|augusztus 1[0-7]|^\d{1,2}[.:]\d{2}\b', line, re.I):
                  lo = max(0, i - 2)
                  hi = min(len(lines), i + 3)
                  print('CTX', i, lines[lo:hi])
          PY
