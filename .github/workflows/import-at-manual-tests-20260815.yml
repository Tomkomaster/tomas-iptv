name: Import AT manual tests 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-at-manual-tests-20260815.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build current candidate state
        run: python3 -m tools.reliable_build --strict

      - name: Import Austrian manual playback tests
        env:
          AT_TESTS_ZLIB_B64: 
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import base64, csv, io, os, zlib
          from collections import Counter
          from pathlib import Path

          from country_language import normalize_country_code, normalize_language_codes
          from iptv.channel_identity import canonical_stream_url
          from tools.audit_console import exact_index, load_audit, save_result, write_audit

          TESTED_ON = "2026-08-15"
          EXPECTED = 150

          def truthy(v):
              return str(v or "").strip().casefold() in {"1", "true", "yes", "y", "on"}

          def restore_url(v):
              return str(v or "").strip().replace("\\", "/")

          def status(raw, device):
              text = str(raw or "").strip()
              f = text.casefold()
              if f == "ok":
                  return "works", ""
              if f.startswith("ok, but"):
                  return "works_with_warning", text
              if device == "vlc" and f == "just loads":
                  return "loads", text
              if device == "vlc" and f == "skips to the next channel":
                  return "generic_error", text
              if device == "samsung" and f == "not_supported_file":
                  return "format_error", text
              raise RuntimeError(f"Unrecognized {device} result: {text!r}")

          def country(row):
              for field in ("playlist_country_code", "output_country_code", "country_code"):
                  c = normalize_country_code(str(row.get(field) or ""))
                  if c:
                      return c
              return ""

          raw = zlib.decompress(base64.b64decode(os.environ["AT_TESTS_ZLIB_B64"])).decode("utf-8-sig")
          sheet = list(csv.reader(io.StringIO(raw), delimiter="\t"))
          header = [str(x or "").strip() for x in sheet[0]]
          if header[:5] != ["Speaking Language", "Channel", "Source", "VLC", "Samsung"]:
              raise RuntimeError(f"Unexpected header: {header!r}")

          tests = []
          for line_no, row in enumerate(sheet[1:], 2):
              vals = list(row) + [""] * max(0, 6 - len(row))
              scope, channel, source, vlc, samsung, note = vals[:6]
              if not any(str(x or "").strip() for x in vals):
                  continue
              if str(scope or "").strip().upper() != "AT":
                  raise RuntimeError(f"Line {line_no}: expected AT, got {scope!r}")
              url = restore_url(source)
              if not channel.strip() or not url:
                  raise RuntimeError(f"Line {line_no}: missing channel or URL")
              tests.append({
                  "line": line_no, "channel": channel.strip(), "url": url,
                  "vlc": vlc.strip(), "samsung": samsung.strip(), "notes": note.strip()
              })

          if len(tests) != EXPECTED:
              raise RuntimeError(f"Expected {EXPECTED} test rows, found {len(tests)}")
          keys = [canonical_stream_url(x["url"]) for x in tests]
          dupes = [k for k, n in Counter(keys).items() if n > 1]
          if dupes:
              raise RuntimeError("Duplicate tested URLs: " + ", ".join(dupes))

          generated_path = Path("public/audit.csv")
          if not generated_path.is_file():
              raise RuntimeError("public/audit.csv missing after reliable build")
          with generated_path.open("r", encoding="utf-8-sig", newline="") as f:
              generated_rows = [dict(r) for r in csv.DictReader(f)]

          groups = {}
          for r in generated_rows:
              if country(r) != "AT":
                  continue
              url = str(r.get("stream_url") or "").strip()
              if url:
                  groups.setdefault(canonical_stream_url(url), []).append(r)

          generated = {}
          for key, candidates in groups.items():
              current = [r for r in candidates if truthy(r.get("in_playlist"))]
              if len(current) == 1:
                  generated[key] = current[0]
              elif len(current) > 1:
                  raise RuntimeError(f"Multiple current AT rows share {key}")
              elif len(candidates) == 1:
                  generated[key] = candidates[0]
              else:
                  raise RuntimeError(f"Multiple historical AT rows share {key}")

          audit_path = Path("audit.json")
          payload = load_audit(audit_path)
          old_idx = exact_index(payload)
          pairs = Counter()
          unmatched = []
          renamed = []

          for t in tests:
              key = canonical_stream_url(t["url"])
              g = generated.get(key)
              old = old_idx.get(key, (None, {}))[1] or {}
              if g is None:
                  unmatched.append(f"line {t['line']}: {t['channel']} | {t['url']}")
                  row = {
                      "channel": t["channel"], "stream_url": t["url"],
                      "playlist_country_code": "AT", "country_code": "AT"
                  }
              else:
                  row = dict(g)
                  row["stream_url"] = t["url"]
                  gname = str(g.get("channel") or "").strip()
                  if gname and gname != t["channel"]:
                      renamed.append(f"{t['channel']} -> {gname} ({t['url']})")

              vlc, vlc_note = status(t["vlc"], "vlc")
              samsung, samsung_note = status(t["samsung"], "samsung")
              pairs[(vlc, samsung)] += 1
              observed = normalize_language_codes(old.get("observed_language_codes"))
              general_note = t["notes"] or str(old.get("notes") or "").strip()
              form = {
                  "vlc": [vlc], "samsung": [samsung],
                  "vlc_note": [vlc_note], "samsung_note": [samsung_note],
                  "notes": [general_note], "language": observed,
                  "source_type": ["Unknown"], "recalculate_decision": ["1"]
              }
              payload = save_result(payload, row, form, tested_on=TESTED_ON)

          write_audit(audit_path, payload)
          print(f"Imported {len(tests)} Austrian manual playback tests.")
          for (v, s), n in sorted(pairs.items()):
              print(f"  {v:20s} / {s:20s}: {n}")
          if unmatched:
              print(f"WARNING: {len(unmatched)} URLs were not generated this run; saved as exact historical audit rows.")
              for x in unmatched:
                  print("  -", x)
          else:
              print("All 150 tested URLs matched generated Austrian audit rows.")
          if renamed:
              print(f"{len(renamed)} sheet labels differed from generated identity; exact URL identity was retained.")
              for x in renamed:
                  print("  -", x)

          PY

      - name: Validate audit and project
        run: |
          python3 -m json.tool audit.json > /dev/null
          python3 run_tests.py
          python3 -m tools.reliable_build --strict

      - name: Commit AT audit results and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git rm .github/workflows/import-at-manual-tests-20260815.yml
          git commit -m "Record Austrian manual playback tests"
          git push origin HEAD:main
