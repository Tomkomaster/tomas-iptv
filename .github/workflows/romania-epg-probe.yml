name: Probe Romania EPG overrides

on:
  push:
    branches:
      - agent/expand-romania-epg

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest

    env:
      IPTV_ORG_EPG_REV: "15965406e3d950433788a085a15ab256a8e0035d"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run project tests
        run: python3 run_tests.py

      - name: Build stable playlists
        run: python3 -m tools.reliable_build --strict

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Clone pinned IPTV-org EPG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epg-builder
          mkdir .epg-builder
          git -C .epg-builder init
          git -C .epg-builder remote add origin https://github.com/iptv-org/epg.git
          git -C .epg-builder fetch --depth 1 origin "$IPTV_ORG_EPG_REV"
          git -C .epg-builder checkout --detach FETCH_HEAD
          test "$(git -C .epg-builder rev-parse HEAD)" = "$IPTV_ORG_EPG_REV"
          cd .epg-builder
          npm ci

      - name: Prepare Romanian provider mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 -m epg.epg_prepare \
            --playlist public/ro.m3u \
            --epg-root .epg-builder \
            --sites programetv.ro \
            --output .ro-epg.channels.xml \
            --report .ro-epg.mapping.json
          cat .ro-epg.channels.xml

      - name: Grab Romanian Programetv guide
        shell: bash
        run: |
          set -euo pipefail
          cd .epg-builder
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.ro-epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.ro-epg.xml" \
            --maxConnections=3 \
            2>&1 | tee "$GITHUB_WORKSPACE/.ro-epg-grab.log"

      - name: Report audited target results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          targets = [
              "Antena3CNN.ro",
              "TVSE.ro@SD",
              "TeleMoldovaPlus.ro@SD",
              "Telestar1.ro@SD",
          ]

          mapping = json.loads(Path(".ro-epg.mapping.json").read_text(encoding="utf-8"))
          mapped = {item.get("tvg_id"): item for item in mapping.get("matched", [])}
          root = ET.parse(".ro-epg.xml").getroot()
          counts = Counter(
              (programme.get("channel") or "").strip()
              for programme in root.findall("programme")
          )

          print("Romania audited target results:")
          for target in targets:
              item = mapped.get(target) or {}
              print(
                  f"- {target}: mapped={bool(item)}, "
                  f"site_id={item.get('provider_name', '')!r}, "
                  f"programmes={counts.get(target, 0)}"
              )

          successful = [target for target in targets if counts.get(target, 0) > 0]
          print(f"Targets with programme data: {len(successful)}/{len(targets)}")
          print("Successful targets: " + ", ".join(successful))
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: romania-epg-probe
          path: |
            .ro-epg.channels.xml
            .ro-epg.mapping.json
            .ro-epg.xml
            .ro-epg-grab.log
            public/ro.m3u
