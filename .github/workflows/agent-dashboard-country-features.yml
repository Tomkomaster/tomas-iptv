name: Dashboard country operations

on:
  push:
    branches:
      - agent/dashboard-country-operations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply dashboard feature patch
        run: python3 tools/agent_dashboard_country_features.py

      - name: Check JavaScript syntax
        run: node --check static/dashboard.js

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run strict playlist build
        run: python3 build.py --strict

      - name: Generate research exports
        run: python3 research_exports.py --public-dir public --priority-policy research_priority.json

      - name: Verify generated dashboard assets
        run: |
          git diff --check
          grep -q 'Conflicting identities' public/index.html
          grep -q 'Candidate streams to test' public/index.html
          grep -q 'Source contribution and yield' public/index.html
          grep -q 'data-country-tab="CZ"' public/index.html
          grep -q 'static/dashboard.js' public/index.html
          test -f public/static/dashboard.js
          test -f public/missing.csv
          test -f public/research.csv

      - name: Commit dashboard feature bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py templates/dashboard.html static/dashboard.css static/dashboard.js healthcheck.py attention.py tests/test_dashboard_operational_features.py
          if git diff --cached --quiet; then
            echo "No permanent changes to commit."
            exit 0
          fi
          git commit -m "Add country-aware dashboard operations"
          git push
