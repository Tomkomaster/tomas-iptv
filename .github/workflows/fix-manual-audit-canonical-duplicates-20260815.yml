name: Fix 2026-08-15 audit canonical duplicates

on:
  push:
    branches:
      - main
    paths:
      - tools/fix_manual_audit_canonical_duplicates_20260815.py
      - .github/workflows/fix-manual-audit-canonical-duplicates-20260815.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Repair canonical audit duplicates
        run: python3 tools/fix_manual_audit_canonical_duplicates_20260815.py

      - name: Validate JSON
        run: python3 -m json.tool audit.json > /dev/null

      - name: Run tests
        run: python3 run_tests.py

      - name: Commit repaired audit and remove one-off helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git rm tools/fix_manual_audit_canonical_duplicates_20260815.py
          git rm .github/workflows/fix-manual-audit-canonical-duplicates-20260815.yml
          git commit -m "Fix canonical duplicate in manual playback audit"
          git push origin HEAD:main

      - name: Trigger clean playlist build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-and-publish.yml --ref main
