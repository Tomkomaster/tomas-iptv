name: Temporary record five SK successes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-five-sk-successes-2026-08-22
          fetch-depth: 0

      - name: Record exact manual playback results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          tests = [
              ('JOJ Cinema', 'JOJCinema.sk', 'http://88.212.15.50/live/test_joj_cinema_25p/playlist.m3u8', None),
              ('FILMBOX+ One', None, 'http://88.212.15.50/live/test_filmbox/playlist.m3u8', 'Playback identity confirmed by the user from the on-channel FILMBOX+ One logo.'),
              ('Nova Sport 3 SK', None, 'http://185.188.188.237:5000/live/novasport3/playlist.m3u8', None),
              ('Nova Sport 4 SK', None, 'http://185.188.188.237:5000/live/novasport4/playlist.m3u8', None),
              ('Nova Sport 5 SK', None, 'http://185.188.188.237:5000/live/novasport5/playlist.m3u8', None),
          ]

          audit_path = Path('audit.json')
          payload = json.loads(audit_path.read_text(encoding='utf-8'))
          rows = payload['channels']
          by_url = {}
          for row in rows:
              url = str(row.get('stream_url') or '').strip()
              if url:
                  if url in by_url:
                      raise SystemExit(f'Duplicate exact audit URL before update: {url}')
                  by_url[url] = row

          added = updated = 0
          for channel, tvg_id, url, identity_note in tests:
              row = by_url.get(url)
              if row is None:
                  row = {'channel': channel, 'stream_url': url}
                  rows.append(row)
                  by_url[url] = row
                  added += 1
              else:
                  updated += 1

              row['channel'] = channel
              row['stream_url'] = url
              if tvg_id:
                  row['tvg_id'] = tvg_id
              row['playlist_country_code'] = 'SK'
              row['output_country_code'] = 'SK'
              # The user verified playback and, for FILMBOX+ One, visual identity.
              # Do not invent spoken-language evidence that was not reported.
              row.pop('observed_language_codes', None)
              row.pop('language_match', None)
              row['vlc'] = 'works'
              row['samsung'] = 'works'
              row['vlc_note'] = 'ok'
              row['samsung_note'] = 'ok'
              row.pop('decision', None)
              row.pop('reason', None)
              notes = ['Passed both manual playback tests.']
              if identity_note:
                  notes.append(identity_note)
              row['notes'] = ' '.join(notes)
              row['exclude_from_playlist'] = False
              row['tested_on'] = '2026-08-22'
              row['provenance'] = 'User-provided manual playback result'
              row['discovery'] = 'Manual PC + Samsung test supplied 2026-08-22'

          audit_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          wanted_path = Path('data/wanted_channels_sk.json')
          wanted = json.loads(wanted_path.read_text(encoding='utf-8'))
          solved = {'JOJ Cinema', 'FILMBOX+ One', 'Nova Sport 3 SK', 'Nova Sport 4 SK', 'Nova Sport 5 SK'}
          before = len(wanted['channels'])
          wanted['channels'] = [r for r in wanted['channels'] if r.get('channel') not in solved]
          removed = before - len(wanted['channels'])
          if removed != 5:
              raise SystemExit(f'Expected to remove exactly 5 solved SK wanted rows, removed {removed}')
          wanted_path.write_text(json.dumps(wanted, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          final = json.loads(audit_path.read_text(encoding='utf-8'))['channels']
          lookup = {r.get('stream_url'): r for r in final}
          for _, _, url, _ in tests:
              row = lookup[url]
              if row.get('exclude_from_playlist') is not False:
                  raise SystemExit(f'Working result not explicitly retained: {url}')
              if row.get('vlc') != 'works' or row.get('samsung') != 'works':
                  raise SystemExit(f'Working result not preserved: {url}')

          remaining = {r.get('channel') for r in json.loads(wanted_path.read_text(encoding='utf-8'))['channels']}
          leftover = solved & remaining
          if leftover:
              raise SystemExit(f'Solved wanted channels remain: {sorted(leftover)}')

          print(f'Recorded 5 dual-device successes ({added} new audit rows, {updated} updated) and removed 5 wanted targets.')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json data/wanted_channels_sk.json
          git commit -m "Record five Slovak playback successes"
          git push origin HEAD:record-five-sk-successes-2026-08-22
