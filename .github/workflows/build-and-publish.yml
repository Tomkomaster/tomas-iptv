name: Build and publish IPTV playlist

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "23 4 * * *"
      timezone: "Europe/Bratislava"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Pin the IPTV-org EPG repository itself; npm ci only pins its npm tree.
  IPTV_ORG_EPG_REV: "15965406e3d950433788a085a15ab256a8e0035d"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build IPTV playlist
        run: python3 build.py --strict

      - name: Generate research exports
        run: python3 research_exports.py

      - name: Check stable stream health
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_ENABLED="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          print("true" if (cfg.get("health") or {}).get("enabled", True) else "false")
          '
          )"

          if [ "$HEALTH_ENABLED" != "true" ]; then
            echo "Automated stream health disabled in config.json; skipping."
            exit 0
          fi

          python3 healthcheck.py

      - name: Set up Node.js for EPG
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build XMLTV EPG
        shell: bash
        run: |
          set -euo pipefail

          EPG_ENABLED="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          print("true" if (cfg.get("epg") or {}).get("enabled") else "false")
          '
          )"

          if [ "$EPG_ENABLED" != "true" ]; then
            echo "EPG disabled in config.json; skipping."
            exit 0
          fi

          EPG_MAX_CONNECTIONS="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          print(int((cfg.get("epg") or {}).get("max_connections") or 3))
          '
          )"

          EPG_FUTURE_DAYS="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          epg = cfg.get("epg") or {}
          print(int(epg.get("future_days") or 7))
          '
          )"

          rm -rf .epg-builder .epg-external
          rm -f \
            .epg.channels.xml \
            .epg-iptv.xml \
            .epg-iptv-coverage.json \
            .epg-grab.log

          mkdir .epg-builder
          git -C .epg-builder init
          git -C .epg-builder remote add origin https://github.com/iptv-org/epg.git
          git -C .epg-builder fetch --depth 1 origin "$IPTV_ORG_EPG_REV"
          git -C .epg-builder checkout --detach FETCH_HEAD

          EPG_ACTUAL_REV="$(git -C .epg-builder rev-parse HEAD)"
          if [ "$EPG_ACTUAL_REV" != "$IPTV_ORG_EPG_REV" ]; then
            echo "ERROR: expected IPTV-org/epg $IPTV_ORG_EPG_REV but checked out $EPG_ACTUAL_REV" >&2
            exit 1
          fi
          echo "Using pinned IPTV-org/epg revision: $EPG_ACTUAL_REV"

          cd .epg-builder
          npm ci
          cd "$GITHUB_WORKSPACE"

          python3 epg_country_prepare.py \
            --config config.json \
            --epg-root .epg-builder \
            --output .epg.channels.xml \
            --report .epg-iptv-coverage.json

          echo
          echo "Custom IPTV-org EPG channel list:"
          cat .epg.channels.xml
          echo

          cd .epg-builder

          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.epg-iptv.xml" \
            --maxConnections="$EPG_MAX_CONNECTIONS" \
            2>&1 | tee "$GITHUB_WORKSPACE/.epg-grab.log"

          cd "$GITHUB_WORKSPACE"

          mkdir -p .epg-external
          python3 - <<'PY' > .epg-external/sources.tsv
          import json
          from pathlib import Path

          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          for raw_code, raw_country in ((cfg.get("epg") or {}).get("countries") or {}).items():
              code = str(raw_code or "").strip().upper()
              country = raw_country if isinstance(raw_country, dict) else {}
              external = country.get("external") or {}
              if not isinstance(external, dict):
                  continue
              url = str(external.get("url") or "").strip()
              provider = str(external.get("provider") or "epgshare01.online").strip()
              if code and url:
                  print(f"{code}\t{provider}\t{url}")
          PY

          while IFS=$'\t' read -r code provider url; do
            [ -n "$code" ] || continue
            target=".epg-external/${code}.xml.gz"
            echo "Downloading external EPG source for ${code}: ${provider}"
            if ! curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              "$url" \
              -o "$target"; then
              echo "WARNING: external EPG download failed for ${code}; continuing with IPTV-org fallbacks for that country."
              rm -f "$target"
            fi
          done < .epg-external/sources.tsv

          python3 epg_multi_merge.py \
            --config config.json \
            --iptv-guide .epg-iptv.xml \
            --iptv-coverage .epg-iptv-coverage.json \
            --external-dir .epg-external \
            --preferred-iptv-provider mediaklikk.hu \
            --future-days "$EPG_FUTURE_DAYS" \
            --output public/guide.xml \
            --report public/epg-coverage.json

          python3 local_epg.py \
            --playlist public/tv.m3u \
            --guide public/guide.xml \
            --coverage public/epg-coverage.json \
            --report public/local-epg.json \
            --future-days "$EPG_FUTURE_DAYS"

      - name: Validate XMLTV EPG
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          from collections import Counter
          from pathlib import Path

          from epg_prepare import read_playlist_tvg_ids


          cfg = json.loads(
              Path("config.json").read_text(
                  encoding="utf-8"
              )
          )

          epg = cfg.get("epg") or {}

          if not epg.get("enabled"):
              print(
                  "EPG disabled; "
                  "validation skipped."
              )
              raise SystemExit(0)


          guide_path = Path(
              "public/guide.xml"
          )

          coverage_path = Path(
              "public/epg-coverage.json"
          )

          playlist_path = Path(
              "public/tv.m3u"
          )


          if not guide_path.is_file():
              raise SystemExit(
                  "EPG generation failed: "
                  "public/guide.xml "
                  "does not exist."
              )

          if guide_path.stat().st_size == 0:
              raise SystemExit(
                  "EPG generation failed: "
                  "guide.xml is empty."
              )

          if not coverage_path.is_file():
              raise SystemExit(
                  "EPG generation failed: "
                  "public/epg-coverage.json "
                  "does not exist."
              )


          tree = ET.parse(
              guide_path
          )

          root = tree.getroot()

          if root.tag != "tv":
              raise SystemExit(
                  "Invalid XMLTV root "
                  f"element: {root.tag!r}"
              )


          channels = root.findall(
              "channel"
          )

          programmes = root.findall(
              "programme"
          )


          if not channels:
              raise SystemExit(
                  "EPG contains no "
                  "XMLTV channels."
              )

          if not programmes:
              raise SystemExit(
                  "EPG contains no "
                  "programmes."
              )


          channel_ids = [
              (
                  channel.get("id")
                  or ""
              ).strip()
              for channel
              in channels
          ]

          empty_channel_ids = [
              channel_id
              for channel_id
              in channel_ids
              if not channel_id
          ]

          if empty_channel_ids:
              raise SystemExit(
                  "EPG contains a "
                  "channel without an ID."
              )


          counts = Counter(
              channel_ids
          )

          duplicate_ids = sorted(
              channel_id
              for channel_id, count
              in counts.items()
              if count > 1
          )

          if duplicate_ids:
              raise SystemExit(
                  "EPG contains duplicate "
                  "channel IDs: "
                  + ", ".join(
                      duplicate_ids[:20]
                  )
              )


          playlist_ids = set(
              read_playlist_tvg_ids(
                  playlist_path
              )
          )

          guide_ids = set(
              channel_ids
          )


          unexpected_ids = sorted(
              guide_ids
              - playlist_ids
          )

          if unexpected_ids:
              raise SystemExit(
                  "EPG contains channels "
                  "that are not present "
                  "in tv.m3u: "
                  + ", ".join(
                      unexpected_ids[:20]
                  )
              )


          programme_channel_ids = {
              (
                  programme.get(
                      "channel"
                  )
                  or ""
              ).strip()
              for programme
              in programmes
              if (
                  programme.get(
                      "channel"
                  )
                  or ""
              ).strip()
          }


          orphan_programmes = sorted(
              programme_channel_ids
              - guide_ids
          )

          if orphan_programmes:
              raise SystemExit(
                  "EPG contains programmes "
                  "for unknown channel IDs: "
                  + ", ".join(
                      orphan_programmes[:20]
                  )
              )


          playlist_with_programmes = (
              playlist_ids
              & programme_channel_ids
          )

          if not playlist_with_programmes:
              raise SystemExit(
                  "EPG contains no "
                  "programme data matching "
                  "the generated playlist."
              )


          coverage = json.loads(
              coverage_path.read_text(
                  encoding="utf-8"
              )
          )


          print(
              "EPG OK: "
              f"{len(channels)} channels, "
              f"{len(programmes)} programmes, "
              f"{len(playlist_with_programmes)} "
              "playlist channels with "
              "programme data, "
              f"{guide_path.stat().st_size:,} "
              "bytes."
          )

          print(
              "EPG mapping coverage: "
              f"{coverage.get('matched_tvg_ids', 0)}"
              "/"
              f"{coverage.get('playlist_tvg_ids', 0)} "
              "("
              f"{coverage.get('mapping_coverage_percent', 0)}%"
              ")."
          )

          unmatched = (
              coverage.get(
                  "unmatched_tvg_ids"
              )
              or []
          )

          if unmatched:
              print(
                  "Playlist tvg-id values "
                  "without EPG mapping:"
              )

              for tvg_id in unmatched:
                  print(
                      f"  - {tvg_id}"
                  )
          PY

      - name: Analyze actual EPG health
        shell: bash
        run: |
          set -euo pipefail

          EPG_ENABLED="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          print("true" if (cfg.get("epg") or {}).get("enabled") else "false")
          '
          )"

          if [ "$EPG_ENABLED" != "true" ]; then
            echo "EPG disabled; health analysis skipped."
            exit 0
          fi

          python3 epg_health.py \
            --coverage public/epg-coverage.json \
            --guide public/guide.xml \
            --grab-log .epg-grab.log \
            --output public/epg-health.json

      - name: Build needs attention queue
        shell: bash
        run: |
          set -euo pipefail
          python3 attention.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/attention.json")
          if not path.is_file():
              raise SystemExit("attention.json was not generated.")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("advisory_only") is not True:
              raise SystemExit("attention.json must remain advisory only.")

          summary = data.get("summary") or {}
          print(
              "Attention queue: "
              f"{summary.get('items', 0)} items; "
              f"{summary.get('critical', 0)} critical, "
              f"{summary.get('high', 0)} high, "
              f"{summary.get('medium', 0)} medium, "
              f"{summary.get('low', 0)} low."
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
