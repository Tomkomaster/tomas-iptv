name: Build and publish IPTV playlist

on:
  push:
    branches:
      - main
    paths:
      - "build.py"
      - "epg_prepare.py"
      - "config.json"
      - "audit.json"
      - "extras/**"
      - "tests/**"
      - ".github/workflows/build-and-publish.yml"

  workflow_dispatch:

  schedule:
    - cron: "23 4 * * *"
      timezone: "Europe/Bratislava"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build IPTV playlist
        run: python3 build.py

      - name: Set up Node.js for EPG
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build XMLTV EPG
        shell: bash
        run: |
          set -euo pipefail

          EPG_ENABLED="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          print("true" if (cfg.get("epg") or {}).get("enabled") else "false")
          '
          )"

          if [ "$EPG_ENABLED" != "true" ]; then
            echo "EPG disabled in config.json; skipping."
            exit 0
          fi

          EPG_SITES="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          sites = (cfg.get("epg") or {}).get("sites") or []
          print(",".join(str(site).strip() for site in sites if str(site).strip()))
          '
          )"

          EPG_MAX_CONNECTIONS="$(
            python3 -c '
          import json
          from pathlib import Path
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          print(int((cfg.get("epg") or {}).get("max_connections") or 3))
          '
          )"

          if [ -z "$EPG_SITES" ]; then
            echo "EPG is enabled but epg.sites is empty."
            exit 1
          fi

          rm -rf .epg-builder
          rm -f .epg.channels.xml

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/iptv-org/epg.git \
            .epg-builder

          cd .epg-builder
          npm ci
          cd "$GITHUB_WORKSPACE"

          python3 epg_prepare.py \
            --playlist public/tv.m3u \
            --epg-root .epg-builder \
            --sites "$EPG_SITES" \
            --output .epg.channels.xml \
            --report public/epg-coverage.json

          echo
          echo "Custom EPG channel list:"
          cat .epg.channels.xml
          echo

          cd .epg-builder

          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/public/guide.xml" \
            --maxConnections="$EPG_MAX_CONNECTIONS"

      - name: Validate XMLTV EPG
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          from collections import Counter
          from pathlib import Path

          from epg_prepare import read_playlist_tvg_ids


          cfg = json.loads(
              Path("config.json").read_text(
                  encoding="utf-8"
              )
          )

          epg = cfg.get("epg") or {}

          if not epg.get("enabled"):
              print(
                  "EPG disabled; "
                  "validation skipped."
              )
              raise SystemExit(0)


          guide_path = Path(
              "public/guide.xml"
          )

          coverage_path = Path(
              "public/epg-coverage.json"
          )

          playlist_path = Path(
              "public/tv.m3u"
          )


          if not guide_path.is_file():
              raise SystemExit(
                  "EPG generation failed: "
                  "public/guide.xml "
                  "does not exist."
              )

          if guide_path.stat().st_size == 0:
              raise SystemExit(
                  "EPG generation failed: "
                  "guide.xml is empty."
              )

          if not coverage_path.is_file():
              raise SystemExit(
                  "EPG generation failed: "
                  "public/epg-coverage.json "
                  "does not exist."
              )


          tree = ET.parse(
              guide_path
          )

          root = tree.getroot()

          if root.tag != "tv":
              raise SystemExit(
                  "Invalid XMLTV root "
                  f"element: {root.tag!r}"
              )


          channels = root.findall(
              "channel"
          )

          programmes = root.findall(
              "programme"
          )


          if not channels:
              raise SystemExit(
                  "EPG contains no "
                  "XMLTV channels."
              )

          if not programmes:
              raise SystemExit(
                  "EPG contains no "
                  "programmes."
              )


          channel_ids = [
              (
                  channel.get("id")
                  or ""
              ).strip()
              for channel
              in channels
          ]

          empty_channel_ids = [
              channel_id
              for channel_id
              in channel_ids
              if not channel_id
          ]

          if empty_channel_ids:
              raise SystemExit(
                  "EPG contains a "
                  "channel without an ID."
              )


          counts = Counter(
              channel_ids
          )

          duplicate_ids = sorted(
              channel_id
              for channel_id, count
              in counts.items()
              if count > 1
          )

          if duplicate_ids:
              raise SystemExit(
                  "EPG contains duplicate "
                  "channel IDs: "
                  + ", ".join(
                      duplicate_ids[:20]
                  )
              )


          playlist_ids = set(
              read_playlist_tvg_ids(
                  playlist_path
              )
          )

          guide_ids = set(
              channel_ids
          )


          unexpected_ids = sorted(
              guide_ids
              - playlist_ids
          )

          if unexpected_ids:
              raise SystemExit(
                  "EPG contains channels "
                  "that are not present "
                  "in tv.m3u: "
                  + ", ".join(
                      unexpected_ids[:20]
                  )
              )


          programme_channel_ids = {
              (
                  programme.get(
                      "channel"
                  )
                  or ""
              ).strip()
              for programme
              in programmes
              if (
                  programme.get(
                      "channel"
                  )
                  or ""
              ).strip()
          }


          orphan_programmes = sorted(
              programme_channel_ids
              - guide_ids
          )

          if orphan_programmes:
              raise SystemExit(
                  "EPG contains programmes "
                  "for unknown channel IDs: "
                  + ", ".join(
                      orphan_programmes[:20]
                  )
              )


          playlist_with_programmes = (
              playlist_ids
              & programme_channel_ids
          )

          if not playlist_with_programmes:
              raise SystemExit(
                  "EPG contains no "
                  "programme data matching "
                  "the generated playlist."
              )


          coverage = json.loads(
              coverage_path.read_text(
                  encoding="utf-8"
              )
          )


          print(
              "EPG OK: "
              f"{len(channels)} channels, "
              f"{len(programmes)} programmes, "
              f"{len(playlist_with_programmes)} "
              "playlist channels with "
              "programme data, "
              f"{guide_path.stat().st_size:,} "
              "bytes."
          )

          print(
              "EPG mapping coverage: "
              f"{coverage.get('matched_tvg_ids', 0)}"
              "/"
              f"{coverage.get('playlist_tvg_ids', 0)} "
              "("
              f"{coverage.get('mapping_coverage_percent', 0)}%"
              ")."
          )

          unmatched = (
              coverage.get(
                  "unmatched_tvg_ids"
              )
              or []
          )

          if unmatched:
              print(
                  "Playlist tvg-id values "
                  "without EPG mapping:"
              )

              for tvg_id in unmatched:
                  print(
                      f"  - {tvg_id}"
                  )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
