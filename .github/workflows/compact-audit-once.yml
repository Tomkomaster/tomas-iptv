name: One-time audit formatting cleanup

on:
  push:
    branches:
      - "agent/migrate-safe-legacy-audits"
    paths:
      - ".github/workflows/compact-audit-once.yml"

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/migrate-safe-legacy-audits
          fetch-depth: 0

      - name: Restore compact language-array formatting
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("audit.json")
          before_text = path.read_text(encoding="utf-8")
          before_data = json.loads(before_text)
          lines = before_text.splitlines()
          output = []
          count = 0
          index = 0

          opener = re.compile(
              r'^(?P<indent>\s*)"(?P<key>expected_language_codes|observed_language_codes)": \[$'
          )

          while index < len(lines):
              line = lines[index]
              match = opener.match(line)
              if not match:
                  output.append(line)
                  index += 1
                  continue

              values = []
              cursor = index + 1
              while cursor < len(lines):
                  stripped = lines[cursor].strip()
                  if stripped in {']', '],'}:
                      break
                  if stripped:
                      value_text = stripped[:-1] if stripped.endswith(',') else stripped
                      values.append(json.loads(value_text))
                  cursor += 1

              if cursor >= len(lines):
                  raise SystemExit(
                      f"Unclosed {match.group('key')} array at line {index + 1}."
                  )

              comma = ',' if lines[cursor].strip() == '],' else ''
              output.append(
                  f'{match.group("indent")}"{match.group("key")}": '
                  + json.dumps(values, ensure_ascii=False)
                  + comma
              )
              count += 1
              index = cursor + 1

          after_text = "\n".join(output) + ("\n" if before_text.endswith("\n") else "")
          after_data = json.loads(after_text)
          if after_data != before_data:
              raise SystemExit("Formatting cleanup changed audit JSON semantics.")

          print(f"Compacted {count} language arrays without changing JSON data.")
          path.write_text(after_text, encoding="utf-8")
          PY

      - name: Validate strict build and tests
        run: |
          set -euo pipefail
          python3 build.py --strict
          python3 -m unittest discover -s tests -v
          git diff --check -- audit.json

      - name: Commit audit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- audit.json; then
            echo "No formatting cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json
          git commit -m "Preserve compact audit language arrays"
          git push origin HEAD:agent/migrate-safe-legacy-audits
