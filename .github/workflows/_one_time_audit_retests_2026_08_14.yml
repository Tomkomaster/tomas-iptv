name: Apply August 14 audit retests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_one_time_audit_retests_2026_08_14.yml

permissions:
  contents: write

jobs:
  update-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply manual playback retests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          from iptv.audit_storage import compact_manual_audit_payload
          from iptv.channel_identity import canonical_stream_url

          AUDIT = Path("audit.json")
          TESTED_ON = "2026-08-14"

          # channel, exact stream URL, observed language, VLC status, Samsung status,
          # VLC note, Samsung note, optional general note
          RETESTS = [
              ("Current Time TV", "http://stream.mcquack.net/384/index.m3u8", "rus", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("History 2", "http://88.212.15.19/live/test_h2/playlist.m3u8", "ces", "works", "works", "ok", "ok", None),
              ("Mňau TV", "https://5ca49f2417d90.streamlock.net/mnau/livestream/playlist.m3u8", "ces", "works", "works", "ok", "ok", None),
              ("Óčko", "https://ocko-live.ssl.cdn.cra.cz/channels/ocko/playlist.m3u8", "ces", "works", "works", "ok", "ok", None),
              ("Óčko Expres", "https://ocko-live.ssl.cdn.cra.cz/channels/ocko_expres/playlist.m3u8", "ces", "works", "works", "ok", "ok", None),
              ("Óčko Gold", "https://ocko-live.ssl.cdn.cra.cz/channels/ocko_gold/playlist.m3u8", "ces", "works", "works", "ok", "ok", None),
              ("Óčko Gold Feed 2", "https://ocko-live.ssl.cdn.cra.cz/cra_live2/ocko_gold.stream.1.smil/playlist.m3u8", "ces", "generic_error", "generic_error", "Immediately skips to next channel", "Immediately skips to next channel", None),
              ("Current Time TV Feed 2", "https://rfe-ingest.akamaized.net/hls/live/2033043/tvmc05/master.m3u8", "rus", "works", "works", "ok", "ok", None),
              ("Alföld TV", "https://cloudfront41.lexanetwork.com:1344/relay01/livestream006.sdp/playlist.m3u8", "hun", "works", "works", "ok", "ok", None),
              ("AXN White", "http://315e5a5d.ottrast.com/iptv/MM4E93NGF5LADZ/6950/index.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("AXN White Test", "https://t.freetv.fun/live/axn-white.m3u8", "ron", "works", "works", "ok", "ok", "Both on PC and Samsung it says that the channel has been interrupted."),
              ("Budapest Európa Televízió", "https://cloudfront44.lexanetwork.com:1344/freerelay/bpetv.sdp/playlist.m3u8", "hun", "works", "works", "ok", "ok", None),
              ("EBS", "https://streams.prd.commavservices.eu/live/ebs/index.m3u8", "hun", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("EBS Plus", "https://streams.prd.commavservices.eu/live/ebsplus/index.m3u8", "hun", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("RTG int.", "http://213.91.179.28:8000/play/a0bw", "ron", "works", "works", "ok", "ok", None),
              ("RTV 1 Vajdaság", "http://212.200.230.50:1935/RTV/rtv1/playlist.m3u8", "ron", "works", "works", "ok", "ok", "Channel logo is PTB 1"),
              ("RTV 2 Vajdaság", "http://212.200.230.50:1935/RTV/rtv2/playlist.m3u8", "ron", "works", "works", "ok", "ok", "Channel logo is RTV 2"),
              ("Tatai TV", "https://cloudfront44.lexanetwork.com:1344/relay01/broadcast006.sdp/playlist.m3u8", "hun", "works", "works", "ok", "ok", None),
              ("Bollywood HD Russia", "https://xykt-fix.github.io/cinerama_edge01/hls/BOLLYWOOD_RU/Movie009.m3u8", "ron", "works", "works", "ok", "ok", None),
              ("Digi Sport 1", "https://7nyaler.streamhostingcdn.top/stream/79/index.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("Impact TV", "https://live.tvimpact.ro:8088/hevc/index.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("Kiss TV", "https://tv.broadcasting.ro/kisstv/a629c031-2170-4ee9-a36d-87a891aa3131.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("Magic TV", "https://tv.broadcasting.ro/magictv/925f90db-5c88-4190-a53d-5163cdffe6f4.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("Rock TV", "https://tv.broadcasting.ro/rocktv/85c83a80-4f71-4f2d-a8d6-43f676896bcb.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("SperantaTV", "https://jstre.am/live/jsl:2gNjpghXRLE.m3u8", "ron", "works", "format_error", "ok", "NOT_SUPPORTED_FILE", None),
              ("TV Buzau", "http://78.96.33.89:8080", "ron", "works", "loads", "ok", "just loads", None),
              ("Prima SK", "http://88.212.15.19/live/test_prima_plus_25p/playlist.m3u8", "slk", "works", "works", "ok", "ok", None),
          ]

          payload = compact_manual_audit_payload(json.loads(AUDIT.read_text(encoding="utf-8-sig")))
          channels = list(payload.get("channels") or [])
          index = {}
          for pos, item in enumerate(channels):
              url = str(item.get("stream_url") or "").strip()
              if not url:
                  continue
              key = canonical_stream_url(url)
              if key in index:
                  raise SystemExit(f"Duplicate audit URL before update: {url}")
              index[key] = pos

          missing = []
          updated_names = []
          for display_name, url, language, vlc, samsung, vlc_note, samsung_note, note in RETESTS:
              key = canonical_stream_url(url)
              pos = index.get(key)
              if pos is None:
                  missing.append(f"{display_name}: {url}")
                  continue

              item = dict(channels[pos])
              item["observed_language_codes"] = [language]
              item["vlc"] = vlc
              item["samsung"] = samsung
              item["vlc_note"] = vlc_note
              item["samsung_note"] = samsung_note
              item["tested_on"] = TESTED_ON

              # These are fresh retests: recalculate any old explicit decision/reason
              # from the new playback/language evidence instead of pinning stale facts.
              item.pop("decision", None)
              item.pop("reason", None)
              item.pop("language_match", None)

              # The general note is part of this retest. A blank note supersedes stale
              # failure prose from older manual tests while provenance/discovery remain.
              if note:
                  item["notes"] = note
              else:
                  item.pop("notes", None)

              # Clear an old manual exclusion only for a clean two-device pass whose
              # observed language agrees with the row's expected language (or where no
              # expected language was recorded). Partial/failed retests keep exclusions.
              expected = set(item.get("expected_language_codes") or [])
              if vlc == "works" and samsung == "works" and (not expected or language in expected):
                  item.pop("exclude_from_playlist", None)

              channels[pos] = item
              updated_names.append(display_name)

          if missing:
              raise SystemExit("Missing exact audit URL(s):\n" + "\n".join(missing))
          if len(updated_names) != len(RETESTS):
              raise SystemExit(f"Expected {len(RETESTS)} updates, got {len(updated_names)}")

          payload["channels"] = channels
          payload = compact_manual_audit_payload(payload)
          AUDIT.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Updated {len(updated_names)} manual audit records for {TESTED_ON}.")
          PY

      - name: Validate audit-focused tests
        run: python3 -m unittest discover -s tests -p 'test_audit*.py'

      - name: Commit audit update and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_one_time_audit_retests_2026_08_14.yml
          git add audit.json
          git diff --cached --check
          git commit -m "Record August 14 manual playback retests"
          git push
