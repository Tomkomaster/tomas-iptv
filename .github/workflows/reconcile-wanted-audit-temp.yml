name: Temporary wanted-vs-audit reconciliation

on:
  push:
    branches:
      - reconcile-wanted-audit-2026-08-22

permissions:
  contents: write

jobs:
  strong-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile-wanted-audit-2026-08-22
          fetch-depth: 0

      - name: Reconcile by base tvg-id and normalized channel identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, unicodedata
          from pathlib import Path

          countries = ["at", "hu", "sk", "cz", "ro", "rs"]
          cset = {c.upper() for c in countries}
          audit = json.loads(Path("audit.json").read_text(encoding="utf-8"))["channels"]

          def norm_name(s):
              s = unicodedata.normalize("NFKC", s or "").casefold().replace("&", " and ")
              s = re.sub(r"\b(feed|stream)\s*\d+\b", " ", s)
              s = re.sub(r"\b(hd|sd|uhd|4k|1080p|720p|576p|432p)\b", " ", s)
              s = re.sub(r"[^a-z0-9\u00c0-\u024f]+", " ", s)
              return " ".join(s.split())

          def tvg_base(s):
              return (s or "").split("@", 1)[0].strip().casefold()

          verified = []
          for a in audit:
              if a.get("vlc") != "works" or a.get("samsung") != "works" or a.get("exclude_from_playlist") is True:
                  continue
              cc = (a.get("output_country_code") or a.get("playlist_country_code") or "").upper()
              if cc in cset:
                  verified.append(a)

          removed = []
          changed = []
          for cc in countries:
              path = Path(f"data/wanted_channels_{cc}.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              key = "channels" if "channels" in data else "entries"
              before = data[key]
              kept = []
              for w in before:
                  wcc = (w.get("country_code") or w.get("country") or cc).upper()
                  wn = norm_name(w.get("channel"))
                  wt = tvg_base(w.get("tvg_id"))
                  matches = []
                  for a in verified:
                      acc = (a.get("output_country_code") or a.get("playlist_country_code") or "").upper()
                      if acc != wcc:
                          continue
                      an = norm_name(a.get("channel"))
                      at = tvg_base(a.get("tvg_id"))
                      why = None
                      if wt and at and wt == at:
                          why = "base_tvg_id"
                      elif wn and an and wn == an:
                          why = "normalized_channel"
                      if why:
                          matches.append((why, a))
                  if matches:
                      # Base tvg-id is authoritative when present; otherwise exact normalized name.
                      matches.sort(key=lambda x: 0 if x[0] == "base_tvg_id" else 1)
                      why, a = matches[0]
                      removed.append({"country": wcc, "wanted": w.get("channel") or w.get("tvg_id"), "wanted_tvg_id": w.get("tvg_id"), "reason": why, "audit_channel": a.get("channel"), "audit_tvg_id": a.get("tvg_id"), "url": a.get("stream_url"), "tested_on": a.get("tested_on")})
                  else:
                      kept.append(w)
              if len(kept) != len(before):
                  data[key] = kept
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  changed.append({"path": str(path), "before": len(before), "after": len(kept)})

          Path("reconcile_wanted_audit_strong_report.json").write_text(json.dumps({"verified_rows": len(verified), "removed": removed, "changed": changed}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"removed": removed, "changed": changed}, ensure_ascii=False, indent=2))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wanted_channels_*.json reconcile_wanted_audit_strong_report.json
          git commit -m "Reconcile wanted catalogs by verified channel identity" || true
          git push origin HEAD:reconcile-wanted-audit-2026-08-22
