name: Validate live country EPG mappings

on:
  push:
    branches:
      - agent/country-aware-epg

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build stable playlists
        run: python3 build.py --strict
      - name: Check current upstream EPG mappings
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git .epg-builder
          python3 epg_country_prepare.py \
            --config config.json \
            --epg-root .epg-builder \
            --output .epg.channels.xml \
            --report .epg-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.epg-coverage.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'playlist_tvg_ids': data['playlist_tvg_ids'],
              'matched_tvg_ids': data['matched_tvg_ids'],
              'mapping_coverage_percent': data['mapping_coverage_percent'],
              'countries': {
                  code: {
                      'playlist_tvg_ids': info['playlist_tvg_ids'],
                      'matched_tvg_ids': info['matched_tvg_ids'],
                      'mapping_coverage_percent': info['mapping_coverage_percent'],
                  }
                  for code, info in data['countries'].items()
              },
          }, indent=2))
          targets = [
              'MarkizaDajto.sk', 'MarkizaDoma.sk', 'Jojko.sk', 'LalaTV.sk',
              'MarkizaKlasik.sk', 'MarkizaKrimi.sk', 'ArenaSport1.sk@SD',
              'ArenaSport2.sk@SD', 'ducktvPLUS.sk@SD', 'HAHATV.sk@SD',
              'PrimaCoolSK.sk@SD', 'PrimaKrimiSK.sk@HD', 'Ocko.cz@SD',
              'ATVSpirit.hu@SD',
          ]
          matched = {item['tvg_id']: item['provider'] for item in data['matched']}
          print('Target mapping results:')
          for tvg_id in targets:
              print(f"- {tvg_id}: {matched.get(tvg_id, 'UNMAPPED')}")
          PY
