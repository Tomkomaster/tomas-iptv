name: Agent priority logo diagnostic

on:
  push:
    branches:
      - agent/p2-logo-canonical-scorecard

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build current outputs
        run: python3 -m tools.reliable_build --strict
      - name: Print unmatched stable priority logo targets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import tools.priority_coverage as pc
          from tools.research_exports import load_audit_rows, normalize_name, normalize_tvg_id
          from wanted_channels import load_wanted_channels

          audit_rows = load_audit_rows(Path('public/audit.csv'))
          config = json.loads(Path('config.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('data/research_priority.json').read_text(encoding='utf-8'))
          wanted = load_wanted_channels(Path('data/wanted_channels.json'))
          logo = json.loads(Path('public/logo-quality.json').read_text(encoding='utf-8'))
          logo_rows = list(logo.get('channels') or [])
          original = pc._priority_logo_summary

          def debug_summary(targets, logo_quality):
              result = original(targets, logo_quality)
              stable = [t for t in targets if t.get('status') == 'WORKING']
              misses = []
              for target in stable:
                  match = pc._logo_row_for_target(target, logo_rows)
                  if match is None:
                      country = str(target.get('country') or '').upper()
                      same_country = [r for r in logo_rows if str(r.get('country_code') or '').upper() == country]
                      name = normalize_name(target.get('channel', ''))
                      tid = normalize_tvg_id(target.get('tvg_id', ''))
                      hints = [
                          {'channel': r.get('channel'), 'tvg_id': r.get('tvg_id'), 'quality': r.get('quality_category')}
                          for r in same_country
                          if (name and (name in normalize_name(r.get('channel', '')) or normalize_name(r.get('channel', '')) in name))
                          or (tid and tid.split('.')[0] in normalize_tvg_id(r.get('tvg_id', '')))
                      ][:5]
                      misses.append({'target': target, 'hints': hints})
              if misses:
                  print('UNMATCHED', json.dumps(misses, ensure_ascii=False, sort_keys=True))
              return result

          pc._priority_logo_summary = debug_summary
          coverage = pc.build_priority_coverage(
              audit_rows,
              config=config,
              priority_policy=policy,
              wanted_channels=wanted,
              logo_quality=logo,
          )
          print('SUMMARY', json.dumps(coverage.get('logo_summary'), ensure_ascii=False, sort_keys=True))
          PY
