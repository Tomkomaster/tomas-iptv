name: Validate healthy SK/CZ EPG provider

on:
  push:
    branches:
      - fix/healthy-sk-cz-epg-provider

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests and strict playlist build
        run: |
          python3 -m unittest discover -s tests -v
          python3 build.py --strict
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build full EPG and report country coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epg-builder
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git .epg-builder
          cd .epg-builder
          npm ci >/dev/null
          cd "$GITHUB_WORKSPACE"

          python3 epg_country_prepare.py \
            --config config.json \
            --epg-root .epg-builder \
            --output .epg.channels.xml \
            --report .epg-iptv-coverage.json

          cd .epg-builder
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/.epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/.epg-iptv.xml" \
            --maxConnections=3
          cd "$GITHUB_WORKSPACE"

          curl --fail --location --silent --show-error --retry 3 \
            https://epgshare01.online/epgshare01/epg_ripper_HU1.xml.gz \
            -o .epg-external.download

          python3 epg_merge.py \
            --playlist public/tv.m3u \
            --iptv-guide .epg-iptv.xml \
            --iptv-coverage .epg-iptv-coverage.json \
            --external .epg-external.download \
            --external-provider epgshare01.online \
            --preferred-iptv-provider mediaklikk.hu \
            --future-days 7 \
            --output public/guide.xml \
            --report public/epg-coverage.json

          python3 local_epg.py \
            --playlist public/tv.m3u \
            --guide public/guide.xml \
            --coverage public/epg-coverage.json \
            --report public/local-epg.json \
            --future-days 7

          python3 epg_health.py \
            --coverage public/epg-coverage.json \
            --guide public/guide.xml \
            --output public/epg-health.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('public/epg-health.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('public/epg-coverage.json').read_text(encoding='utf-8'))
          print('FINAL_EPG_HEALTH')
          print(json.dumps({
              'playlist_tvg_ids': health['playlist_tvg_ids'],
              'mapped_tvg_ids': health['mapped_tvg_ids'],
              'channels_with_programmes': health['channels_with_programmes'],
              'actual_programme_coverage_percent': health['actual_programme_coverage_percent'],
              'mapped_channels_effective_percent': health['mapped_channels_effective_percent'],
              'countries': health['countries'],
              'mapped_without_programmes': health['mapped_without_programmes'],
          }, ensure_ascii=False, indent=2))

          matched = {item['tvg_id']: item for item in coverage.get('matched', [])}
          for tvg_id in [
              'ArenaSport1.sk@SD', 'ArenaSport2.sk@SD', 'LalaTV.sk',
              'Ocko.cz@SD', 'SpektrumHome.cz@SD', 'ducktvPLUS.sk@SD',
              'HAHATV.sk@SD', 'MarkizaKrimi.sk',
          ]:
              print('TARGET', tvg_id, matched.get(tvg_id, 'UNMAPPED'))

          # The five proven replacements must all have real programmes in the final guide.
          empty = {item['tvg_id'] for item in health.get('mapped_without_programmes', [])}
          for tvg_id in [
              'ArenaSport1.sk@SD', 'ArenaSport2.sk@SD', 'LalaTV.sk',
              'Ocko.cz@SD', 'SpektrumHome.cz@SD',
          ]:
              if tvg_id in empty:
                  raise SystemExit(f'{tvg_id} is still mapped without programmes')
          PY
