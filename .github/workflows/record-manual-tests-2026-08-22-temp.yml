name: Temporary record manual playback tests

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-manual-tests-2026-08-22
          fetch-depth: 0

      - name: Record exact manual playback results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          TESTED_ON = '2026-08-22'
          tests = [
              dict(cc='HU', lang='hun', channel='M4 Sport', tvg_id='M4Sport.hu@SD', url='http://88.212.15.19/live/uatlmvixrr/index.m3u8', vlc='works', samsung='works'),
              dict(cc='HU', lang='hun', channel='M4 Sport', tvg_id='M4Sport.hu@SD', url='https://7nyaler.streamhostingcdn.top/stream/80/index.m3u8', vlc='works', samsung='format_error'),
              dict(cc='HU', lang='hun', channel='M4 Sport', tvg_id='M4Sport.hu@SD', url='http://88.212.15.19/live/m4_hun/index.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='HU', lang='hun', channel='M4 Sport Plus', tvg_id='M4SportPlus.hu', url='https://sktv-forwarders.7m.pl/get.php?x=M4Plus', vlc='generic_error', samsung='format_error'),
              dict(cc='HU', lang='hun', channel='M4 Sport', tvg_id='M4Sport.hu@SD', url='https://c401-node62-cdn.connectmedia.hu/110110/5dd8dc6d853c9b7f94db85646ed44326/641177e3/index.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='HU', lang='hun', channel='M4 Sport', tvg_id='M4Sport.hu@SD', url='http://c202-node61-cdn.connectmedia.hu/110104/657ed1d307300865a03a222af3d19249/638bd144/index.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='SK', lang='slk', channel='JOJ Plus', tvg_id='JOJPlus.sk', url='https://live.cdn.joj.sk/live/andromeda/plus-720.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='SK', lang='slk', channel='JOJ Krimi', tvg_id='JOJWAU.sk', url='https://live.cdn.joj.sk/live/andromeda/wau-720.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='SK', lang='slk', channel='JOJ Šport', tvg_id='JOJSport.sk', url='https://live.cdn.joj.sk/live/andromeda/joj_sport-720.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='SK', lang='slk', channel='JOJ Cinema', tvg_id='JOJCinema.sk', url='https://live.cdn.joj.sk/live/andromeda/cinema-720.m3u8', vlc='generic_error', samsung='format_error'),
              dict(cc='SK', lang='slk', channel='Nova International', tvg_id=None, url='http://tvh.cyn.cz/stream/channelid/1406456571?profile=pass', vlc='generic_error', samsung='format_error'),
              dict(cc='SK', lang='slk', channel='National Geographic', tvg_id=None, url='http://88.212.15.19/live/test_ngc/playlist.m3u8', vlc='works', samsung='works'),
              dict(cc='SK', lang='slk', channel='National Geographic Wild', tvg_id=None, url='http://88.212.15.29/live/test_ngw/playlist.m3u8', vlc='works', samsung='works'),
          ]

          audit_path = Path('audit.json')
          payload = json.loads(audit_path.read_text(encoding='utf-8'))
          rows = payload['channels']

          by_url = {}
          for i, row in enumerate(rows):
              url = str(row.get('stream_url') or '').strip()
              if url:
                  by_url.setdefault(url, []).append(i)
          duplicates = {u: idxs for u, idxs in by_url.items() if len(idxs) > 1}
          if duplicates:
              raise SystemExit(f'Pre-existing exact audit duplicates: {duplicates!r}')

          added = 0
          updated = 0
          for test in tests:
              matches = by_url.get(test['url'], [])
              if len(matches) > 1:
                  raise SystemExit(f'Duplicate exact test URL in audit: {test["url"]}')
              if matches:
                  row = rows[matches[0]]
                  updated += 1
              else:
                  row = {'channel': test['channel'], 'stream_url': test['url']}
                  rows.append(row)
                  by_url[test['url']] = [len(rows)-1]
                  added += 1

              row['channel'] = test['channel']
              row['stream_url'] = test['url']
              if test['tvg_id']:
                  row['tvg_id'] = test['tvg_id']
              row['playlist_country_code'] = test['cc']
              row['output_country_code'] = test['cc']
              row['expected_language_codes'] = [test['lang']]
              row['observed_language_codes'] = [test['lang']]
              row['language_match'] = 'yes'
              row['vlc'] = test['vlc']
              row['samsung'] = test['samsung']
              row['vlc_note'] = 'ok' if test['vlc'] == 'works' else 'VLC immediately skips to the next channel.'
              row['samsung_note'] = 'ok' if test['samsung'] == 'works' else 'NOT_SUPPORTED_FILE'
              row['tested_on'] = TESTED_ON
              row['provenance'] = 'User-provided manual playback result'
              row['discovery'] = 'Manual VLC + Samsung test supplied 2026-08-22'

              if test['vlc'] == 'works' and test['samsung'] == 'works':
                  row.pop('decision', None)
                  row.pop('reason', None)
                  row['notes'] = 'Passed both manual playback tests.'
                  row['exclude_from_playlist'] = False
              elif test['vlc'] == 'works':
                  row['decision'] = 'pc_only'
                  row['reason'] = 'The stream works in VLC but Samsung reports NOT_SUPPORTED_FILE.'
                  row['notes'] = 'Keep this exact feed out of the Samsung-safe shared playlist.'
                  row['exclude_from_playlist'] = True
              else:
                  row['decision'] = 'rejected'
                  row['reason'] = 'This exact feed failed on both tested devices.'
                  row['notes'] = 'VLC skips immediately and Samsung reports NOT_SUPPORTED_FILE. Reject this exact URL only.'
                  row['exclude_from_playlist'] = True

          audit_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # M4 Sport is solved by the new dual-device working feed.
          wanted_path = Path('data/wanted_channels_hu.json')
          wanted = json.loads(wanted_path.read_text(encoding='utf-8'))
          before = len(wanted['channels'])
          wanted['channels'] = [r for r in wanted['channels'] if not (r.get('country_code') == 'HU' and r.get('channel') == 'M4 Sport')]
          if before - len(wanted['channels']) != 1:
              raise SystemExit('Expected to remove exactly one HU M4 Sport wanted target')
          wanted_path.write_text(json.dumps(wanted, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Persist the three newly successful exact feeds in extras.
          extras = {
              Path('extras/hu.m3u'): [
                  ('http://88.212.15.19/live/uatlmvixrr/index.m3u8', '# M4 Sport — manually verified on VLC + Samsung 2026-08-22\n#EXTINF:-1 tvg-id="M4Sport.hu@SD" tvg-name="M4 Sport",M4 Sport\nhttp://88.212.15.19/live/uatlmvixrr/index.m3u8\n'),
              ],
              Path('extras/sk.m3u'): [
                  ('http://88.212.15.19/live/test_ngc/playlist.m3u8', '# National Geographic — manually verified on VLC + Samsung 2026-08-22\n#EXTINF:-1 tvg-name="National Geographic",National Geographic\nhttp://88.212.15.19/live/test_ngc/playlist.m3u8\n'),
                  ('http://88.212.15.29/live/test_ngw/playlist.m3u8', '# National Geographic Wild — manually verified on VLC + Samsung 2026-08-22\n#EXTINF:-1 tvg-name="National Geographic Wild",National Geographic Wild\nhttp://88.212.15.29/live/test_ngw/playlist.m3u8\n'),
              ],
          }
          for path, blocks in extras.items():
              text = path.read_text(encoding='utf-8')
              append = []
              for url, block in blocks:
                  if url not in text:
                      append.append(block)
              if append:
                  marker = '\n# ============================================================\n# MANUALLY VERIFIED FINDS — 2026-08-22\n# ============================================================\n'
                  if 'MANUALLY VERIFIED FINDS — 2026-08-22' not in text:
                      text = text.rstrip() + marker
                  text = text.rstrip() + '\n' + '\n'.join(append) + '\n'
                  path.write_text(text, encoding='utf-8')

          # Guard exact results and boolean decisions.
          check = json.loads(audit_path.read_text(encoding='utf-8'))['channels']
          final = {r.get('stream_url'): r for r in check if r.get('stream_url') in {t['url'] for t in tests}}
          if len(final) != 13:
              raise SystemExit(f'Expected 13 exact tested URLs, found {len(final)}')
          for test in tests:
              row = final[test['url']]
              expected_exclude = not (test['vlc'] == 'works' and test['samsung'] == 'works')
              if row.get('exclude_from_playlist') is not expected_exclude:
                  raise SystemExit(f'Wrong exclusion for {test["url"]}')
          print(f'Recorded 13 tests: {added} new audit rows, {updated} updated rows; removed M4 Sport from wanted.')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json data/wanted_channels_hu.json extras/hu.m3u extras/sk.m3u
          git commit -m "Record latest manual playback tests"
          git push origin HEAD:record-manual-tests-2026-08-22
