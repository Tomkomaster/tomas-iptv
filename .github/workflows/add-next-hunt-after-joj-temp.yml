name: Temporary add next hunt candidates after JOJ results

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-joj-plus-krimi-results-2026-08-22
          fetch-depth: 0

      - name: Append fresh untested candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = {
              Path('extras/sk.m3u'): [
                  (
                      'http://88.212.15.50/live/test_joj_sport_hd_hevc/playlist.m3u8',
                      '# JOJ Šport — alternate Antik-origin HEVC candidate on 88.212.15.50\n# Fresh exact URL from a separate CZ/SK playlist source; manual PC + Samsung test required.\n#EXTINF:-1 tvg-id="JOJSport.sk" tvg-name="JOJ Šport",JOJ Šport [TEST] [88.212.15.50 HEVC]\nhttp://88.212.15.50/live/test_joj_sport_hd_hevc/playlist.m3u8\n'
                  ),
                  (
                      'http://88.212.15.50/live/test_nova_int_25p/playlist.m3u8',
                      '# Nova International — alternate Antik-origin 25p candidate on 88.212.15.50\n# Different exact host from previously rejected Nova International candidates.\n#EXTINF:-1 tvg-name="Nova International",Nova International [TEST] [88.212.15.50]\nhttp://88.212.15.50/live/test_nova_int_25p/playlist.m3u8\n'
                  ),
              ],
              Path('extras/hu.m3u'): [
                  (
                      'http://152.66.115.226:33391/bysid/103',
                      '# Duna World / M4+ Sport — alternate transport endpoint candidate\n# This source is labeled Duna World / M4+ Sport; verify both playback and that M4+ Sport programming is active when tested.\n#EXTINF:-1 tvg-name="M4 Sport Plus",M4 Sport Plus / Duna World [TEST] [bysid 103]\nhttp://152.66.115.226:33391/bysid/103\n'
                  ),
              ],
          }

          audit = Path('audit.json').read_text(encoding='utf-8')
          added_count = 0
          for path, entries in candidates.items():
              text = path.read_text(encoding='utf-8')
              blocks = []
              for url, block in entries:
                  if url in audit:
                      raise SystemExit(f'Candidate already present in audit.json: {url}')
                  if url in text:
                      raise SystemExit(f'Candidate already present in {path}: {url}')
                  blocks.append(block)
                  added_count += 1
              marker = '\n# ============================================================\n# HUNT BATCH 4 — 2026-08-22 — FRESH UNTESTED CANDIDATES\n# ============================================================\n'
              if 'HUNT BATCH 4 — 2026-08-22 — FRESH UNTESTED CANDIDATES' not in text:
                  text = text.rstrip() + marker
              text = text.rstrip() + '\n' + '\n'.join(blocks) + '\n'
              path.write_text(text, encoding='utf-8')

          if added_count != 3:
              raise SystemExit(f'Expected 3 fresh candidates, got {added_count}')
          print('Added 3 fresh hunt candidates')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/sk.m3u extras/hu.m3u
          git commit -m "Add next channel hunt candidates"
          git push origin HEAD:record-joj-plus-krimi-results-2026-08-22
